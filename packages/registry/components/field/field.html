<fieldset class="bootcn-fieldset">
  <legend class="bootcn-fieldset__legend">Payment method</legend>
  <p class="bootcn-fieldset__description">All transactions are secure and encrypted.</p>

  <div class="bootcn-field">
    <label class="bootcn-label" for="bootcn-field-name">Name on card</label>
    <input
      class="form-control bootcn-input"
      type="text"
      id="bootcn-field-name"
      name="cc-name"
      autocomplete="cc-name"
    />
  </div>

  <div class="bootcn-field">
    <label class="bootcn-label" for="bootcn-field-number">Card number</label>
    <input
      class="form-control bootcn-input"
      type="text"
      id="bootcn-field-number"
      name="cc-number"
      inputmode="numeric"
      autocomplete="cc-number"
      aria-describedby="bootcn-field-number-help"
    />
    <p class="bootcn-field__help" id="bootcn-field-number-help">
      Enter the 16 digits without spaces.
    </p>
  </div>

  <div class="bootcn-field-row">
    <div class="bootcn-field">
      <label class="bootcn-label" for="bootcn-field-month">Month</label>
      <select
        class="form-select bootcn-select"
        id="bootcn-field-month"
        name="cc-exp-month"
        autocomplete="cc-exp-month"
      >
        <option value="">MM</option>
        <option value="01">01</option>
        <option value="02">02</option>
        <option value="03">03</option>
      </select>
    </div>
    <div class="bootcn-field">
      <label class="bootcn-label" for="bootcn-field-year">Year</label>
      <select
        class="form-select bootcn-select"
        id="bootcn-field-year"
        name="cc-exp-year"
        autocomplete="cc-exp-year"
      >
        <option value="">YYYY</option>
        <option value="2027">2027</option>
        <option value="2028">2028</option>
      </select>
    </div>
    <div class="bootcn-field">
      <label class="bootcn-label" for="bootcn-field-cvc">CVC</label>
      <input
        class="form-control bootcn-input"
        type="text"
        id="bootcn-field-cvc"
        name="cc-csc"
        inputmode="numeric"
        autocomplete="cc-csc"
        aria-invalid="true"
        aria-describedby="bootcn-field-cvc-error"
      />
      <p class="bootcn-field__error" id="bootcn-field-cvc-error">Enter the 3 digits on the back.</p>
    </div>
  </div>

  <div class="bootcn-field bootcn-field--horizontal">
    <div class="bootcn-field__text">
      <label class="bootcn-label" for="bootcn-field-save">Save card</label>
      <p class="bootcn-field__help" id="bootcn-field-save-help">Use it for future payments.</p>
    </div>
    <div class="form-check form-switch bootcn-switch">
      <input
        class="form-check-input bootcn-switch__input"
        type="checkbox"
        role="switch"
        id="bootcn-field-save"
        name="save"
        aria-describedby="bootcn-field-save-help"
      />
    </div>
  </div>
</fieldset>
