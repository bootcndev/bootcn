<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootcn Field preview</title>
    <script>
      // Preview theme: ?theme=dark|light, else the docs page around the frame, else light.
      (function () {
        var theme = new URLSearchParams(location.search).get('theme');
        if (!theme) {
          try {
            theme =
              window.parent !== window &&
              window.parent.document.documentElement.classList.contains('dark')
                ? 'dark'
                : 'light';
          } catch (error) {
            theme = 'light';
          }
        }
        document.documentElement.setAttribute('data-bs-theme', theme === 'dark' ? 'dark' : 'light');
        // ?dir=rtl: right to left, with Bootstrap's RTL stylesheet.
        if (new URLSearchParams(location.search).get('dir') === 'rtl') {
          document.documentElement.setAttribute('dir', 'rtl');
          new MutationObserver(function (records, observer) {
            var link = document.querySelector('link[href*="bootstrap.min.css"]');
            if (!link) return;
            link.href = link.href.replace('bootstrap.min.css', 'bootstrap.rtl.min.css');
            observer.disconnect();
          }).observe(document.documentElement, { childList: true, subtree: true });
        }
      })();
    </script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="../../themes/tokens/tokens.css" />
    <link rel="stylesheet" href="../input/input.css" />
    <link rel="stylesheet" href="../select/select.css" />
    <link rel="stylesheet" href="../switch/switch.css" />
    <link rel="stylesheet" href="../label/label.css" />
    <link rel="stylesheet" href="field.css" />
  </head>
  <body>
    <main class="container py-4">
      <h1 class="h4 mb-4">Field</h1>
      <fieldset class="bootcn-fieldset">
        <legend class="bootcn-fieldset__legend">Payment method</legend>
        <p class="bootcn-fieldset__description">All transactions are secure and encrypted.</p>

        <div class="bootcn-field">
          <label class="bootcn-label" for="bootcn-field-name">Name on card</label>
          <input
            class="form-control bootcn-input"
            type="text"
            id="bootcn-field-name"
            name="cc-name"
            autocomplete="cc-name"
          />
        </div>

        <div class="bootcn-field">
          <label class="bootcn-label" for="bootcn-field-number">Card number</label>
          <input
            class="form-control bootcn-input"
            type="text"
            id="bootcn-field-number"
            name="cc-number"
            inputmode="numeric"
            autocomplete="cc-number"
            aria-describedby="bootcn-field-number-help"
          />
          <p class="bootcn-field__help" id="bootcn-field-number-help">
            Enter the 16 digits without spaces.
          </p>
        </div>

        <div class="bootcn-field-row">
          <div class="bootcn-field">
            <label class="bootcn-label" for="bootcn-field-month">Month</label>
            <select
              class="form-select bootcn-select"
              id="bootcn-field-month"
              name="cc-exp-month"
              autocomplete="cc-exp-month"
            >
              <option value="">MM</option>
              <option value="01">01</option>
              <option value="02">02</option>
              <option value="03">03</option>
            </select>
          </div>
          <div class="bootcn-field">
            <label class="bootcn-label" for="bootcn-field-year">Year</label>
            <select
              class="form-select bootcn-select"
              id="bootcn-field-year"
              name="cc-exp-year"
              autocomplete="cc-exp-year"
            >
              <option value="">YYYY</option>
              <option value="2027">2027</option>
              <option value="2028">2028</option>
            </select>
          </div>
          <div class="bootcn-field">
            <label class="bootcn-label" for="bootcn-field-cvc">CVC</label>
            <input
              class="form-control bootcn-input"
              type="text"
              id="bootcn-field-cvc"
              name="cc-csc"
              inputmode="numeric"
              autocomplete="cc-csc"
              aria-invalid="true"
              aria-describedby="bootcn-field-cvc-error"
            />
            <p class="bootcn-field__error" id="bootcn-field-cvc-error">
              Enter the 3 digits on the back.
            </p>
          </div>
        </div>

        <div class="bootcn-field bootcn-field--horizontal">
          <div class="bootcn-field__text">
            <label class="bootcn-label" for="bootcn-field-save">Save card</label>
            <p class="bootcn-field__help" id="bootcn-field-save-help">
              Use it for future payments.
            </p>
          </div>
          <div class="form-check form-switch bootcn-switch">
            <input
              class="form-check-input bootcn-switch__input"
              type="checkbox"
              role="switch"
              id="bootcn-field-save"
              name="save"
              aria-describedby="bootcn-field-save-help"
            />
          </div>
        </div>
      </fieldset>
    </main>
  </body>
</html>
