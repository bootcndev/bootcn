<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootcn Date range input preview</title>
    <script>
      // Preview theme: ?theme=dark|light, else the docs page around the frame, else light.
      (function () {
        var theme = new URLSearchParams(location.search).get('theme');
        if (!theme) {
          try {
            theme =
              window.parent !== window &&
              window.parent.document.documentElement.classList.contains('dark')
                ? 'dark'
                : 'light';
          } catch (error) {
            theme = 'light';
          }
        }
        document.documentElement.setAttribute('data-bs-theme', theme === 'dark' ? 'dark' : 'light');
        // ?dir=rtl: right to left, with Bootstrap's RTL stylesheet.
        if (new URLSearchParams(location.search).get('dir') === 'rtl') {
          document.documentElement.setAttribute('dir', 'rtl');
          new MutationObserver(function (records, observer) {
            var link = document.querySelector('link[href*="bootstrap.min.css"]');
            if (!link) return;
            link.href = link.href.replace('bootstrap.min.css', 'bootstrap.rtl.min.css');
            observer.disconnect();
          }).observe(document.documentElement, { childList: true, subtree: true });
        }
      })();
    </script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="../../themes/tokens/tokens.css" />
    <link rel="stylesheet" href="../input/input.css" />
    <link rel="stylesheet" href="../select/select.css" />
    <link rel="stylesheet" href="../switch/switch.css" />
    <link rel="stylesheet" href="../label/label.css" />
    <link rel="stylesheet" href="../field/field.css" />
    <link rel="stylesheet" href="../date-input/date-input.css" />
    <link rel="stylesheet" href="date-range-input.css" />
  </head>
  <body>
    <main class="container py-4">
      <h1 class="h4 mb-4">Date range input</h1>
      <div
        class="bootcn-date-range-input"
        data-bootcn-date-range-input
        role="group"
        aria-labelledby="bootcn-date-range-input-label"
        aria-describedby="bootcn-date-range-input-help bootcn-date-range-input-error"
        data-error="The end date is before the start date."
      >
        <p class="bootcn-label" id="bootcn-date-range-input-label">Stay</p>
        <div class="bootcn-date-range-input__control">
          <div
            class="bootcn-date-input bootcn-date-range-input__part"
            data-bootcn-date-input
            data-locale="en-GB"
          >
            <label class="visually-hidden" for="bootcn-date-range-input-start">Check-in</label>
            <input
              class="form-control bootcn-input"
              type="date"
              id="bootcn-date-range-input-start"
              name="check_in"
              value="2026-12-18"
              min="2026-11-01"
              data-bootcn-date-input-native
            />
          </div>
          <span class="bootcn-date-range-input__separator" aria-hidden="true">–</span>
          <div
            class="bootcn-date-input bootcn-date-range-input__part"
            data-bootcn-date-input
            data-locale="en-GB"
          >
            <label class="visually-hidden" for="bootcn-date-range-input-end">Check-out</label>
            <input
              class="form-control bootcn-input"
              type="date"
              id="bootcn-date-range-input-end"
              name="check_out"
              value="2026-12-22"
              min="2026-11-01"
              data-bootcn-date-input-native
            />
          </div>
        </div>
        <p class="bootcn-field__help" id="bootcn-date-range-input-help">
          Check-in and check-out, day/month/year.
        </p>
        <p class="bootcn-date-range-input__error" id="bootcn-date-range-input-error" hidden></p>
        <p class="visually-hidden" role="status" data-bootcn-date-range-input-status></p>
      </div>
    </main>
    <script src="../date-input/date-input.js"></script>
    <script src="date-range-input.js"></script>
  </body>
</html>
