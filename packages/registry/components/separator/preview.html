<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootcn Separator preview</title>
    <script>
      // Preview theme: ?theme=dark|light, else the docs page around the frame, else light.
      (function () {
        var theme = new URLSearchParams(location.search).get('theme');
        if (!theme) {
          try {
            theme =
              window.parent !== window &&
              window.parent.document.documentElement.classList.contains('dark')
                ? 'dark'
                : 'light';
          } catch (error) {
            theme = 'light';
          }
        }
        document.documentElement.setAttribute('data-bs-theme', theme === 'dark' ? 'dark' : 'light');
      })();
    </script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="../../themes/tokens/tokens.css" />
    <link rel="stylesheet" href="separator.css" />
  </head>
  <body>
    <main class="container py-4">
      <h1 class="h4 mb-4">Separator</h1>
      <p class="mb-0">Account</p>
      <hr class="bootcn-separator" />
      <p class="mb-0">Billing</p>

      <div class="d-flex align-items-center mt-4" style="height: 1.5rem">
        <span>Docs</span>
        <div
          class="bootcn-separator bootcn-separator--vertical"
          role="separator"
          aria-orientation="vertical"
        ></div>
        <span>Blog</span>
        <div
          class="bootcn-separator bootcn-separator--vertical"
          role="separator"
          aria-orientation="vertical"
        ></div>
        <span>Source</span>
      </div>

      <div class="bootcn-separator-label mt-4" role="separator" aria-label="or continue with">
        <span class="bootcn-separator-label__text" aria-hidden="true">or continue with</span>
      </div>
    </main>
  </body>
</html>
