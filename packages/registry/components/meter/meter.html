<div class="bootcn-meter">
  <div class="bootcn-meter__head">
    <label for="bootcn-meter-storage">Storage used</label>
    <span aria-hidden="true">72%</span>
  </div>
  <meter
    class="bootcn-meter__bar"
    id="bootcn-meter-storage"
    min="0"
    max="100"
    low="60"
    high="85"
    optimum="20"
    value="72"
  >
    72%
  </meter>
</div>

<div class="bootcn-meter">
  <div class="bootcn-meter__head">
    <label for="bootcn-meter-battery">Battery</label>
    <span aria-hidden="true">18%</span>
  </div>
  <meter
    class="bootcn-meter__bar"
    id="bootcn-meter-battery"
    min="0"
    max="100"
    low="25"
    high="60"
    optimum="100"
    value="18"
  >
    18%
  </meter>
</div>

<div class="bootcn-meter">
  <div class="bootcn-meter__head">
    <label for="bootcn-meter-signal">Signal strength</label>
    <span aria-hidden="true">90%</span>
  </div>
  <meter
    class="bootcn-meter__bar"
    id="bootcn-meter-signal"
    min="0"
    max="100"
    low="30"
    high="70"
    optimum="100"
    value="90"
  >
    90%
  </meter>
</div>
