<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootcn Aurora background preview</title>
    <script>
      // Preview theme: ?theme=dark|light, else the docs page around the frame, else light.
      (function () {
        var theme = new URLSearchParams(location.search).get('theme');
        if (!theme) {
          try {
            theme =
              window.parent !== window &&
              window.parent.document.documentElement.classList.contains('dark')
                ? 'dark'
                : 'light';
          } catch (error) {
            theme = 'light';
          }
        }
        document.documentElement.setAttribute('data-bs-theme', theme === 'dark' ? 'dark' : 'light');
        // ?dir=rtl: right to left, with Bootstrap's RTL stylesheet.
        if (new URLSearchParams(location.search).get('dir') === 'rtl') {
          document.documentElement.setAttribute('dir', 'rtl');
          new MutationObserver(function (records, observer) {
            var link = document.querySelector('link[href*="bootstrap.min.css"]');
            if (!link) return;
            link.href = link.href.replace('bootstrap.min.css', 'bootstrap.rtl.min.css');
            observer.disconnect();
          }).observe(document.documentElement, { childList: true, subtree: true });
        }
      })();
    </script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="../../themes/tokens/tokens.css" />
    <link rel="stylesheet" href="../button/button.css" />
    <link rel="stylesheet" href="aurora.css" />
  </head>
  <body>
    <main class="container py-4" style="max-width: 64rem">
      <h1 class="h4 mb-4">Aurora background</h1>
      <section class="bootcn-aurora" aria-labelledby="bootcn-aurora-title">
        <div class="bootcn-aurora__lights" aria-hidden="true">
          <span></span><span></span><span></span>
        </div>
        <div class="bootcn-aurora__content">
          <h2 class="bootcn-aurora__title" id="bootcn-aurora-title">Build better with Bootstrap</h2>
          <p class="bootcn-aurora__text">
            Soft, slow-moving light behind your hero, in your brand colours.
          </p>
          <a class="btn bootcn-button bootcn-button--default" href="#start">Get started</a>
        </div>
      </section>
    </main>
  </body>
</html>
