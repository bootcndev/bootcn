<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootcn Input preview</title>
    <script>
      // Preview theme: ?theme=dark|light, else the docs page around the frame, else light.
      (function () {
        var theme = new URLSearchParams(location.search).get('theme');
        if (!theme) {
          try {
            theme =
              window.parent !== window &&
              window.parent.document.documentElement.classList.contains('dark')
                ? 'dark'
                : 'light';
          } catch (error) {
            theme = 'light';
          }
        }
        document.documentElement.setAttribute('data-bs-theme', theme === 'dark' ? 'dark' : 'light');
      })();
    </script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="../../themes/tokens/tokens.css" />
    <link rel="stylesheet" href="input.css" />
  </head>
  <body>
    <main class="container py-4">
      <h1 class="h4 mb-3">Input</h1>

      <div class="d-flex flex-column gap-4" style="max-width: 24rem">
        <div class="bootcn-field">
          <label for="bootcn-input-name" class="form-label bootcn-field__label">Name</label>
          <input
            type="text"
            class="form-control bootcn-input"
            id="bootcn-input-name"
            name="name"
            autocomplete="name"
            aria-describedby="bootcn-input-name-help"
            placeholder="Jane Doe"
          />
          <p class="bootcn-field__help" id="bootcn-input-name-help">
            Shown on your public profile.
          </p>
        </div>

        <div class="bootcn-field">
          <label for="bootcn-input-email" class="form-label bootcn-field__label">Email</label>
          <input
            type="email"
            class="form-control bootcn-input"
            id="bootcn-input-email"
            name="email"
            autocomplete="email"
            value="not-an-email"
            aria-invalid="true"
            aria-describedby="bootcn-input-email-help bootcn-input-email-error"
          />
          <p class="bootcn-field__help" id="bootcn-input-email-help">We never share your email.</p>
          <div class="invalid-feedback" id="bootcn-input-email-error">
            Enter a valid email address.
          </div>
        </div>

        <div class="bootcn-field">
          <label for="bootcn-input-disabled" class="form-label bootcn-field__label">Disabled</label>
          <input
            type="text"
            class="form-control bootcn-input"
            id="bootcn-input-disabled"
            value="Read only"
            disabled
          />
        </div>

        <div class="bootcn-field">
          <label for="bootcn-input-search" class="form-label bootcn-field__label">Search</label>
          <div class="input-group">
            <span class="input-group-text" aria-hidden="true">
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                aria-hidden="true"
                focusable="false"
              >
                <circle cx="11" cy="11" r="7" />
                <path d="m20 20-3.5-3.5" />
              </svg>
            </span>
            <input
              type="search"
              class="form-control bootcn-input"
              id="bootcn-input-search"
              name="search"
              placeholder="Search projects"
            />
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
