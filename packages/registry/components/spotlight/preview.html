<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootcn Spotlight search preview</title>
    <script>
      // Preview theme: ?theme=dark|light, else the docs page around the frame, else light.
      (function () {
        var theme = new URLSearchParams(location.search).get('theme');
        if (!theme) {
          try {
            theme =
              window.parent !== window &&
              window.parent.document.documentElement.classList.contains('dark')
                ? 'dark'
                : 'light';
          } catch (error) {
            theme = 'light';
          }
        }
        document.documentElement.setAttribute('data-bs-theme', theme === 'dark' ? 'dark' : 'light');
        // ?dir=rtl: right to left, with Bootstrap's RTL stylesheet.
        if (new URLSearchParams(location.search).get('dir') === 'rtl') {
          document.documentElement.setAttribute('dir', 'rtl');
          new MutationObserver(function (records, observer) {
            var link = document.querySelector('link[href*="bootstrap.min.css"]');
            if (!link) return;
            link.href = link.href.replace('bootstrap.min.css', 'bootstrap.rtl.min.css');
            observer.disconnect();
          }).observe(document.documentElement, { childList: true, subtree: true });
        }
      })();
    </script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="../../themes/tokens/tokens.css" />
    <link rel="stylesheet" href="spotlight.css" />
  </head>
  <body>
    <main class="container py-4">
      <h1 class="h4 mb-4">Spotlight search</h1>
      <button
        type="button"
        class="bootcn-spotlight-trigger"
        data-bootcn-spotlight-open="#bootcn-spotlight"
        aria-haspopup="dialog"
      >
        <svg
          class="bootcn-icon"
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
          focusable="false"
        >
          <circle cx="11" cy="11" r="7" />
          <path d="m20 20-3.5-3.5" />
        </svg>
        <span class="bootcn-spotlight-trigger__label">Search…</span>
        <kbd class="bootcn-spotlight-trigger__kbd" aria-hidden="true">⌘K</kbd>
      </button>

      <dialog
        class="bootcn-spotlight"
        id="bootcn-spotlight"
        data-bootcn-spotlight
        data-shortcut="k"
        data-recent="acme-search"
        aria-labelledby="bootcn-spotlight-label"
      >
        <div class="bootcn-spotlight__panel">
          <div class="bootcn-spotlight__search">
            <svg
              class="bootcn-icon"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <circle cx="11" cy="11" r="7" />
              <path d="m20 20-3.5-3.5" />
            </svg>
            <label class="visually-hidden" id="bootcn-spotlight-label" for="bootcn-spotlight-input"
              >Search</label
            >
            <input
              class="bootcn-spotlight__input"
              id="bootcn-spotlight-input"
              type="text"
              role="combobox"
              aria-expanded="true"
              aria-controls="bootcn-spotlight-list"
              aria-autocomplete="list"
              placeholder="Search pages, people, projects…"
              autocomplete="off"
              spellcheck="false"
            />
            <span class="bootcn-spotlight__spinner" aria-hidden="true"></span>
            <button type="button" class="bootcn-spotlight__close" data-bootcn-spotlight-close>
              <kbd>Esc</kbd><span class="visually-hidden">Close search</span>
            </button>
          </div>
          <div
            class="bootcn-spotlight__results"
            id="bootcn-spotlight-list"
            role="listbox"
            aria-label="Results"
          ></div>
          <p class="bootcn-spotlight__empty" data-spotlight-empty hidden>
            No results for “<span data-spotlight-query></span>”.
          </p>
          <footer class="bootcn-spotlight__footer" aria-hidden="true">
            <span><kbd>↑</kbd><kbd>↓</kbd> to move</span>
            <span><kbd>↵</kbd> to open</span>
            <span><kbd>Esc</kbd> to close</span>
          </footer>
          <p class="visually-hidden" role="status" data-spotlight-status></p>
        </div>
