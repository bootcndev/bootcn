<div class="bootcn-resizable" data-bootcn-resizable style="height: 16rem; max-width: 32rem">
  <div class="bootcn-resizable__panel" id="bootcn-resizable-sidebar" style="flex-basis: 50%">
    <span>Sidebar</span>
  </div>
  <div
    class="bootcn-resizable__handle"
    role="separator"
    tabindex="0"
    aria-label="Resize sidebar"
    aria-orientation="vertical"
    aria-controls="bootcn-resizable-sidebar"
    aria-valuenow="50"
    aria-valuemin="20"
    aria-valuemax="80"
  >
    <span class="bootcn-resizable__grip" aria-hidden="true"></span>
  </div>
  <div class="bootcn-resizable__panel bootcn-resizable__panel--fill">
    <div class="bootcn-resizable bootcn-resizable--vertical" data-bootcn-resizable>
      <div class="bootcn-resizable__panel" id="bootcn-resizable-header" style="flex-basis: 30%">
        <span>Header</span>
      </div>
      <div
        class="bootcn-resizable__handle"
        role="separator"
        tabindex="0"
        aria-label="Resize header"
        aria-orientation="horizontal"
        aria-controls="bootcn-resizable-header"
        aria-valuenow="30"
        aria-valuemin="20"
        aria-valuemax="80"
      >
        <span class="bootcn-resizable__grip" aria-hidden="true"></span>
      </div>
      <div class="bootcn-resizable__panel bootcn-resizable__panel--fill">
        <span>Content</span>
      </div>
    </div>
  </div>
</div>
