<div class="d-flex flex-wrap gap-2">
  <button type="button" class="btn bootcn-button bootcn-button--default">Default</button>
  <button type="button" class="btn bootcn-button bootcn-button--secondary">Secondary</button>
  <button type="button" class="btn bootcn-button bootcn-button--outline">Outline</button>
  <button type="button" class="btn bootcn-button bootcn-button--ghost">Ghost</button>
  <button type="button" class="btn bootcn-button bootcn-button--link">Link</button>
  <button type="button" class="btn bootcn-button bootcn-button--destructive">Destructive</button>
</div>

<div class="d-flex flex-wrap gap-2 align-items-center mt-3">
  <button type="button" class="btn bootcn-button bootcn-button--default bootcn-button--sm">
    Small
  </button>
  <button type="button" class="btn bootcn-button bootcn-button--default">Medium</button>
  <button type="button" class="btn bootcn-button bootcn-button--default bootcn-button--lg">
    Large
  </button>
  <button
    type="button"
    class="btn bootcn-button bootcn-button--default bootcn-button--icon"
    aria-label="Add item"
  >
    <svg
      width="18"
      height="18"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      aria-hidden="true"
      focusable="false"
    >
      <path d="M12 5v14M5 12h14" />
    </svg>
  </button>
</div>

<button
  type="button"
  class="btn bootcn-button bootcn-button--default mt-3"
  aria-busy="true"
  disabled
>
  <span class="bootcn-button__spinner" aria-hidden="true"></span>
  <span>Saving</span>
</button>
