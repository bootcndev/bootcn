<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootcn Button preview</title>
    <script>
      // Preview theme: ?theme=dark|light, else the docs page around the frame, else light.
      (function () {
        var theme = new URLSearchParams(location.search).get('theme');
        if (!theme) {
          try {
            theme =
              window.parent !== window &&
              window.parent.document.documentElement.classList.contains('dark')
                ? 'dark'
                : 'light';
          } catch (error) {
            theme = 'light';
          }
        }
        document.documentElement.setAttribute('data-bs-theme', theme === 'dark' ? 'dark' : 'light');
      })();
    </script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="../../themes/tokens/tokens.css" />
    <link rel="stylesheet" href="button.css" />
  </head>
  <body>
    <main class="container py-4">
      <h1 class="h4 mb-3">Button</h1>

      <p class="text-muted mb-2">Variants</p>
      <div class="d-flex flex-wrap gap-2">
        <button type="button" class="btn bootcn-button bootcn-button--default">Default</button>
        <button type="button" class="btn bootcn-button bootcn-button--secondary">Secondary</button>
        <button type="button" class="btn bootcn-button bootcn-button--outline">Outline</button>
        <button type="button" class="btn bootcn-button bootcn-button--ghost">Ghost</button>
        <button type="button" class="btn bootcn-button bootcn-button--link">Link</button>
        <button type="button" class="btn bootcn-button bootcn-button--destructive">
          Destructive
        </button>
      </div>

      <p class="text-muted mb-2 mt-4">Sizes and icon</p>
      <div class="d-flex flex-wrap gap-2 align-items-center">
        <button type="button" class="btn bootcn-button bootcn-button--default bootcn-button--sm">
          Small
        </button>
        <button type="button" class="btn bootcn-button bootcn-button--default">Medium</button>
        <button type="button" class="btn bootcn-button bootcn-button--default bootcn-button--lg">
          Large
        </button>
        <button
          type="button"
          class="btn bootcn-button bootcn-button--default bootcn-button--icon"
          aria-label="Add item"
        >
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            aria-hidden="true"
            focusable="false"
          >
            <path d="M12 5v14M5 12h14" />
          </svg>
        </button>
      </div>

      <p class="text-muted mb-2 mt-4">States</p>
      <div class="d-flex flex-wrap gap-2 align-items-center">
        <button
          type="button"
          class="btn bootcn-button bootcn-button--default"
          aria-busy="true"
          disabled
        >
          <span class="bootcn-button__spinner" aria-hidden="true"></span>
          <span>Saving</span>
        </button>
        <button type="button" class="btn bootcn-button bootcn-button--default" disabled>
          Disabled
        </button>
        <a href="#" class="btn bootcn-button bootcn-button--outline">Anchor</a>
      </div>
    </main>
  </body>
</html>
