<button
  type="button"
  class="bootcn-context-menu__target"
  data-bootcn-context-menu="bootcn-context-menu-file"
  aria-haspopup="menu"
  aria-describedby="bootcn-context-menu-hint"
>
  <svg
    class="bootcn-icon"
    width="16"
    height="16"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    aria-hidden="true"
    focusable="false"
  >
    <path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z" />
    <path d="M14 3v6h6" />
  </svg>
  <span>report.pdf</span>
</button>
<p class="bootcn-context-menu__hint" id="bootcn-context-menu-hint">
  Right-click the file, or focus it and press Shift+F10, for actions.
</p>

<ul
  class="dropdown-menu bootcn-dropdown__menu bootcn-context-menu"
  id="bootcn-context-menu-file"
  role="menu"
  aria-label="File actions"
>
  <li role="none">
    <button
      class="dropdown-item bootcn-dropdown__item"
      type="button"
      role="menuitem"
      tabindex="-1"
      data-value="open"
      aria-keyshortcuts="Meta+O"
    >
      Open <span class="bootcn-dropdown__shortcut" aria-hidden="true">⌘O</span>
    </button>
  </li>
  <li role="none">
    <button
      class="dropdown-item bootcn-dropdown__item"
      type="button"
      role="menuitem"
      tabindex="-1"
      data-value="rename"
      aria-keyshortcuts="Meta+R"
    >
      Rename <span class="bootcn-dropdown__shortcut" aria-hidden="true">⌘R</span>
    </button>
  </li>
  <li role="none">
    <button
      class="dropdown-item bootcn-dropdown__item"
      type="button"
      role="menuitem"
      tabindex="-1"
      data-value="duplicate"
      aria-keyshortcuts="Meta+D"
    >
      Duplicate <span class="bootcn-dropdown__shortcut" aria-hidden="true">⌘D</span>
    </button>
  </li>
  <li role="none">
    <button
      class="dropdown-item bootcn-dropdown__item"
      type="button"
      role="menuitem"
      tabindex="-1"
      aria-haspopup="menu"
      aria-expanded="false"
      aria-controls="bootcn-context-menu-share"
    >
      Share<svg
        class="bootcn-icon bootcn-context-menu__chevron"
        width="14"
        height="14"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
        focusable="false"
      >
        <path d="m9 6 6 6-6 6" />
      </svg>
    </button>
    <ul
      class="dropdown-menu bootcn-dropdown__menu bootcn-context-menu bootcn-context-menu__submenu"
      id="bootcn-context-menu-share"
      role="menu"
      aria-label="Share"
    >
      <li role="none">
        <button
          class="dropdown-item bootcn-dropdown__item"
          type="button"
          role="menuitem"
          tabindex="-1"
          data-value="copy-link"
          aria-keyshortcuts="Meta+L"
        >
          Copy link <span class="bootcn-dropdown__shortcut" aria-hidden="true">⌘L</span>
        </button>
      </li>
      <li role="none">
        <button
          class="dropdown-item bootcn-dropdown__item"
          type="button"
          role="menuitem"
          tabindex="-1"
          data-value="email"
        >
          Email
        </button>
      </li>
      <li role="none">
        <button
          class="dropdown-item bootcn-dropdown__item"
          type="button"
          role="menuitem"
          tabindex="-1"
          data-value="message"
        >
          Message a teammate
        </button>
      </li>
    </ul>
  </li>
  <li role="separator"><hr class="dropdown-divider bootcn-dropdown__divider" /></li>
  <li role="none">
    <button
      class="dropdown-item bootcn-dropdown__item bootcn-context-menu__checkable"
      type="button"
      role="menuitemcheckbox"
      tabindex="-1"
      aria-checked="false"
      data-value="hidden-files"
    >
      <svg
        class="bootcn-icon bootcn-context-menu__check"
        width="14"
        height="14"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
        focusable="false"
      >
        <path d="M20 6 9 17l-5-5" /></svg
      >Show hidden files
    </button>
  </li>
  <li role="none">
    <button
      class="dropdown-item bootcn-dropdown__item bootcn-context-menu__checkable"
      type="button"
      role="menuitemcheckbox"
      tabindex="-1"
      aria-checked="true"
      data-value="extensions"
    >
      <svg
        class="bootcn-icon bootcn-context-menu__check"
        width="14"
        height="14"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
        focusable="false"
      >
        <path d="M20 6 9 17l-5-5" /></svg
      >Show file extensions
    </button>
  </li>
  <li role="separator"><hr class="dropdown-divider bootcn-dropdown__divider" /></li>
  <li role="none">
    <ul class="bootcn-context-menu__group" role="group" aria-label="Sort by">
      <li role="none" class="bootcn-context-menu__label" aria-hidden="true">Sort by</li>
      <li role="none">
        <button
          class="dropdown-item bootcn-dropdown__item bootcn-context-menu__checkable"
          type="button"
          role="menuitemradio"
          tabindex="-1"
          aria-checked="true"
          data-value="sort-name"
        >
          <span class="bootcn-context-menu__dot" aria-hidden="true"></span>Name
        </button>
      </li>
      <li role="none">
        <button
          class="dropdown-item bootcn-dropdown__item bootcn-context-menu__checkable"
          type="button"
          role="menuitemradio"
          tabindex="-1"
          aria-checked="false"
          data-value="sort-date"
        >
          <span class="bootcn-context-menu__dot" aria-hidden="true"></span>Date modified
        </button>
      </li>
      <li role="none">
        <button
          class="dropdown-item bootcn-dropdown__item bootcn-context-menu__checkable"
          type="button"
          role="menuitemradio"
          tabindex="-1"
          aria-checked="false"
          data-value="sort-size"
        >
          <span class="bootcn-context-menu__dot" aria-hidden="true"></span>Size
        </button>
      </li>
    </ul>
  </li>
  <li role="separator"><hr class="dropdown-divider bootcn-dropdown__divider" /></li>
  <li role="none">
    <button
      class="dropdown-item bootcn-dropdown__item bootcn-dropdown__item--destructive"
      type="button"
      role="menuitem"
      tabindex="-1"
      data-value="delete"
      aria-keyshortcuts="Delete"
    >
      Delete <span class="bootcn-dropdown__shortcut" aria-hidden="true">⌫</span>
    </button>
  </li>
</ul>
