<div class="bootcn-location-pin-demo" aria-label="Marker examples" role="group">
  <span
    class="bootcn-location-dot"
    role="img"
    aria-label="Your location, accurate to about 30 metres"
  >
    <span class="bootcn-location-dot__accuracy" style="--bootcn-location-accuracy: 4.5rem"></span>
  </span>
  <span class="bootcn-location-pin" role="img" aria-label="Acme Studio">
    <span class="bootcn-location-pin__head"
      ><svg
        class="bootcn-icon"
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
        focusable="false"
      >
        <path d="M9 18V5l12-2v13" />
        <circle cx="6" cy="18" r="3" />
        <circle cx="18" cy="16" r="3" /></svg
    ></span>
  </span>
  <span
    class="bootcn-location-pin bootcn-location-pin--label"
    role="img"
    aria-label="Pickup point, 4 minutes away"
    style="--bootcn-location-pin-color: #15803d"
  >
    <span class="bootcn-location-pin__head"
      ><span class="bootcn-location-pin__text">4 min</span></span
    >
  </span>
</div>
