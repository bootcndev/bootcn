<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootcn Location pin preview</title>
    <script>
      // Preview theme: ?theme=dark|light, else the docs page around the frame, else light.
      (function () {
        var theme = new URLSearchParams(location.search).get('theme');
        if (!theme) {
          try {
            theme =
              window.parent !== window &&
              window.parent.document.documentElement.classList.contains('dark')
                ? 'dark'
                : 'light';
          } catch (error) {
            theme = 'light';
          }
        }
        document.documentElement.setAttribute('data-bs-theme', theme === 'dark' ? 'dark' : 'light');
        // ?dir=rtl: right to left, with Bootstrap's RTL stylesheet.
        if (new URLSearchParams(location.search).get('dir') === 'rtl') {
          document.documentElement.setAttribute('dir', 'rtl');
          new MutationObserver(function (records, observer) {
            var link = document.querySelector('link[href*="bootstrap.min.css"]');
            if (!link) return;
            link.href = link.href.replace('bootstrap.min.css', 'bootstrap.rtl.min.css');
            observer.disconnect();
          }).observe(document.documentElement, { childList: true, subtree: true });
        }
      })();
    </script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="../../themes/tokens/tokens.css" />
    <link rel="stylesheet" href="location-pin.css" />
  </head>
  <body>
    <main class="container py-4">
      <h1 class="h4 mb-4">Location pin</h1>
      <div class="bootcn-location-pin-demo" aria-label="Marker examples" role="group">
        <span
          class="bootcn-location-dot"
          role="img"
          aria-label="Your location, accurate to about 30 metres"
        >
          <span
            class="bootcn-location-dot__accuracy"
            style="--bootcn-location-accuracy: 4.5rem"
          ></span>
        </span>
        <span class="bootcn-location-pin" role="img" aria-label="Acme Studio">
          <span class="bootcn-location-pin__head"
            ><svg
              class="bootcn-icon"
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <path d="M9 18V5l12-2v13" />
              <circle cx="6" cy="18" r="3" />
              <circle cx="18" cy="16" r="3" /></svg
          ></span>
        </span>
        <span
          class="bootcn-location-pin bootcn-location-pin--label"
          role="img"
          aria-label="Pickup point, 4 minutes away"
          style="--bootcn-location-pin-color: #15803d"
        >
          <span class="bootcn-location-pin__head"
            ><span class="bootcn-location-pin__text">4 min</span></span
          >
        </span>
      </div>
    </main>
  </body>
</html>
