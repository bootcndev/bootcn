<div class="bootcn-icon-button-demo">
  <div class="bootcn-icon-button-demo__row">
    <button type="button" class="btn bootcn-button bootcn-button--default">
      <svg
        class="bootcn-icon"
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
        focusable="false"
      >
        <path d="M12 4v12" />
        <path d="M7 11l5 5 5-5" />
        <path d="M5 20h14" />
      </svg>
      Download
    </button>
    <button type="button" class="btn bootcn-button bootcn-button--outline">
      Continue
      <svg
        class="bootcn-icon bootcn-rtl-flip"
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
        focusable="false"
      >
        <path d="M5 12h14" />
        <path d="m13 6 6 6-6 6" />
      </svg>
    </button>
    <button type="button" class="btn bootcn-button bootcn-button--destructive">
      <svg
        class="bootcn-icon"
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
        focusable="false"
      >
        <path d="M3 6h18" />
        <path d="M8 6V4h8v2" />
        <path d="M19 6l-1 14H6L5 6" />
      </svg>
      Delete
    </button>
  </div>
  <div class="bootcn-icon-button-demo__row">
    <button
      type="button"
      class="btn bootcn-button bootcn-button--outline bootcn-button--icon bootcn-button--sm"
      aria-label="Add, small"
    >
      <svg
        class="bootcn-icon"
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
        focusable="false"
      >
        <path d="M12 5v14M5 12h14" />
      </svg>
    </button>
    <button
      type="button"
      class="btn bootcn-button bootcn-button--outline bootcn-button--icon"
      aria-label="Add"
    >
      <svg
        class="bootcn-icon"
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
        focusable="false"
      >
        <path d="M12 5v14M5 12h14" />
      </svg>
    </button>
    <button
      type="button"
      class="btn bootcn-button bootcn-button--outline bootcn-button--icon bootcn-button--lg"
      aria-label="Add, large"
    >
      <svg
        class="bootcn-icon"
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
        focusable="false"
      >
        <path d="M12 5v14M5 12h14" />
      </svg>
    </button>
    <button
      type="button"
      class="btn bootcn-button bootcn-button--secondary bootcn-button--icon bootcn-button--round"
      aria-label="Like"
    >
      <svg
        class="bootcn-icon"
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
        focusable="false"
      >
        <path d="M19.5 12.6 12 20l-7.5-7.4A5 5 0 0 1 12 6a5 5 0 0 1 7.5 6.6z" />
      </svg>
    </button>
  </div>
  <div class="bootcn-icon-button-demo__row">
    <button
      type="button"
      class="btn bootcn-button bootcn-button--default bootcn-icon-button--loading"
      aria-busy="true"
      disabled
    >
      <span class="bootcn-icon-button__spinner" aria-hidden="true"></span>
      Saving…
    </button>
    <button
      type="button"
      class="btn bootcn-button bootcn-button--ghost bootcn-button--icon bootcn-icon-button--badge"
      aria-label="Notifications, 3 unread"
    >
      <svg
        class="bootcn-icon"
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
        focusable="false"
      >
        <path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9" />
        <path d="M10 21a2 2 0 0 0 4 0" />
      </svg>
      <span class="bootcn-icon-button__badge" aria-hidden="true">3</span>
    </button>
  </div>
</div>
