<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootcn Date and time fields preview</title>
    <script>
      // Preview theme: ?theme=dark|light, else the docs page around the frame, else light.
      (function () {
        var theme = new URLSearchParams(location.search).get('theme');
        if (!theme) {
          try {
            theme =
              window.parent !== window &&
              window.parent.document.documentElement.classList.contains('dark')
                ? 'dark'
                : 'light';
          } catch (error) {
            theme = 'light';
          }
        }
        document.documentElement.setAttribute('data-bs-theme', theme === 'dark' ? 'dark' : 'light');
        // ?dir=rtl: right to left, with Bootstrap's RTL stylesheet.
        if (new URLSearchParams(location.search).get('dir') === 'rtl') {
          document.documentElement.setAttribute('dir', 'rtl');
          new MutationObserver(function (records, observer) {
            var link = document.querySelector('link[href*="bootstrap.min.css"]');
            if (!link) return;
            link.href = link.href.replace('bootstrap.min.css', 'bootstrap.rtl.min.css');
            observer.disconnect();
          }).observe(document.documentElement, { childList: true, subtree: true });
        }
      })();
    </script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="../../themes/tokens/tokens.css" />
    <link rel="stylesheet" href="../input/input.css" />
    <link rel="stylesheet" href="../label/label.css" />
    <link rel="stylesheet" href="date-field.css" />
  </head>
  <body>
    <main class="container py-4">
      <h1 class="h4 mb-4">Date and time fields</h1>
      <div class="bootcn-date-field-row">
        <div class="bootcn-field">
          <label class="bootcn-label" for="bootcn-date-field-date">Date</label>
          <input
            class="form-control bootcn-input bootcn-date-field"
            type="date"
            id="bootcn-date-field-date"
            name="date"
            value="2026-11-24"
            min="2026-01-01"
          />
        </div>
        <div class="bootcn-field">
          <label class="bootcn-label" for="bootcn-date-field-time">Time</label>
          <input
            class="form-control bootcn-input bootcn-date-field"
            type="time"
            id="bootcn-date-field-time"
            name="time"
            value="09:30"
            step="900"
          />
        </div>
        <div class="bootcn-field">
          <label class="bootcn-label" for="bootcn-date-field-when">Starts</label>
          <input
            class="form-control bootcn-input bootcn-date-field"
            type="datetime-local"
            id="bootcn-date-field-when"
            name="starts"
            value="2026-11-24T09:30"
          />
        </div>
      </div>
    </main>
  </body>
</html>
