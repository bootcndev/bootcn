<div class="bootcn-variant" data-bootcn-variant>
  <fieldset class="bootcn-variant__group">
    <legend class="bootcn-variant__legend">
      Color: <span data-bootcn-variant-value>Sand</span>
    </legend>
    <div class="bootcn-variant__swatches">
      <input
        class="bootcn-variant__input"
        type="radio"
        name="color"
        id="bootcn-variant-color-sand"
        value="Sand"
        checked
      />
      <label
        class="bootcn-variant__swatch"
        for="bootcn-variant-color-sand"
        style="--bootcn-swatch: #d6c4a8"
        ><span class="visually-hidden">Sand</span></label
      >
      <input
        class="bootcn-variant__input"
        type="radio"
        name="color"
        id="bootcn-variant-color-navy"
        value="Navy"
      />
      <label
        class="bootcn-variant__swatch"
        for="bootcn-variant-color-navy"
        style="--bootcn-swatch: #1e3a5f"
        ><span class="visually-hidden">Navy</span></label
      >
      <input
        class="bootcn-variant__input"
        type="radio"
        name="color"
        id="bootcn-variant-color-forest"
        value="Forest"
      />
      <label
        class="bootcn-variant__swatch"
        for="bootcn-variant-color-forest"
        style="--bootcn-swatch: #2f4f3a"
        ><span class="visually-hidden">Forest</span></label
      >
      <input
        class="bootcn-variant__input"
        type="radio"
        name="color"
        id="bootcn-variant-color-white"
        value="White"
      />
      <label
        class="bootcn-variant__swatch"
        for="bootcn-variant-color-white"
        style="--bootcn-swatch: #f8fafc"
        ><span class="visually-hidden">White</span></label
      >
    </div>
  </fieldset>
  <fieldset class="bootcn-variant__group">
    <legend class="bootcn-variant__legend">
      Size: <span data-bootcn-variant-value>M</span>
      <a class="bootcn-variant__guide" href="#size-guide">Size guide</a>
    </legend>
    <div class="bootcn-variant__options">
      <input
        class="bootcn-variant__input"
        type="radio"
        name="size"
        id="bootcn-variant-size-xs"
        value="XS"
      />
      <label class="bootcn-variant__option" for="bootcn-variant-size-xs">XS</label>
      <input
        class="bootcn-variant__input"
        type="radio"
        name="size"
        id="bootcn-variant-size-s"
        value="S"
      />
      <label class="bootcn-variant__option" for="bootcn-variant-size-s">S</label>
      <input
        class="bootcn-variant__input"
        type="radio"
        name="size"
        id="bootcn-variant-size-m"
        value="M"
        checked
      />
      <label class="bootcn-variant__option" for="bootcn-variant-size-m">M</label>
      <input
        class="bootcn-variant__input"
        type="radio"
        name="size"
        id="bootcn-variant-size-l"
        value="L"
      />
      <label class="bootcn-variant__option" for="bootcn-variant-size-l">L</label>
      <input
        class="bootcn-variant__input"
        type="radio"
        name="size"
        id="bootcn-variant-size-xl"
        value="XL"
        disabled
      />
      <label class="bootcn-variant__option" for="bootcn-variant-size-xl"
        >XL<span class="visually-hidden"> (sold out)</span></label
      >
    </div>
  </fieldset>
</div>
