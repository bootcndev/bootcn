<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootcn Drawer preview</title>
    <script>
      // Preview theme: ?theme=dark|light, else the docs page around the frame, else light.
      (function () {
        var theme = new URLSearchParams(location.search).get('theme');
        if (!theme) {
          try {
            theme =
              window.parent !== window &&
              window.parent.document.documentElement.classList.contains('dark')
                ? 'dark'
                : 'light';
          } catch (error) {
            theme = 'light';
          }
        }
        document.documentElement.setAttribute('data-bs-theme', theme === 'dark' ? 'dark' : 'light');
        // ?dir=rtl: right to left, with Bootstrap's RTL stylesheet.
        if (new URLSearchParams(location.search).get('dir') === 'rtl') {
          document.documentElement.setAttribute('dir', 'rtl');
          new MutationObserver(function (records, observer) {
            var link = document.querySelector('link[href*="bootstrap.min.css"]');
            if (!link) return;
            link.href = link.href.replace('bootstrap.min.css', 'bootstrap.rtl.min.css');
            observer.disconnect();
          }).observe(document.documentElement, { childList: true, subtree: true });
        }
      })();
    </script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="../../themes/tokens/tokens.css" />
    <link rel="stylesheet" href="../button/button.css" />
    <link rel="stylesheet" href="../input/input.css" />
    <link rel="stylesheet" href="drawer.css" />
  </head>
  <body>
    <main class="container py-4">
      <h1 class="h4 mb-4">Drawer</h1>
      <button
        class="btn bootcn-button bootcn-button--outline"
        type="button"
        data-bs-toggle="offcanvas"
        data-bs-target="#bootcn-drawer"
        aria-controls="bootcn-drawer"
      >
        Set a goal
      </button>

      <div
        class="offcanvas offcanvas-bottom bootcn-drawer"
        tabindex="-1"
        id="bootcn-drawer"
        aria-labelledby="bootcn-drawer-title"
      >
        <div class="bootcn-drawer__handle" aria-hidden="true"></div>
        <div class="bootcn-drawer__inner">
          <div class="bootcn-drawer__header">
            <h2 class="offcanvas-title bootcn-drawer__title" id="bootcn-drawer-title">
              Daily goal
            </h2>
            <p class="bootcn-drawer__description">
              Choose how many minutes you want to practise each day.
            </p>
          </div>
          <div class="bootcn-drawer__body">
            <div class="bootcn-field">
              <label class="form-label bootcn-field__label" for="bootcn-drawer-minutes"
                >Minutes per day</label
              >
              <input
                class="form-control bootcn-input"
                type="number"
                id="bootcn-drawer-minutes"
                name="minutes"
                value="30"
                min="5"
                max="240"
                step="5"
                inputmode="numeric"
              />
            </div>
          </div>
          <div class="bootcn-drawer__footer">
            <button type="button" class="btn bootcn-button bootcn-button--default">
              Save goal
            </button>
            <button
              type="button"
              class="btn bootcn-button bootcn-button--outline"
              data-bs-dismiss="offcanvas"
            >
              Cancel
            </button>
          </div>
        </div>
      </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
