<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootcn Dropdown preview</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="../../themes/tokens/tokens.css" />
    <link rel="stylesheet" href="../button/button.css" />
    <link rel="stylesheet" href="dropdown.css" />
  </head>
  <body>
    <main class="container py-4">
      <h1 class="h4 mb-4">Dropdown</h1>
      <div class="dropdown bootcn-dropdown">
        <button
          class="btn bootcn-button bootcn-button--outline dropdown-toggle"
          type="button"
          id="bootcn-dropdown-trigger"
          data-bs-toggle="dropdown"
          aria-expanded="false"
        >
          My account
        </button>
        <ul class="dropdown-menu bootcn-dropdown__menu" aria-labelledby="bootcn-dropdown-trigger">
          <li>
            <span class="dropdown-header bootcn-dropdown__label"
              >Signed in as maria@example.com</span
            >
          </li>
          <li>
            <a class="dropdown-item bootcn-dropdown__item" href="#profile">
              Profile <span class="bootcn-dropdown__shortcut" aria-hidden="true">⌘P</span>
            </a>
          </li>
          <li>
            <a class="dropdown-item bootcn-dropdown__item" href="#settings">
              Settings <span class="bootcn-dropdown__shortcut" aria-hidden="true">⌘,</span>
            </a>
          </li>
          <li>
            <button class="dropdown-item bootcn-dropdown__item" type="button" disabled>
              Billing (soon)
            </button>
          </li>
          <li><hr class="dropdown-divider bootcn-dropdown__divider" /></li>
          <li>
            <button
              class="dropdown-item bootcn-dropdown__item bootcn-dropdown__item--destructive"
              type="button"
            >
              Sign out
            </button>
          </li>
        </ul>
      </div>
      <section
        class="mt-5 p-3 rounded"
        data-bs-theme="dark"
        aria-label="Dark theme"
        style="background-color: var(--bs-body-bg); color: var(--bs-body-color)"
      >
        <h2 class="h6 mb-3">Dark theme</h2>
        <div class="dropdown bootcn-dropdown">
          <button
            class="btn bootcn-button bootcn-button--outline dropdown-toggle"
            type="button"
            id="bootcn-dropdown-trigger-dark"
            data-bs-toggle="dropdown"
            aria-expanded="false"
          >
            My account
          </button>
          <ul
            class="dropdown-menu bootcn-dropdown__menu"
            aria-labelledby="bootcn-dropdown-trigger-dark"
          >
            <li>
              <span class="dropdown-header bootcn-dropdown__label"
                >Signed in as maria@example.com</span
              >
            </li>
            <li>
              <a class="dropdown-item bootcn-dropdown__item" href="#profile">
                Profile <span class="bootcn-dropdown__shortcut" aria-hidden="true">⌘P</span>
              </a>
            </li>
            <li>
              <a class="dropdown-item bootcn-dropdown__item" href="#settings">
                Settings <span class="bootcn-dropdown__shortcut" aria-hidden="true">⌘,</span>
              </a>
            </li>
            <li>
              <button class="dropdown-item bootcn-dropdown__item" type="button" disabled>
                Billing (soon)
              </button>
            </li>
            <li><hr class="dropdown-divider bootcn-dropdown__divider" /></li>
            <li>
              <button
                class="dropdown-item bootcn-dropdown__item bootcn-dropdown__item--destructive"
                type="button"
              >
                Sign out
              </button>
            </li>
          </ul>
        </div>
      </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
