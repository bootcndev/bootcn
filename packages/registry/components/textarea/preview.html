<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootcn Textarea preview</title>
    <script>
      // Preview theme: ?theme=dark|light, else the docs page around the frame, else light.
      (function () {
        var theme = new URLSearchParams(location.search).get('theme');
        if (!theme) {
          try {
            theme =
              window.parent !== window &&
              window.parent.document.documentElement.classList.contains('dark')
                ? 'dark'
                : 'light';
          } catch (error) {
            theme = 'light';
          }
        }
        document.documentElement.setAttribute('data-bs-theme', theme === 'dark' ? 'dark' : 'light');
        // ?dir=rtl: right to left, with Bootstrap's RTL stylesheet.
        if (new URLSearchParams(location.search).get('dir') === 'rtl') {
          document.documentElement.setAttribute('dir', 'rtl');
          new MutationObserver(function (records, observer) {
            var link = document.querySelector('link[href*="bootstrap.min.css"]');
            if (!link) return;
            link.href = link.href.replace('bootstrap.min.css', 'bootstrap.rtl.min.css');
            observer.disconnect();
          }).observe(document.documentElement, { childList: true, subtree: true });
        }
      })();
    </script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="../../themes/tokens/tokens.css" />
    <link rel="stylesheet" href="../input/input.css" />
    <link rel="stylesheet" href="textarea.css" />
  </head>
  <body>
    <main class="container py-4">
      <h1 class="h4 mb-4">Textarea</h1>
      <div class="bootcn-field">
        <label for="bootcn-textarea-bio" class="form-label bootcn-field__label">Bio</label>
        <textarea
          class="form-control bootcn-textarea"
          id="bootcn-textarea-bio"
          name="bio"
          rows="3"
          aria-describedby="bootcn-textarea-bio-help"
          placeholder="Tell us a little about yourself"
        ></textarea>
        <p class="bootcn-field__help" id="bootcn-textarea-bio-help">Up to 280 characters.</p>
      </div>

      <div class="bootcn-field mt-3">
        <label for="bootcn-textarea-notes" class="form-label bootcn-field__label"
          >Notes (grows with content)</label
        >
        <textarea
          class="form-control bootcn-textarea bootcn-textarea--autosize"
          id="bootcn-textarea-notes"
          name="notes"
          rows="2"
        ></textarea>
      </div>

      <div class="bootcn-field mt-3">
        <label for="bootcn-textarea-message" class="form-label bootcn-field__label">Message</label>
        <textarea
          class="form-control bootcn-textarea"
          id="bootcn-textarea-message"
          name="message"
          rows="3"
          required
          aria-invalid="true"
          aria-describedby="bootcn-textarea-message-error"
        ></textarea>
        <div class="invalid-feedback" id="bootcn-textarea-message-error">
          Write a message before sending.
        </div>
      </div>
    </main>
  </body>
</html>
