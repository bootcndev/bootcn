<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootcn Textarea preview</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="../../themes/tokens/tokens.css" />
    <link rel="stylesheet" href="../input/input.css" />
    <link rel="stylesheet" href="textarea.css" />
  </head>
  <body>
    <main class="container py-4">
      <h1 class="h4 mb-4">Textarea</h1>
      <div class="bootcn-field">
        <label for="bootcn-textarea-bio" class="form-label bootcn-field__label">Bio</label>
        <textarea
          class="form-control bootcn-textarea"
          id="bootcn-textarea-bio"
          name="bio"
          rows="3"
          aria-describedby="bootcn-textarea-bio-help"
          placeholder="Tell us a little about yourself"
        ></textarea>
        <p class="bootcn-field__help" id="bootcn-textarea-bio-help">Up to 280 characters.</p>
      </div>

      <div class="bootcn-field mt-3">
        <label for="bootcn-textarea-notes" class="form-label bootcn-field__label"
          >Notes (grows with content)</label
        >
        <textarea
          class="form-control bootcn-textarea bootcn-textarea--autosize"
          id="bootcn-textarea-notes"
          name="notes"
          rows="2"
        ></textarea>
      </div>

      <div class="bootcn-field mt-3">
        <label for="bootcn-textarea-message" class="form-label bootcn-field__label">Message</label>
        <textarea
          class="form-control bootcn-textarea"
          id="bootcn-textarea-message"
          name="message"
          rows="3"
          required
          aria-invalid="true"
          aria-describedby="bootcn-textarea-message-error"
        ></textarea>
        <div class="invalid-feedback" id="bootcn-textarea-message-error">
          Write a message before sending.
        </div>
      </div>
      <section
        class="mt-5 p-3 rounded"
        data-bs-theme="dark"
        aria-label="Dark theme"
        style="background-color: var(--bs-body-bg); color: var(--bs-body-color)"
      >
        <h2 class="h6 mb-3">Dark theme</h2>
        <div class="bootcn-field">
          <label for="bootcn-textarea-bio-dark" class="form-label bootcn-field__label">Bio</label>
          <textarea
            class="form-control bootcn-textarea"
            id="bootcn-textarea-bio-dark"
            name="bio-dark"
            rows="3"
            aria-describedby="bootcn-textarea-bio-help-dark"
            placeholder="Tell us a little about yourself"
          ></textarea>
          <p class="bootcn-field__help" id="bootcn-textarea-bio-help-dark">Up to 280 characters.</p>
        </div>

        <div class="bootcn-field mt-3">
          <label for="bootcn-textarea-notes-dark" class="form-label bootcn-field__label"
            >Notes (grows with content)</label
          >
          <textarea
            class="form-control bootcn-textarea bootcn-textarea--autosize"
            id="bootcn-textarea-notes-dark"
            name="notes-dark"
            rows="2"
          ></textarea>
        </div>

        <div class="bootcn-field mt-3">
          <label for="bootcn-textarea-message-dark" class="form-label bootcn-field__label"
            >Message</label
          >
          <textarea
            class="form-control bootcn-textarea"
            id="bootcn-textarea-message-dark"
            name="message-dark"
            rows="3"
            required
            aria-invalid="true"
            aria-describedby="bootcn-textarea-message-error-dark"
          ></textarea>
          <div class="invalid-feedback" id="bootcn-textarea-message-error-dark">
            Write a message before sending.
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
