<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootcn Confetti preview</title>
    <script>
      // Preview theme: ?theme=dark|light, else the docs page around the frame, else light.
      (function () {
        var theme = new URLSearchParams(location.search).get('theme');
        if (!theme) {
          try {
            theme =
              window.parent !== window &&
              window.parent.document.documentElement.classList.contains('dark')
                ? 'dark'
                : 'light';
          } catch (error) {
            theme = 'light';
          }
        }
        document.documentElement.setAttribute('data-bs-theme', theme === 'dark' ? 'dark' : 'light');
        // ?dir=rtl: right to left, with Bootstrap's RTL stylesheet.
        if (new URLSearchParams(location.search).get('dir') === 'rtl') {
          document.documentElement.setAttribute('dir', 'rtl');
          new MutationObserver(function (records, observer) {
            var link = document.querySelector('link[href*="bootstrap.min.css"]');
            if (!link) return;
            link.href = link.href.replace('bootstrap.min.css', 'bootstrap.rtl.min.css');
            observer.disconnect();
          }).observe(document.documentElement, { childList: true, subtree: true });
        }
      })();
    </script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="../../themes/tokens/tokens.css" />
    <link rel="stylesheet" href="../button/button.css" />
    <link rel="stylesheet" href="confetti.css" />
  </head>
  <body>
    <main class="container py-4">
      <h1 class="h4 mb-4">Confetti</h1>
      <div class="bootcn-confetti-demo">
        <button type="button" class="btn bootcn-button bootcn-button--default" data-bootcn-confetti>
          <svg
            class="bootcn-icon"
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
            focusable="false"
          >
            <path d="M5.8 11.3 2 22l10.7-3.8" />
            <path d="M4 3h.01M22 8h.01M15 2h.01M22 20h.01" />
            <path d="m22 2-2.2.8a3 3 0 0 0-2 2.9V7" />
            <path d="M11 13c1.9 1.9 2.8 4 2 4.8s-2.9-.1-4.8-2-2.8-4-2-4.8 2.9.1 4.8 2z" />
          </svg>
          Celebrate
        </button>
        <button
          type="button"
          class="btn bootcn-button bootcn-button--outline"
          data-bootcn-confetti
          data-particles="250"
          data-spread="120"
        >
          Big celebration
        </button>
        <p class="bootcn-confetti-demo__status" role="status" data-bootcn-confetti-status></p>
      </div>
    </main>
    <script src="confetti.js"></script>
  </body>
</html>
