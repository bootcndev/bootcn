<div class="bootcn-toaster-demo">
  <button
    type="button"
    class="btn bootcn-button bootcn-button--outline"
    data-bootcn-toast="Event created"
    data-description="Friday, 12 June at 10:00"
  >
    Default
  </button>
  <button
    type="button"
    class="btn bootcn-button bootcn-button--outline"
    data-bootcn-toast="Profile saved"
    data-type="success"
  >
    Success
  </button>
  <button
    type="button"
    class="btn bootcn-button bootcn-button--outline"
    data-bootcn-toast="Could not reach the server"
    data-type="error"
    data-description="Check your connection and try again."
  >
    Error
  </button>
  <button
    type="button"
    class="btn bootcn-button bootcn-button--outline"
    data-bootcn-toast="Your trial ends in 3 days"
    data-type="warning"
  >
    Warning
  </button>
  <button
    type="button"
    class="btn bootcn-button bootcn-button--outline"
    data-bootcn-toast="3 new comments"
    data-type="info"
  >
    Info
  </button>
  <button
    type="button"
    class="btn bootcn-button bootcn-button--outline"
    data-bootcn-toast="Message archived"
    data-action="Undo"
  >
    With action
  </button>
  <button
    type="button"
    class="btn bootcn-button bootcn-button--outline"
    data-bootcn-toast-demo="promise"
  >
    Promise
  </button>
</div>
