<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootcn Toaster preview</title>
    <script>
      // Preview theme: ?theme=dark|light, else the docs page around the frame, else light.
      (function () {
        var theme = new URLSearchParams(location.search).get('theme');
        if (!theme) {
          try {
            theme =
              window.parent !== window &&
              window.parent.document.documentElement.classList.contains('dark')
                ? 'dark'
                : 'light';
          } catch (error) {
            theme = 'light';
          }
        }
        document.documentElement.setAttribute('data-bs-theme', theme === 'dark' ? 'dark' : 'light');
        // ?dir=rtl: right to left, with Bootstrap's RTL stylesheet.
        if (new URLSearchParams(location.search).get('dir') === 'rtl') {
          document.documentElement.setAttribute('dir', 'rtl');
          new MutationObserver(function (records, observer) {
            var link = document.querySelector('link[href*="bootstrap.min.css"]');
            if (!link) return;
            link.href = link.href.replace('bootstrap.min.css', 'bootstrap.rtl.min.css');
            observer.disconnect();
          }).observe(document.documentElement, { childList: true, subtree: true });
        }
      })();
    </script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="../../themes/tokens/tokens.css" />
    <link rel="stylesheet" href="../button/button.css" />
    <link rel="stylesheet" href="toaster.css" />
  </head>
  <body>
    <main class="container py-4">
      <h1 class="h4 mb-4">Toaster</h1>
      <div class="bootcn-toaster-demo">
        <button
          type="button"
          class="btn bootcn-button bootcn-button--outline"
          data-bootcn-toast="Event created"
          data-description="Friday, 12 June at 10:00"
        >
          Default
        </button>
        <button
          type="button"
          class="btn bootcn-button bootcn-button--outline"
          data-bootcn-toast="Profile saved"
          data-type="success"
        >
          Success
        </button>
        <button
          type="button"
          class="btn bootcn-button bootcn-button--outline"
          data-bootcn-toast="Could not reach the server"
          data-type="error"
          data-description="Check your connection and try again."
        >
          Error
        </button>
        <button
          type="button"
          class="btn bootcn-button bootcn-button--outline"
          data-bootcn-toast="Your trial ends in 3 days"
          data-type="warning"
        >
          Warning
        </button>
        <button
          type="button"
          class="btn bootcn-button bootcn-button--outline"
          data-bootcn-toast="3 new comments"
          data-type="info"
        >
          Info
        </button>
        <button
          type="button"
          class="btn bootcn-button bootcn-button--outline"
          data-bootcn-toast="Message archived"
          data-action="Undo"
        >
          With action
        </button>
        <button
          type="button"
          class="btn bootcn-button bootcn-button--outline"
          data-bootcn-toast-demo="promise"
        >
          Promise
        </button>
      </div>
    </main>
    <script src="toaster.js"></script>
  </body>
</html>
