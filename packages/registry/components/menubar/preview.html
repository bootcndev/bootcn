<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootcn Menubar preview</title>
    <script>
      // Preview theme: ?theme=dark|light, else the docs page around the frame, else light.
      (function () {
        var theme = new URLSearchParams(location.search).get('theme');
        if (!theme) {
          try {
            theme =
              window.parent !== window &&
              window.parent.document.documentElement.classList.contains('dark')
                ? 'dark'
                : 'light';
          } catch (error) {
            theme = 'light';
          }
        }
        document.documentElement.setAttribute('data-bs-theme', theme === 'dark' ? 'dark' : 'light');
        // ?dir=rtl: right to left, with Bootstrap's RTL stylesheet.
        if (new URLSearchParams(location.search).get('dir') === 'rtl') {
          document.documentElement.setAttribute('dir', 'rtl');
          new MutationObserver(function (records, observer) {
            var link = document.querySelector('link[href*="bootstrap.min.css"]');
            if (!link) return;
            link.href = link.href.replace('bootstrap.min.css', 'bootstrap.rtl.min.css');
            observer.disconnect();
          }).observe(document.documentElement, { childList: true, subtree: true });
        }
      })();
    </script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="../../themes/tokens/tokens.css" />
    <link rel="stylesheet" href="../button/button.css" />
    <link rel="stylesheet" href="../dropdown/dropdown.css" />
    <link rel="stylesheet" href="menubar.css" />
  </head>
  <body>
    <main class="container py-4" style="min-height: 20rem">
      <h1 class="h4 mb-4">Menubar</h1>
      <div class="bootcn-menubar" role="menubar" aria-label="Editor">
        <div class="bootcn-menubar__menu" role="none">
          <button
            type="button"
            class="bootcn-menubar__trigger"
            id="bootcn-menubar-file"
            role="menuitem"
            aria-haspopup="menu"
            aria-expanded="false"
            aria-controls="bootcn-menubar-file-menu"
            tabindex="0"
          >
            File
          </button>
          <ul
            class="dropdown-menu bootcn-dropdown__menu bootcn-menubar__content"
            id="bootcn-menubar-file-menu"
            role="menu"
            aria-labelledby="bootcn-menubar-file"
          >
            <li role="none">
              <button
                class="dropdown-item bootcn-dropdown__item"
                type="button"
                role="menuitem"
                tabindex="-1"
              >
                New tab <span class="bootcn-dropdown__shortcut" aria-hidden="true">⌘T</span>
              </button>
            </li>
            <li role="none">
              <button
                class="dropdown-item bootcn-dropdown__item"
                type="button"
                role="menuitem"
                tabindex="-1"
              >
                New window <span class="bootcn-dropdown__shortcut" aria-hidden="true">⌘N</span>
              </button>
            </li>
            <li role="separator"><hr class="dropdown-divider bootcn-dropdown__divider" /></li>
            <li role="none">
              <button
                class="dropdown-item bootcn-dropdown__item"
                type="button"
                role="menuitem"
                tabindex="-1"
              >
                Print… <span class="bootcn-dropdown__shortcut" aria-hidden="true">⌘P</span>
              </button>
            </li>
          </ul>
        </div>
        <div class="bootcn-menubar__menu" role="none">
          <button
            type="button"
            class="bootcn-menubar__trigger"
            id="bootcn-menubar-edit"
            role="menuitem"
            aria-haspopup="menu"
            aria-expanded="false"
            aria-controls="bootcn-menubar-edit-menu"
            tabindex="-1"
          >
            Edit
          </button>
          <ul
            class="dropdown-menu bootcn-dropdown__menu bootcn-menubar__content"
            id="bootcn-menubar-edit-menu"
            role="menu"
            aria-labelledby="bootcn-menubar-edit"
          >
            <li role="none">
              <button
                class="dropdown-item bootcn-dropdown__item"
                type="button"
                role="menuitem"
                tabindex="-1"
              >
                Undo <span class="bootcn-dropdown__shortcut" aria-hidden="true">⌘Z</span>
              </button>
            </li>
            <li role="none">
              <button
                class="dropdown-item bootcn-dropdown__item"
                type="button"
                role="menuitem"
                tabindex="-1"
              >
                Redo <span class="bootcn-dropdown__shortcut" aria-hidden="true">⇧⌘Z</span>
              </button>
            </li>
            <li role="separator"><hr class="dropdown-divider bootcn-dropdown__divider" /></li>
            <li role="none">
              <button
                class="dropdown-item bootcn-dropdown__item"
                type="button"
                role="menuitem"
                tabindex="-1"
              >
                Find… <span class="bootcn-dropdown__shortcut" aria-hidden="true">⌘F</span>
              </button>
            </li>
          </ul>
        </div>
        <div class="bootcn-menubar__menu" role="none">
          <button
            type="button"
            class="bootcn-menubar__trigger"
            id="bootcn-menubar-view"
            role="menuitem"
            aria-haspopup="menu"
            aria-expanded="false"
            aria-controls="bootcn-menubar-view-menu"
            tabindex="-1"
          >
            View
          </button>
          <ul
            class="dropdown-menu bootcn-dropdown__menu bootcn-menubar__content"
            id="bootcn-menubar-view-menu"
            role="menu"
            aria-labelledby="bootcn-menubar-view"
          >
            <li role="none">
              <button
                class="dropdown-item bootcn-dropdown__item bootcn-menubar__check"
                type="button"
                role="menuitemcheckbox"
                aria-checked="false"
                tabindex="-1"
              >
                <svg
                  class="bootcn-icon bootcn-menubar__check-icon"
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                  focusable="false"
                >
                  <path d="M20 6 9 17l-5-5" />
                </svg>
                Show bookmarks bar
              </button>
            </li>
            <li role="none">
              <button
                class="dropdown-item bootcn-dropdown__item bootcn-menubar__check"
                type="button"
                role="menuitemcheckbox"
                aria-checked="true"
                tabindex="-1"
              >
                <svg
                  class="bootcn-icon bootcn-menubar__check-icon"
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                  focusable="false"
                >
                  <path d="M20 6 9 17l-5-5" />
                </svg>
                Show full URLs
              </button>
            </li>
            <li role="separator"><hr class="dropdown-divider bootcn-dropdown__divider" /></li>
            <li role="none">
              <button
                class="dropdown-item bootcn-dropdown__item"
                type="button"
                role="menuitem"
                tabindex="-1"
              >
                Reload <span class="bootcn-dropdown__shortcut" aria-hidden="true">⌘R</span>
              </button>
            </li>
          </ul>
        </div>
      </div>
    </main>
    <script src="menubar.js"></script>
  </body>
</html>
