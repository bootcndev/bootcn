<div class="bootcn-menubar" role="menubar" aria-label="Editor">
  <div class="bootcn-menubar__menu" role="none">
    <button
      type="button"
      class="bootcn-menubar__trigger"
      id="bootcn-menubar-file"
      role="menuitem"
      aria-haspopup="menu"
      aria-expanded="false"
      aria-controls="bootcn-menubar-file-menu"
      tabindex="0"
    >
      File
    </button>
    <ul
      class="dropdown-menu bootcn-dropdown__menu bootcn-menubar__content"
      id="bootcn-menubar-file-menu"
      role="menu"
      aria-labelledby="bootcn-menubar-file"
    >
      <li role="none">
        <button
          class="dropdown-item bootcn-dropdown__item"
          type="button"
          role="menuitem"
          tabindex="-1"
        >
          New tab <span class="bootcn-dropdown__shortcut" aria-hidden="true">⌘T</span>
        </button>
      </li>
      <li role="none">
        <button
          class="dropdown-item bootcn-dropdown__item"
          type="button"
          role="menuitem"
          tabindex="-1"
        >
          New window <span class="bootcn-dropdown__shortcut" aria-hidden="true">⌘N</span>
        </button>
      </li>
      <li role="separator"><hr class="dropdown-divider bootcn-dropdown__divider" /></li>
      <li role="none">
        <button
          class="dropdown-item bootcn-dropdown__item"
          type="button"
          role="menuitem"
          tabindex="-1"
        >
          Print… <span class="bootcn-dropdown__shortcut" aria-hidden="true">⌘P</span>
        </button>
      </li>
    </ul>
  </div>
  <div class="bootcn-menubar__menu" role="none">
    <button
      type="button"
      class="bootcn-menubar__trigger"
      id="bootcn-menubar-edit"
      role="menuitem"
      aria-haspopup="menu"
      aria-expanded="false"
      aria-controls="bootcn-menubar-edit-menu"
      tabindex="-1"
    >
      Edit
    </button>
    <ul
      class="dropdown-menu bootcn-dropdown__menu bootcn-menubar__content"
      id="bootcn-menubar-edit-menu"
      role="menu"
      aria-labelledby="bootcn-menubar-edit"
    >
      <li role="none">
        <button
          class="dropdown-item bootcn-dropdown__item"
          type="button"
          role="menuitem"
          tabindex="-1"
        >
          Undo <span class="bootcn-dropdown__shortcut" aria-hidden="true">⌘Z</span>
        </button>
      </li>
      <li role="none">
        <button
          class="dropdown-item bootcn-dropdown__item"
          type="button"
          role="menuitem"
          tabindex="-1"
        >
          Redo <span class="bootcn-dropdown__shortcut" aria-hidden="true">⇧⌘Z</span>
        </button>
      </li>
      <li role="separator"><hr class="dropdown-divider bootcn-dropdown__divider" /></li>
      <li role="none">
        <button
          class="dropdown-item bootcn-dropdown__item"
          type="button"
          role="menuitem"
          tabindex="-1"
        >
          Find… <span class="bootcn-dropdown__shortcut" aria-hidden="true">⌘F</span>
        </button>
      </li>
    </ul>
  </div>
  <div class="bootcn-menubar__menu" role="none">
    <button
      type="button"
      class="bootcn-menubar__trigger"
      id="bootcn-menubar-view"
      role="menuitem"
      aria-haspopup="menu"
      aria-expanded="false"
      aria-controls="bootcn-menubar-view-menu"
      tabindex="-1"
    >
      View
    </button>
    <ul
      class="dropdown-menu bootcn-dropdown__menu bootcn-menubar__content"
      id="bootcn-menubar-view-menu"
      role="menu"
      aria-labelledby="bootcn-menubar-view"
    >
      <li role="none">
        <button
          class="dropdown-item bootcn-dropdown__item bootcn-menubar__check"
          type="button"
          role="menuitemcheckbox"
          aria-checked="false"
          tabindex="-1"
        >
          <svg
            class="bootcn-icon bootcn-menubar__check-icon"
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
            focusable="false"
          >
            <path d="M20 6 9 17l-5-5" />
          </svg>
          Show bookmarks bar
        </button>
      </li>
      <li role="none">
        <button
          class="dropdown-item bootcn-dropdown__item bootcn-menubar__check"
          type="button"
          role="menuitemcheckbox"
          aria-checked="true"
          tabindex="-1"
        >
          <svg
            class="bootcn-icon bootcn-menubar__check-icon"
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
            focusable="false"
          >
            <path d="M20 6 9 17l-5-5" />
          </svg>
          Show full URLs
        </button>
      </li>
      <li role="separator"><hr class="dropdown-divider bootcn-dropdown__divider" /></li>
      <li role="none">
        <button
          class="dropdown-item bootcn-dropdown__item"
          type="button"
          role="menuitem"
          tabindex="-1"
        >
          Reload <span class="bootcn-dropdown__shortcut" aria-hidden="true">⌘R</span>
        </button>
      </li>
    </ul>
  </div>
</div>
