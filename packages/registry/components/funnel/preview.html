<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootcn Funnel preview</title>
    <script>
      // Preview theme: ?theme=dark|light, else the docs page around the frame, else light.
      (function () {
        var theme = new URLSearchParams(location.search).get('theme');
        if (!theme) {
          try {
            theme =
              window.parent !== window &&
              window.parent.document.documentElement.classList.contains('dark')
                ? 'dark'
                : 'light';
          } catch (error) {
            theme = 'light';
          }
        }
        document.documentElement.setAttribute('data-bs-theme', theme === 'dark' ? 'dark' : 'light');
        // ?dir=rtl: right to left, with Bootstrap's RTL stylesheet.
        if (new URLSearchParams(location.search).get('dir') === 'rtl') {
          document.documentElement.setAttribute('dir', 'rtl');
          new MutationObserver(function (records, observer) {
            var link = document.querySelector('link[href*="bootstrap.min.css"]');
            if (!link) return;
            link.href = link.href.replace('bootstrap.min.css', 'bootstrap.rtl.min.css');
            observer.disconnect();
          }).observe(document.documentElement, { childList: true, subtree: true });
        }
      })();
    </script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="../../themes/tokens/tokens.css" />
    <link rel="stylesheet" href="funnel.css" />
  </head>
  <body>
    <main class="container py-4">
      <h1 class="h4 mb-4">Funnel</h1>
      <figure class="bootcn-funnel" aria-labelledby="bootcn-funnel-title">
        <figcaption class="bootcn-funnel__title" id="bootcn-funnel-title">
          Sign-up funnel, last 30 days
        </figcaption>
        <ol class="bootcn-funnel__list">
          <li class="bootcn-funnel__item" style="--bootcn-funnel-value: 100%">
            <div class="bootcn-funnel__head">
              <span class="bootcn-funnel__name">Visited the site</span>
              <span class="bootcn-funnel__count"
                >24,800 <span class="bootcn-funnel__share">(100.0%)</span></span
              >
            </div>
            <div class="bootcn-funnel__bar" aria-hidden="true"></div>
          </li>
          <li class="bootcn-funnel__item" style="--bootcn-funnel-value: 40%">
            <div class="bootcn-funnel__head">
              <span class="bootcn-funnel__name">Viewed pricing</span>
              <span class="bootcn-funnel__count"
                >9,920 <span class="bootcn-funnel__share">(40.0%)</span></span
              >
            </div>
            <div class="bootcn-funnel__bar" aria-hidden="true"></div>
            <span class="bootcn-funnel__step">40% of the previous step</span>
          </li>
          <li class="bootcn-funnel__item" style="--bootcn-funnel-value: 15%">
            <div class="bootcn-funnel__head">
              <span class="bootcn-funnel__name">Started sign-up</span>
              <span class="bootcn-funnel__count"
                >3,720 <span class="bootcn-funnel__share">(15.0%)</span></span
              >
            </div>
            <div class="bootcn-funnel__bar" aria-hidden="true"></div>
            <span class="bootcn-funnel__step">38% of the previous step</span>
          </li>
          <li class="bootcn-funnel__item" style="--bootcn-funnel-value: 9%">
            <div class="bootcn-funnel__head">
              <span class="bootcn-funnel__name">Created an account</span>
              <span class="bootcn-funnel__count"
                >2,232 <span class="bootcn-funnel__share">(9.0%)</span></span
              >
            </div>
            <div class="bootcn-funnel__bar" aria-hidden="true"></div>
            <span class="bootcn-funnel__step">60% of the previous step</span>
          </li>
          <li class="bootcn-funnel__item" style="--bootcn-funnel-value: 2%">
            <div class="bootcn-funnel__head">
              <span class="bootcn-funnel__name">Upgraded to Pro</span>
              <span class="bootcn-funnel__count"
                >491 <span class="bootcn-funnel__share">(2.0%)</span></span
              >
            </div>
            <div class="bootcn-funnel__bar" aria-hidden="true"></div>
            <span class="bootcn-funnel__step">22% of the previous step</span>
          </li>
        </ol>
      </figure>
    </main>
  </body>
</html>
