<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootcn Input group preview</title>
    <script>
      // Preview theme: ?theme=dark|light, else the docs page around the frame, else light.
      (function () {
        var theme = new URLSearchParams(location.search).get('theme');
        if (!theme) {
          try {
            theme =
              window.parent !== window &&
              window.parent.document.documentElement.classList.contains('dark')
                ? 'dark'
                : 'light';
          } catch (error) {
            theme = 'light';
          }
        }
        document.documentElement.setAttribute('data-bs-theme', theme === 'dark' ? 'dark' : 'light');
        // ?dir=rtl: right to left, with Bootstrap's RTL stylesheet.
        if (new URLSearchParams(location.search).get('dir') === 'rtl') {
          document.documentElement.setAttribute('dir', 'rtl');
          new MutationObserver(function (records, observer) {
            var link = document.querySelector('link[href*="bootstrap.min.css"]');
            if (!link) return;
            link.href = link.href.replace('bootstrap.min.css', 'bootstrap.rtl.min.css');
            observer.disconnect();
          }).observe(document.documentElement, { childList: true, subtree: true });
        }
      })();
    </script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="../../themes/tokens/tokens.css" />
    <link rel="stylesheet" href="../button/button.css" />
    <link rel="stylesheet" href="../input/input.css" />
    <link rel="stylesheet" href="../label/label.css" />
    <link rel="stylesheet" href="input-group.css" />
  </head>
  <body>
    <main class="container py-4">
      <h1 class="h4 mb-4">Input group</h1>
      <div class="bootcn-field">
        <label class="bootcn-label" for="bootcn-input-group-search">Search</label>
        <div class="bootcn-input-group">
          <span class="bootcn-input-group__addon"
            ><svg
              class="bootcn-icon"
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <circle cx="11" cy="11" r="7" />
              <path d="m20 20-3.5-3.5" /></svg
          ></span>
          <input
            class="bootcn-input-group__input"
            type="search"
            id="bootcn-input-group-search"
            name="q"
            placeholder="Search projects"
          />
          <span class="bootcn-input-group__addon">12 results</span>
        </div>
      </div>

      <div class="bootcn-field mt-3">
        <label class="bootcn-label" for="bootcn-input-group-site">Website</label>
        <div class="bootcn-input-group">
          <span class="bootcn-input-group__addon">https://</span>
          <input
            class="bootcn-input-group__input"
            type="text"
            id="bootcn-input-group-site"
            name="site"
            placeholder="example"
          />
          <span class="bootcn-input-group__addon">.com</span>
        </div>
      </div>

      <div class="bootcn-field mt-3">
        <label class="bootcn-label" for="bootcn-input-group-key">API key</label>
        <div class="bootcn-input-group">
          <input
            class="bootcn-input-group__input"
            type="text"
            id="bootcn-input-group-key"
            name="key"
            value="sk_test_4f2a9c"
            readonly
          />
          <button
            type="button"
            class="btn bootcn-button bootcn-button--ghost bootcn-button--icon bootcn-button--sm bootcn-input-group__button"
          >
            <svg
              class="bootcn-icon"
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <rect x="8" y="8" width="13" height="13" rx="2" />
              <path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3" />
            </svg>
            <span class="visually-hidden">Copy API key</span>
          </button>
        </div>
      </div>
    </main>
  </body>
</html>
