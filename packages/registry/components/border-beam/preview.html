<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootcn Border beam preview</title>
    <script>
      // Preview theme: ?theme=dark|light, else the docs page around the frame, else light.
      (function () {
        var theme = new URLSearchParams(location.search).get('theme');
        if (!theme) {
          try {
            theme =
              window.parent !== window &&
              window.parent.document.documentElement.classList.contains('dark')
                ? 'dark'
                : 'light';
          } catch (error) {
            theme = 'light';
          }
        }
        document.documentElement.setAttribute('data-bs-theme', theme === 'dark' ? 'dark' : 'light');
        // ?dir=rtl: right to left, with Bootstrap's RTL stylesheet.
        if (new URLSearchParams(location.search).get('dir') === 'rtl') {
          document.documentElement.setAttribute('dir', 'rtl');
          new MutationObserver(function (records, observer) {
            var link = document.querySelector('link[href*="bootstrap.min.css"]');
            if (!link) return;
            link.href = link.href.replace('bootstrap.min.css', 'bootstrap.rtl.min.css');
            observer.disconnect();
          }).observe(document.documentElement, { childList: true, subtree: true });
        }
      })();
    </script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="../../themes/tokens/tokens.css" />
    <link rel="stylesheet" href="border-beam.css" />
    <style>
      .bootcn-border-beam-demo {
        max-width: 22rem;
      }
      .bootcn-border-beam-demo__icon {
        display: inline-flex;
        margin-bottom: 0.75rem;
        padding: 0.5rem;
        border-radius: var(--bootcn-radius-md);
        background-color: var(--bootcn-muted);
      }
    </style>
  </head>
  <body>
    <main class="container py-4">
      <h1 class="h4 mb-4">Border beam</h1>
      <div class="bootcn-border-beam card bootcn-border-beam-demo">
        <div class="card-body">
          <span class="bootcn-border-beam-demo__icon" aria-hidden="true"
            ><svg
              class="bootcn-icon"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <path d="M12 3l1.9 5.6L19.5 10l-5.6 1.9L12 17.5l-1.9-5.6L4.5 10l5.6-1.4z" /></svg
          ></span>
          <h2 class="h5 mb-1">Pro plan</h2>
          <p class="text-body-secondary mb-0">
            A light travels around the border of whatever you put it on.
          </p>
        </div>
      </div>
    </main>
  </body>
</html>
