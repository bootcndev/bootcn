<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootcn User preview</title>
    <script>
      // Preview theme: ?theme=dark|light, else the docs page around the frame, else light.
      (function () {
        var theme = new URLSearchParams(location.search).get('theme');
        if (!theme) {
          try {
            theme =
              window.parent !== window &&
              window.parent.document.documentElement.classList.contains('dark')
                ? 'dark'
                : 'light';
          } catch (error) {
            theme = 'light';
          }
        }
        document.documentElement.setAttribute('data-bs-theme', theme === 'dark' ? 'dark' : 'light');
        // ?dir=rtl: right to left, with Bootstrap's RTL stylesheet.
        if (new URLSearchParams(location.search).get('dir') === 'rtl') {
          document.documentElement.setAttribute('dir', 'rtl');
          new MutationObserver(function (records, observer) {
            var link = document.querySelector('link[href*="bootstrap.min.css"]');
            if (!link) return;
            link.href = link.href.replace('bootstrap.min.css', 'bootstrap.rtl.min.css');
            observer.disconnect();
          }).observe(document.documentElement, { childList: true, subtree: true });
        }
      })();
    </script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="../../themes/tokens/tokens.css" />
    <link rel="stylesheet" href="../avatar/avatar.css" />
    <link rel="stylesheet" href="user.css" />
  </head>
  <body>
    <main class="container py-4">
      <h1 class="h4 mb-4">User</h1>
      <div class="bootcn-user-demo">
        <div class="bootcn-user">
          <span class="bootcn-avatar"
            ><img
              class="bootcn-avatar__image"
              src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%236f42c1'/%3E%3Ccircle cx='32' cy='25' r='11' fill='%23e9d8fd'/%3E%3Cpath d='M12 58c3-12 12-18 20-18s17 6 20 18z' fill='%23e9d8fd'/%3E%3C/svg%3E"
              alt=""
          /></span>
          <div class="bootcn-user__text">
            <p class="bootcn-user__name">Maria Papadopoulou</p>
            <p class="bootcn-user__description">Product designer</p>
          </div>
        </div>
        <div class="bootcn-user bootcn-user--sm">
          <span class="bootcn-avatar bootcn-avatar--sm" aria-hidden="true">
            <span class="bootcn-avatar__fallback">NG</span>
          </span>
          <div class="bootcn-user__text">
            <p class="bootcn-user__name">Nikos Georgiou</p>
            <p class="bootcn-user__description">nikos@example.com</p>
          </div>
        </div>
        <a class="bootcn-user bootcn-user--lg bootcn-user--link" href="#profile">
          <span class="bootcn-avatar bootcn-avatar--lg" aria-hidden="true">
            <span class="bootcn-avatar__fallback">EK</span>
          </span>
          <span class="bootcn-user__text">
            <span class="bootcn-user__name">Eleni Kosta</span>
            <span class="bootcn-user__description">@eleni · View profile</span>
          </span>
        </a>
      </div>
    </main>
  </body>
</html>
