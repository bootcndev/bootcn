<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootcn Radio group preview</title>
    <script>
      // Preview theme: ?theme=dark|light, else the docs page around the frame, else light.
      (function () {
        var theme = new URLSearchParams(location.search).get('theme');
        if (!theme) {
          try {
            theme =
              window.parent !== window &&
              window.parent.document.documentElement.classList.contains('dark')
                ? 'dark'
                : 'light';
          } catch (error) {
            theme = 'light';
          }
        }
        document.documentElement.setAttribute('data-bs-theme', theme === 'dark' ? 'dark' : 'light');
        // ?dir=rtl: right to left, with Bootstrap's RTL stylesheet.
        if (new URLSearchParams(location.search).get('dir') === 'rtl') {
          document.documentElement.setAttribute('dir', 'rtl');
          new MutationObserver(function (records, observer) {
            var link = document.querySelector('link[href*="bootstrap.min.css"]');
            if (!link) return;
            link.href = link.href.replace('bootstrap.min.css', 'bootstrap.rtl.min.css');
            observer.disconnect();
          }).observe(document.documentElement, { childList: true, subtree: true });
        }
      })();
    </script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="../../themes/tokens/tokens.css" />
    <link rel="stylesheet" href="radio-group.css" />
  </head>
  <body>
    <main class="container py-4">
      <h1 class="h4 mb-4">Radio group</h1>
      <fieldset class="bootcn-radio-group">
        <legend class="bootcn-radio-group__legend">Notify me about</legend>
        <div class="form-check bootcn-radio-group__item">
          <input
            class="form-check-input"
            type="radio"
            name="bootcn-notify"
            id="bootcn-notify-all"
            value="all"
            checked
          />
          <label class="form-check-label" for="bootcn-notify-all">All new messages</label>
        </div>
        <div class="form-check bootcn-radio-group__item">
          <input
            class="form-check-input"
            type="radio"
            name="bootcn-notify"
            id="bootcn-notify-mentions"
            value="mentions"
          />
          <label class="form-check-label" for="bootcn-notify-mentions"
            >Direct messages and mentions</label
          >
        </div>
        <div class="form-check bootcn-radio-group__item">
          <input
            class="form-check-input"
            type="radio"
            name="bootcn-notify"
            id="bootcn-notify-none"
            value="none"
            disabled
          />
          <label class="form-check-label" for="bootcn-notify-none">Nothing (disabled)</label>
        </div>
      </fieldset>

      <fieldset class="bootcn-radio-group bootcn-radio-group--cards mt-4">
        <legend class="bootcn-radio-group__legend">Plan</legend>
        <div class="form-check bootcn-radio-group__item">
          <input
            class="form-check-input"
            type="radio"
            name="bootcn-plan"
            id="bootcn-plan-starter"
            value="starter"
            checked
            aria-describedby="bootcn-plan-starter-description"
          />
          <label class="form-check-label" for="bootcn-plan-starter">Starter</label>
          <p class="bootcn-radio-group__description" id="bootcn-plan-starter-description">
            For personal projects.
          </p>
        </div>
        <div class="form-check bootcn-radio-group__item">
          <input
            class="form-check-input"
            type="radio"
            name="bootcn-plan"
            id="bootcn-plan-team"
            value="team"
            aria-describedby="bootcn-plan-team-description"
          />
          <label class="form-check-label" for="bootcn-plan-team">Team</label>
          <p class="bootcn-radio-group__description" id="bootcn-plan-team-description">
            Up to 20 members.
          </p>
        </div>
      </fieldset>
    </main>
  </body>
</html>
