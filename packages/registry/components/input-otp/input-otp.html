<div class="bootcn-field">
  <label class="bootcn-label" for="bootcn-otp-code">Verification code</label>
  <div class="bootcn-otp" data-bootcn-otp>
    <input
      class="bootcn-otp__input"
      id="bootcn-otp-code"
      name="code"
      type="text"
      inputmode="numeric"
      autocomplete="one-time-code"
      pattern="[0-9]*"
      maxlength="6"
      aria-describedby="bootcn-otp-code-help"
    />
    <div class="bootcn-otp__slots" aria-hidden="true">
      <div class="bootcn-otp__group">
        <span class="bootcn-otp__slot"></span>
        <span class="bootcn-otp__slot"></span>
        <span class="bootcn-otp__slot"></span>
      </div>
      <span class="bootcn-otp__separator">–</span>
      <div class="bootcn-otp__group">
        <span class="bootcn-otp__slot"></span>
        <span class="bootcn-otp__slot"></span>
        <span class="bootcn-otp__slot"></span>
      </div>
    </div>
  </div>
  <p class="bootcn-field__help" id="bootcn-otp-code-help">
    Enter the 6-digit code we sent to your phone.
  </p>
</div>
