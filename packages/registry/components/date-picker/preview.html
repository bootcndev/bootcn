<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootcn Date picker preview</title>
    <script>
      // Preview theme: ?theme=dark|light, else the docs page around the frame, else light.
      (function () {
        var theme = new URLSearchParams(location.search).get('theme');
        if (!theme) {
          try {
            theme =
              window.parent !== window &&
              window.parent.document.documentElement.classList.contains('dark')
                ? 'dark'
                : 'light';
          } catch (error) {
            theme = 'light';
          }
        }
        document.documentElement.setAttribute('data-bs-theme', theme === 'dark' ? 'dark' : 'light');
      })();
    </script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="../../themes/tokens/tokens.css" />
    <link rel="stylesheet" href="../calendar/calendar.css" />
    <link rel="stylesheet" href="../button/button.css" />
    <link rel="stylesheet" href="../input/input.css" />
    <link rel="stylesheet" href="../label/label.css" />
    <link rel="stylesheet" href="date-picker.css" />
  </head>
  <body>
    <main class="container py-4" style="min-height: 28rem">
      <h1 class="h4 mb-4">Date picker</h1>
      <div class="dropdown bootcn-date-picker" data-bootcn-date-picker>
        <span class="bootcn-label" id="bootcn-date-picker-label">Delivery date</span>
        <button
          type="button"
          class="btn bootcn-button bootcn-button--outline bootcn-date-picker__trigger"
          data-bs-toggle="dropdown"
          data-bs-auto-close="outside"
          aria-expanded="false"
          aria-haspopup="dialog"
          aria-labelledby="bootcn-date-picker-label bootcn-date-picker-text"
        >
          <svg
            class="bootcn-icon"
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
            focusable="false"
          >
            <rect x="3" y="5" width="18" height="16" rx="2" />
            <path d="M16 3v4M8 3v4M3 11h18" />
          </svg>
          <span id="bootcn-date-picker-text" data-bootcn-date-picker-text>Pick a date</span>
        </button>
        <div
          class="dropdown-menu bootcn-date-picker__popover"
          role="dialog"
          aria-label="Choose a delivery date"
        >
          <div class="bootcn-calendar" data-bootcn-calendar>
            <div class="bootcn-calendar__header">
              <button
                type="button"
                class="bootcn-calendar__nav"
                data-bootcn-calendar-prev
                aria-label="Previous month"
              >
                <svg
                  class="bootcn-icon"
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                  focusable="false"
                >
                  <path d="m15 18-6-6 6-6" />
                </svg>
              </button>
              <h2
                class="bootcn-calendar__title"
                id="bootcn-date-picker-calendar-title"
                aria-live="polite"
              >
                Calendar
              </h2>
              <button
                type="button"
                class="bootcn-calendar__nav"
                data-bootcn-calendar-next
                aria-label="Next month"
              >
                <svg
                  class="bootcn-icon"
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                  focusable="false"
                >
                  <path d="m9 18 6-6-6-6" />
                </svg>
              </button>
            </div>
            <table
              class="bootcn-calendar__grid"
              role="grid"
              aria-labelledby="bootcn-date-picker-calendar-title"
            >
              <thead>
                <tr></tr>
              </thead>
              <tbody></tbody>
            </table>
            <input type="hidden" name="delivery" data-bootcn-calendar-input />
          </div>
        </div>
      </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../calendar/calendar.js"></script>
    <script src="date-picker.js"></script>
  </body>
</html>
