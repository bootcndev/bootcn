<div class="bootcn-tour-demo">
  <div class="bootcn-tour-demo__bar">
    <button
      type="button"
      class="btn bootcn-button bootcn-button--outline bootcn-button--sm"
      data-bootcn-tour-step="1"
      data-bootcn-tour-title="Search everything"
      data-bootcn-tour-text="Find projects, people and files. Press / from anywhere to jump here."
    >
      <svg
        class="bootcn-icon"
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
        focusable="false"
      >
        <circle cx="11" cy="11" r="7" />
        <path d="m20 20-3.5-3.5" />
      </svg>
      Search
    </button>
    <button
      type="button"
      class="btn bootcn-button bootcn-button--ghost bootcn-button--sm bootcn-button--icon"
      aria-label="Notifications"
      data-bootcn-tour-step="3"
      data-bootcn-tour-title="Stay in the loop"
      data-bootcn-tour-text="Mentions, comments and reviews you are asked for show up here."
    >
      <svg
        class="bootcn-icon"
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
        focusable="false"
      >
        <path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9" />
        <path d="M10 21a2 2 0 0 0 4 0" />
      </svg>
    </button>
    <button
      type="button"
      class="btn bootcn-button bootcn-button--default bootcn-button--sm"
      data-bootcn-tour-step="2"
      data-bootcn-tour-title="Start a project"
      data-bootcn-tour-text="Create a project from scratch or from one of the templates."
    >
      <svg
        class="bootcn-icon"
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
        focusable="false"
      >
        <path d="M12 5v14M5 12h14" />
      </svg>
      New project
    </button>
  </div>
  <button
    type="button"
    class="btn bootcn-button bootcn-button--secondary"
    data-bootcn-tour-start="#bootcn-tour"
  >
    Take the tour
  </button>
</div>

<div class="bootcn-tour" id="bootcn-tour" data-bootcn-tour hidden>
  <div class="bootcn-tour__blocker"></div>
  <div class="bootcn-tour__spotlight" data-bootcn-tour-spotlight aria-hidden="true"></div>
  <div
    class="bootcn-tour__card"
    role="dialog"
    aria-modal="true"
    aria-labelledby="bootcn-tour-title"
    aria-describedby="bootcn-tour-text"
    tabindex="-1"
    data-bootcn-tour-card
  >
    <span class="bootcn-tour__arrow" data-bootcn-tour-arrow aria-hidden="true"></span>
    <p class="bootcn-tour__count" data-bootcn-tour-count>1 of 3</p>
    <h2 class="bootcn-tour__title" id="bootcn-tour-title" data-bootcn-tour-title>
      Search everything
    </h2>
    <p class="bootcn-tour__text" id="bootcn-tour-text" data-bootcn-tour-text>
      Find projects, people and files.
    </p>
    <div class="bootcn-tour__actions">
      <button
        type="button"
        class="btn bootcn-button bootcn-button--ghost bootcn-button--sm"
        data-bootcn-tour-skip
      >
        Skip tour
      </button>
      <button
        type="button"
        class="btn bootcn-button bootcn-button--outline bootcn-button--sm"
        data-bootcn-tour-prev
      >
        Back
      </button>
      <button
        type="button"
        class="btn bootcn-button bootcn-button--default bootcn-button--sm"
        data-bootcn-tour-next
      >
        Next
      </button>
    </div>
    <button
      type="button"
      class="bootcn-tour__close"
      aria-label="Close the tour"
      data-bootcn-tour-skip
    >
      <svg
        class="bootcn-icon"
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
        focusable="false"
      >
        <path d="M18 6 6 18M6 6l12 12" />
      </svg>
    </button>
  </div>
</div>
