<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootcn Password strength preview</title>
    <script>
      // Preview theme: ?theme=dark|light, else the docs page around the frame, else light.
      (function () {
        var theme = new URLSearchParams(location.search).get('theme');
        if (!theme) {
          try {
            theme =
              window.parent !== window &&
              window.parent.document.documentElement.classList.contains('dark')
                ? 'dark'
                : 'light';
          } catch (error) {
            theme = 'light';
          }
        }
        document.documentElement.setAttribute('data-bs-theme', theme === 'dark' ? 'dark' : 'light');
        // ?dir=rtl: right to left, with Bootstrap's RTL stylesheet.
        if (new URLSearchParams(location.search).get('dir') === 'rtl') {
          document.documentElement.setAttribute('dir', 'rtl');
          new MutationObserver(function (records, observer) {
            var link = document.querySelector('link[href*="bootstrap.min.css"]');
            if (!link) return;
            link.href = link.href.replace('bootstrap.min.css', 'bootstrap.rtl.min.css');
            observer.disconnect();
          }).observe(document.documentElement, { childList: true, subtree: true });
        }
      })();
    </script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="../../themes/tokens/tokens.css" />
    <link rel="stylesheet" href="../input/input.css" />
    <link rel="stylesheet" href="../label/label.css" />
    <link rel="stylesheet" href="password-strength.css" />
  </head>
  <body>
    <main class="container py-4">
      <h1 class="h4 mb-4">Password strength</h1>
      <div class="bootcn-password" data-bootcn-password>
        <label class="bootcn-label" for="bootcn-password-new">Password</label>
        <div class="bootcn-password__control">
          <input
            class="form-control bootcn-input bootcn-password__input"
            type="password"
            id="bootcn-password-new"
            name="password"
            autocomplete="new-password"
            required
            aria-describedby="bootcn-password-new-strength bootcn-password-new-rules"
            data-bootcn-password-input
          />
          <button
            type="button"
            class="bootcn-password__toggle"
            aria-label="Show password"
            aria-pressed="false"
            aria-controls="bootcn-password-new"
            data-bootcn-password-toggle
          >
            <svg
              class="bootcn-icon bootcn-password__show"
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
            <svg
              class="bootcn-icon bootcn-password__hide"
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <path d="M10.7 5.1A10 10 0 0 1 12 5c6.5 0 10 7 10 7a13 13 0 0 1-1.7 2.7" />
              <path d="M6.6 6.6A13.5 13.5 0 0 0 2 12s3.5 7 10 7a9.7 9.7 0 0 0 5.4-1.6" />
              <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2" />
              <path d="m2 2 20 20" />
            </svg>
          </button>
        </div>
        <div class="bootcn-password__meter" aria-hidden="true">
          <span></span>
          <span></span>
          <span></span>
          <span></span>
        </div>
        <p
          class="bootcn-password__strength"
          id="bootcn-password-new-strength"
          data-bootcn-password-strength
        >
          Strength: too weak
        </p>
        <ul
          class="bootcn-password__rules"
          id="bootcn-password-new-rules"
          aria-label="Password requirements"
        >
          <li data-rule="length" data-min="8">At least 8 characters</li>
          <li data-rule="number">A number</li>
          <li data-rule="symbol">A symbol, such as ! or #</li>
          <li data-rule="case">Upper and lower case letters</li>
        </ul>
        <p class="visually-hidden" aria-live="polite" data-bootcn-password-status></p>
      </div>
    </main>
    <script src="password-strength.js"></script>
  </body>
</html>
