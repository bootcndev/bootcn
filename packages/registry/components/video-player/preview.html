<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootcn Video player preview</title>
    <script>
      // Preview theme: ?theme=dark|light, else the docs page around the frame, else light.
      (function () {
        var theme = new URLSearchParams(location.search).get('theme');
        if (!theme) {
          try {
            theme =
              window.parent !== window &&
              window.parent.document.documentElement.classList.contains('dark')
                ? 'dark'
                : 'light';
          } catch (error) {
            theme = 'light';
          }
        }
        document.documentElement.setAttribute('data-bs-theme', theme === 'dark' ? 'dark' : 'light');
        // ?dir=rtl: right to left, with Bootstrap's RTL stylesheet.
        if (new URLSearchParams(location.search).get('dir') === 'rtl') {
          document.documentElement.setAttribute('dir', 'rtl');
          new MutationObserver(function (records, observer) {
            var link = document.querySelector('link[href*="bootstrap.min.css"]');
            if (!link) return;
            link.href = link.href.replace('bootstrap.min.css', 'bootstrap.rtl.min.css');
            observer.disconnect();
          }).observe(document.documentElement, { childList: true, subtree: true });
        }
      })();
    </script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="../../themes/tokens/tokens.css" />
    <link rel="stylesheet" href="video-player.css" />
  </head>
  <body>
    <main class="container py-4" style="max-width: 48rem">
      <h1 class="h4 mb-4">Video player</h1>
      <div
        class="bootcn-video"
        data-bootcn-video
        role="group"
        aria-label="Video: Sunrise over the hills"
      >
        <div class="bootcn-video__stage">
          <video class="bootcn-video__media" preload="metadata" playsinline controls></video>
          <p class="bootcn-video__captions" data-bootcn-video-caption-text aria-hidden="true"></p>
          <span class="bootcn-video__osd" data-bootcn-video-osd aria-hidden="true"></span>
          <span class="bootcn-video__spinner" aria-hidden="true"></span>
        </div>
        <button
          type="button"
          class="bootcn-video__big-play"
          data-bootcn-video-play
          aria-label="Play"
        >
          <svg
            class="bootcn-icon"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
            focusable="false"
          >
            <path d="M7 5v14l12-7z" fill="currentColor" />
          </svg>
        </button>
        <div class="bootcn-video__controls">
          <input
            class="bootcn-video__seek"
            type="range"
            min="0"
            max="1"
            step="0.1"
            value="0"
            aria-label="Seek"
            data-bootcn-video-seek
          />
          <div class="bootcn-video__bar">
            <button
              type="button"
              class="bootcn-video__button"
              data-bootcn-video-play
              aria-label="Play"
            >
              <svg
                class="bootcn-icon bootcn-video__play-icon"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
                focusable="false"
              >
                <path d="M7 5v14l12-7z" fill="currentColor" /></svg
              ><svg
                class="bootcn-icon bootcn-video__pause-icon"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
                focusable="false"
              >
                <rect x="6" y="5" width="4" height="14" rx="1" fill="currentColor" />
                <rect x="14" y="5" width="4" height="14" rx="1" fill="currentColor" />
              </svg>
            </button>
            <button
              type="button"
              class="bootcn-video__button bootcn-video__skip"
              data-bootcn-video-back
              aria-label="Back 10 seconds"
            >
              <svg
                class="bootcn-icon"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
                focusable="false"
              >
                <path d="M3 12a9 9 0 1 0 3-6.7L3 8" />
                <path d="M3 3v5h5" />
                <text
                  x="12"
                  y="15.5"
                  font-size="7.5"
                  font-weight="700"
                  text-anchor="middle"
                  fill="currentColor"
                  stroke="none"
                >
                  10
                </text>
              </svg>
            </button>
            <button
              type="button"
              class="bootcn-video__button bootcn-video__skip"
              data-bootcn-video-forward
              aria-label="Forward 10 seconds"
            >
              <svg
                class="bootcn-icon"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
                focusable="false"
              >
                <path d="M21 12a9 9 0 1 1-3-6.7L21 8" />
                <path d="M21 3v5h-5" />
                <text
                  x="12"
                  y="15.5"
                  font-size="7.5"
                  font-weight="700"
                  text-anchor="middle"
                  fill="currentColor"
                  stroke="none"
                >
                  10
                </text>
              </svg>
            </button>
            <div class="bootcn-video__volume">
              <button
                type="button"
                class="bootcn-video__button"
                data-bootcn-video-mute
                aria-label="Mute"
                aria-pressed="false"
              >
                <svg
                  class="bootcn-icon bootcn-video__volume-icon"
                  width="20"
                  height="20"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                  focusable="false"
                >
                  <path d="M11 5 6 9H2v6h4l5 4z" />
                  <path d="M15.5 8.5a5 5 0 0 1 0 7" />
                  <path d="M19 5a10 10 0 0 1 0 14" /></svg
                ><svg
                  class="bootcn-icon bootcn-video__mute-icon"
                  width="20"
                  height="20"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                  focusable="false"
                >
                  <path d="M11 5 6 9H2v6h4l5 4z" />
                  <path d="m22 9-6 6M16 9l6 6" />
                </svg>
              </button>
              <input
                class="bootcn-video__volume-range"
                type="range"
                min="0"
                max="100"
                step="5"
                value="100"
                aria-label="Volume"
                data-bootcn-video-volume
              />
            </div>
            <span class="bootcn-video__time"
              ><span data-bootcn-video-current>0:00</span> /
              <span data-bootcn-video-duration>0:00</span></span
            >
            <span class="bootcn-video__spacer"></span>
            <select class="bootcn-video__speed" aria-label="Playback speed" data-bootcn-video-speed>
              <option value="0.5">0.5×</option>
              <option value="0.75">0.75×</option>
              <option value="1" selected>1×</option>
              <option value="1.25">1.25×</option>
              <option value="1.5">1.5×</option>
              <option value="2">2×</option>
            </select>
            <button
              type="button"
              class="bootcn-video__button"
              data-bootcn-video-captions
              aria-label="Captions"
              aria-pressed="false"
              hidden
            >
              <svg
                class="bootcn-icon"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
                focusable="false"
              >
                <rect x="2" y="5" width="20" height="14" rx="2" />
                <path d="M10 10.5a2 2 0 1 0 0 3M17 10.5a2 2 0 1 0 0 3" />
              </svg>
            </button>
            <button
              type="button"
              class="bootcn-video__button"
              data-bootcn-video-pip
              aria-label="Picture in picture"
              aria-pressed="false"
              hidden
            >
              <svg
                class="bootcn-icon"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
                focusable="false"
              >
                <rect x="2" y="4" width="20" height="16" rx="2" />
                <rect x="12" y="11" width="7" height="6" rx="1" fill="currentColor" />
              </svg>
            </button>
            <button
              type="button"
              class="bootcn-video__button"
              data-bootcn-video-fullscreen
              aria-label="Full screen"
              aria-pressed="false"
            >
              <svg
                class="bootcn-icon bootcn-video__enter-icon"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
                focusable="false"
              >
                <path
                  d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"
                /></svg
              ><svg
                class="bootcn-icon bootcn-video__exit-icon"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
                focusable="false"
              >
                <path
                  d="M8 3v3a2 2 0 0 1-2 2H3M21 8h-3a2 2 0 0 1-2-2V3M3 16h3a2 2 0 0 1 2 2v3M16 21v-3a2 2 0 0 1 2-2h3"
                />
              </svg>
            </button>
          </div>
        </div>
        <p class="visually-hidden" aria-live="polite" data-bootcn-video-live></p>
      </div>
      <p class="text-body-secondary small mt-3 mb-0">
        Keys while the player has focus: K or Space play, J and L 10 seconds, arrows 5 seconds and
        volume, M mute, C captions, F full screen.
      </p>
    </main>
    <script src="preview-sample.js"></script>
    <script>
      // Preview only: the sample video (a real page uses <source> elements).
      document.querySelector('[data-bootcn-video] video').src = window.BootcnSampleVideo;
    </script>
    <script src="video-player.js"></script>
    <script>
      // Preview only: captions added from code (a real page uses a <track>).
      (function () {
        var video = document.querySelector('[data-bootcn-video] video');
        if (!video.addTextTrack || !window.VTTCue) return;
        var track = video.addTextTrack('captions', 'English', 'en');
        [
          [0.5, 3.5, 'Before sunrise, the hills are still blue.'],
          [4, 7.5, 'A bird sets off across the valley.'],
          [8, 11.8, 'And the sun comes up over the ridge.'],
        ].forEach(function (cue) {
          track.addCue(new VTTCue(cue[0], cue[1], cue[2]));
        });
      })();
    </script>
  </body>
</html>
