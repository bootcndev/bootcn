<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootcn Code block preview</title>
    <script>
      // Preview theme: ?theme=dark|light, else the docs page around the frame, else light.
      (function () {
        var theme = new URLSearchParams(location.search).get('theme');
        if (!theme) {
          try {
            theme =
              window.parent !== window &&
              window.parent.document.documentElement.classList.contains('dark')
                ? 'dark'
                : 'light';
          } catch (error) {
            theme = 'light';
          }
        }
        document.documentElement.setAttribute('data-bs-theme', theme === 'dark' ? 'dark' : 'light');
        // ?dir=rtl: right to left, with Bootstrap's RTL stylesheet.
        if (new URLSearchParams(location.search).get('dir') === 'rtl') {
          document.documentElement.setAttribute('dir', 'rtl');
          new MutationObserver(function (records, observer) {
            var link = document.querySelector('link[href*="bootstrap.min.css"]');
            if (!link) return;
            link.href = link.href.replace('bootstrap.min.css', 'bootstrap.rtl.min.css');
            observer.disconnect();
          }).observe(document.documentElement, { childList: true, subtree: true });
        }
      })();
    </script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="../../themes/tokens/tokens.css" />
    <link rel="stylesheet" href="code-block.css" />
  </head>
  <body>
    <main class="container py-4">
      <h1 class="h4 mb-4">Code block</h1>
      <figure class="bootcn-code-block" data-bootcn-code-block>
        <figcaption class="bootcn-code-block__header">
          <span class="bootcn-code-block__title">Terminal</span>
          <button
            type="button"
            class="bootcn-code-block__copy"
            aria-label="Copy code"
            data-bootcn-code-block-copy
          >
            <svg
              class="bootcn-icon bootcn-code-block__copy-icon"
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <rect x="8" y="8" width="13" height="13" rx="2" />
              <path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3" />
            </svg>
            <svg
              class="bootcn-icon bootcn-code-block__done-icon"
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <path d="M20 6 9 17l-5-5" />
            </svg>
          </button>
        </figcaption>
        <pre class="bootcn-code-block__pre" tabindex="0"><code>npx bootcn add dialog</code></pre>
        <span class="visually-hidden" role="status" data-bootcn-code-block-status></span>
      </figure>

      <figure class="bootcn-code-block bootcn-code-block--numbered mt-4" data-bootcn-code-block>
        <figcaption class="bootcn-code-block__header">
          <span class="bootcn-code-block__title">components/ui/hello.php</span>
          <button
            type="button"
            class="bootcn-code-block__copy"
            aria-label="Copy code"
            data-bootcn-code-block-copy
          >
            <svg
              class="bootcn-icon bootcn-code-block__copy-icon"
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <rect x="8" y="8" width="13" height="13" rx="2" />
              <path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3" />
            </svg>
            <svg
              class="bootcn-icon bootcn-code-block__done-icon"
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <path d="M20 6 9 17l-5-5" />
            </svg>
          </button>
        </figcaption>
        <pre
          class="bootcn-code-block__pre"
          tabindex="0"
        ><code class="language-php"><span class="bootcn-code-block__line">&lt;?php</span>&#10;<span class="bootcn-code-block__line">$name = htmlspecialchars($_GET['name'] ?? 'world');</span>&#10;<span class="bootcn-code-block__line">?&gt;</span>&#10;<span class="bootcn-code-block__line">&lt;button type="button" class="btn bootcn-button bootcn-button--default"&gt;</span>&#10;<span class="bootcn-code-block__line">  Hello, &lt;?= $name ?&gt;</span>&#10;<span class="bootcn-code-block__line">&lt;/button&gt;</span></code></pre>
        <span class="visually-hidden" role="status" data-bootcn-code-block-status></span>
      </figure>
    </main>
    <script src="code-block.js"></script>
  </body>
</html>
