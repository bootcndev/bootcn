<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootcn Select preview</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="../../themes/tokens/tokens.css" />
    <link rel="stylesheet" href="../input/input.css" />
    <link rel="stylesheet" href="select.css" />
  </head>
  <body>
    <main class="container py-4">
      <h1 class="h4 mb-4">Select</h1>
      <div class="bootcn-field">
        <label for="bootcn-select-country" class="form-label bootcn-field__label">Country</label>
        <select
          class="form-select bootcn-select"
          id="bootcn-select-country"
          name="country"
          aria-describedby="bootcn-select-country-help"
        >
          <option value="">Choose a country</option>
          <option value="gr" selected>Greece</option>
          <option value="cy">Cyprus</option>
          <option value="it">Italy</option>
        </select>
        <p class="bootcn-field__help" id="bootcn-select-country-help">Used for tax calculation.</p>
      </div>

      <div class="bootcn-field mt-3">
        <label for="bootcn-select-timezone" class="form-label bootcn-field__label">Timezone</label>
        <select class="form-select bootcn-select" id="bootcn-select-timezone" name="timezone">
          <optgroup label="Europe">
            <option value="Europe/Athens">Athens</option>
            <option value="Europe/Berlin">Berlin</option>
          </optgroup>
          <optgroup label="America">
            <option value="America/New_York">New York</option>
          </optgroup>
        </select>
      </div>

      <div class="bootcn-field mt-3">
        <label for="bootcn-select-role" class="form-label bootcn-field__label">Role</label>
        <select
          class="form-select bootcn-select"
          id="bootcn-select-role"
          name="role"
          required
          aria-invalid="true"
          aria-describedby="bootcn-select-role-error"
        >
          <option value="" selected>Choose a role</option>
          <option value="admin">Admin</option>
          <option value="member">Member</option>
        </select>
        <div class="invalid-feedback" id="bootcn-select-role-error">Choose a role.</div>
      </div>

      <div class="bootcn-field mt-3">
        <label for="bootcn-select-disabled" class="form-label bootcn-field__label">Disabled</label>
        <select class="form-select bootcn-select" id="bootcn-select-disabled" disabled>
          <option>Not available</option>
        </select>
      </div>
      <section
        class="mt-5 p-3 rounded"
        data-bs-theme="dark"
        aria-label="Dark theme"
        style="background-color: var(--bs-body-bg); color: var(--bs-body-color)"
      >
        <h2 class="h6 mb-3">Dark theme</h2>
        <div class="bootcn-field">
          <label for="bootcn-select-country-dark" class="form-label bootcn-field__label"
            >Country</label
          >
          <select
            class="form-select bootcn-select"
            id="bootcn-select-country-dark"
            name="country-dark"
            aria-describedby="bootcn-select-country-help-dark"
          >
            <option value="">Choose a country</option>
            <option value="gr" selected>Greece</option>
            <option value="cy">Cyprus</option>
            <option value="it">Italy</option>
          </select>
          <p class="bootcn-field__help" id="bootcn-select-country-help-dark">
            Used for tax calculation.
          </p>
        </div>

        <div class="bootcn-field mt-3">
          <label for="bootcn-select-timezone-dark" class="form-label bootcn-field__label"
            >Timezone</label
          >
          <select
            class="form-select bootcn-select"
            id="bootcn-select-timezone-dark"
            name="timezone-dark"
          >
            <optgroup label="Europe">
              <option value="Europe/Athens">Athens</option>
              <option value="Europe/Berlin">Berlin</option>
            </optgroup>
            <optgroup label="America">
              <option value="America/New_York">New York</option>
            </optgroup>
          </select>
        </div>

        <div class="bootcn-field mt-3">
          <label for="bootcn-select-role-dark" class="form-label bootcn-field__label">Role</label>
          <select
            class="form-select bootcn-select"
            id="bootcn-select-role-dark"
            name="role-dark"
            required
            aria-invalid="true"
            aria-describedby="bootcn-select-role-error-dark"
          >
            <option value="" selected>Choose a role</option>
            <option value="admin">Admin</option>
            <option value="member">Member</option>
          </select>
          <div class="invalid-feedback" id="bootcn-select-role-error-dark">Choose a role.</div>
        </div>

        <div class="bootcn-field mt-3">
          <label for="bootcn-select-disabled-dark" class="form-label bootcn-field__label"
            >Disabled</label
          >
          <select class="form-select bootcn-select" id="bootcn-select-disabled-dark" disabled>
            <option>Not available</option>
          </select>
        </div>
      </section>
    </main>
  </body>
</html>
