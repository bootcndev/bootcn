<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootcn Dropzone preview</title>
    <script>
      // Preview theme: ?theme=dark|light, else the docs page around the frame, else light.
      (function () {
        var theme = new URLSearchParams(location.search).get('theme');
        if (!theme) {
          try {
            theme =
              window.parent !== window &&
              window.parent.document.documentElement.classList.contains('dark')
                ? 'dark'
                : 'light';
          } catch (error) {
            theme = 'light';
          }
        }
        document.documentElement.setAttribute('data-bs-theme', theme === 'dark' ? 'dark' : 'light');
        // ?dir=rtl: right to left, with Bootstrap's RTL stylesheet.
        if (new URLSearchParams(location.search).get('dir') === 'rtl') {
          document.documentElement.setAttribute('dir', 'rtl');
          new MutationObserver(function (records, observer) {
            var link = document.querySelector('link[href*="bootstrap.min.css"]');
            if (!link) return;
            link.href = link.href.replace('bootstrap.min.css', 'bootstrap.rtl.min.css');
            observer.disconnect();
          }).observe(document.documentElement, { childList: true, subtree: true });
        }
      })();
    </script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="../../themes/tokens/tokens.css" />
    <link rel="stylesheet" href="dropzone.css" />
  </head>
  <body>
    <main class="container py-4" style="max-width: 36rem">
      <h1 class="h4 mb-4">Dropzone</h1>
      <div class="bootcn-dropzone" data-bootcn-dropzone data-max-size="10485760">
        <label class="bootcn-dropzone__area">
          <span class="bootcn-dropzone__icon"
            ><svg
              class="bootcn-icon"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <path d="M7 18a5 5 0 1 1 1-9.9A6 6 0 0 1 19.5 10 4 4 0 0 1 18 18z" />
              <path d="M12 12v6M9.5 14.5 12 12l2.5 2.5" /></svg
          ></span>
          <span class="bootcn-dropzone__title"
            ><strong>Click to upload</strong> or drag and drop</span
          >
          <span class="bootcn-dropzone__hint" id="bootcn-dropzone-hint"
            >Images, PDF or spreadsheets, up to 10 MB each</span
          >
          <input
            type="file"
            id="bootcn-dropzone-input"
            class="bootcn-dropzone__input"
            multiple
            accept="image/*,.pdf,.csv,.xlsx"
            aria-describedby="bootcn-dropzone-hint"
            data-bootcn-dropzone-input
          />
        </label>
        <ul class="bootcn-dropzone__files" aria-label="Uploads" data-bootcn-dropzone-list></ul>
        <p class="visually-hidden" aria-live="polite" data-bootcn-dropzone-live></p>
      </div>
    </main>
    <script src="dropzone.js"></script>
    <script>
      // Preview only: pretend uploads that take a moment.
      document.addEventListener('bootcn:dropzone:file', function (event) {
        event.preventDefault();
        var detail = event.detail;
        var percent = 0;
        var timer = setInterval(function () {
          percent += 20;
          detail.progress(percent);
          if (percent >= 100) {
            clearInterval(timer);
            detail.done();
          }
        }, 250);
      });
    </script>
  </body>
</html>
