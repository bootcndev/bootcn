<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootcn Switch preview</title>
    <script>
      // Preview theme: ?theme=dark|light, else the docs page around the frame, else light.
      (function () {
        var theme = new URLSearchParams(location.search).get('theme');
        if (!theme) {
          try {
            theme =
              window.parent !== window &&
              window.parent.document.documentElement.classList.contains('dark')
                ? 'dark'
                : 'light';
          } catch (error) {
            theme = 'light';
          }
        }
        document.documentElement.setAttribute('data-bs-theme', theme === 'dark' ? 'dark' : 'light');
        // ?dir=rtl: right to left, with Bootstrap's RTL stylesheet.
        if (new URLSearchParams(location.search).get('dir') === 'rtl') {
          document.documentElement.setAttribute('dir', 'rtl');
          new MutationObserver(function (records, observer) {
            var link = document.querySelector('link[href*="bootstrap.min.css"]');
            if (!link) return;
            link.href = link.href.replace('bootstrap.min.css', 'bootstrap.rtl.min.css');
            observer.disconnect();
          }).observe(document.documentElement, { childList: true, subtree: true });
        }
      })();
    </script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="../../themes/tokens/tokens.css" />
    <link rel="stylesheet" href="switch.css" />
  </head>
  <body>
    <main class="container py-4">
      <h1 class="h4 mb-4">Switch</h1>
      <div class="form-check form-switch bootcn-switch">
        <input
          class="form-check-input bootcn-switch__input"
          type="checkbox"
          role="switch"
          id="bootcn-switch-wifi"
          name="wifi"
          checked
        />
        <label class="form-check-label bootcn-switch__label" for="bootcn-switch-wifi">Wi-Fi</label>
      </div>

      <div class="form-check form-switch bootcn-switch mt-3">
        <input
          class="form-check-input bootcn-switch__input"
          type="checkbox"
          role="switch"
          id="bootcn-switch-marketing"
          name="marketing"
          aria-describedby="bootcn-switch-marketing-description"
        />
        <label class="form-check-label bootcn-switch__label" for="bootcn-switch-marketing"
          >Marketing emails</label
        >
        <p class="bootcn-switch__description" id="bootcn-switch-marketing-description">
          Receive emails about new products and features.
        </p>
      </div>

      <div class="form-check form-switch bootcn-switch bootcn-switch--lg mt-3">
        <input
          class="form-check-input bootcn-switch__input"
          type="checkbox"
          role="switch"
          id="bootcn-switch-large"
        />
        <label class="form-check-label bootcn-switch__label" for="bootcn-switch-large"
          >Large switch</label
        >
      </div>

      <div class="form-check form-switch bootcn-switch mt-3">
        <input
          class="form-check-input bootcn-switch__input"
          type="checkbox"
          role="switch"
          id="bootcn-switch-disabled"
          disabled
        />
        <label class="form-check-label bootcn-switch__label" for="bootcn-switch-disabled"
          >Disabled</label
        >
      </div>
    </main>
  </body>
</html>
