<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootcn Switch preview</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="../../themes/tokens/tokens.css" />
    <link rel="stylesheet" href="switch.css" />
  </head>
  <body>
    <main class="container py-4">
      <h1 class="h4 mb-4">Switch</h1>
      <div class="form-check form-switch bootcn-switch">
        <input
          class="form-check-input bootcn-switch__input"
          type="checkbox"
          role="switch"
          id="bootcn-switch-wifi"
          name="wifi"
          checked
        />
        <label class="form-check-label bootcn-switch__label" for="bootcn-switch-wifi">Wi-Fi</label>
      </div>

      <div class="form-check form-switch bootcn-switch mt-3">
        <input
          class="form-check-input bootcn-switch__input"
          type="checkbox"
          role="switch"
          id="bootcn-switch-marketing"
          name="marketing"
          aria-describedby="bootcn-switch-marketing-description"
        />
        <label class="form-check-label bootcn-switch__label" for="bootcn-switch-marketing"
          >Marketing emails</label
        >
        <p class="bootcn-switch__description" id="bootcn-switch-marketing-description">
          Receive emails about new products and features.
        </p>
      </div>

      <div class="form-check form-switch bootcn-switch bootcn-switch--lg mt-3">
        <input
          class="form-check-input bootcn-switch__input"
          type="checkbox"
          role="switch"
          id="bootcn-switch-large"
        />
        <label class="form-check-label bootcn-switch__label" for="bootcn-switch-large"
          >Large switch</label
        >
      </div>

      <div class="form-check form-switch bootcn-switch mt-3">
        <input
          class="form-check-input bootcn-switch__input"
          type="checkbox"
          role="switch"
          id="bootcn-switch-disabled"
          disabled
        />
        <label class="form-check-label bootcn-switch__label" for="bootcn-switch-disabled"
          >Disabled</label
        >
      </div>
      <section
        class="mt-5 p-3 rounded"
        data-bs-theme="dark"
        aria-label="Dark theme"
        style="background-color: var(--bs-body-bg); color: var(--bs-body-color)"
      >
        <h2 class="h6 mb-3">Dark theme</h2>
        <div class="form-check form-switch bootcn-switch">
          <input
            class="form-check-input bootcn-switch__input"
            type="checkbox"
            role="switch"
            id="bootcn-switch-wifi-dark"
            name="wifi-dark"
            checked
          />
          <label class="form-check-label bootcn-switch__label" for="bootcn-switch-wifi-dark"
            >Wi-Fi</label
          >
        </div>

        <div class="form-check form-switch bootcn-switch mt-3">
          <input
            class="form-check-input bootcn-switch__input"
            type="checkbox"
            role="switch"
            id="bootcn-switch-marketing-dark"
            name="marketing-dark"
            aria-describedby="bootcn-switch-marketing-description-dark"
          />
          <label class="form-check-label bootcn-switch__label" for="bootcn-switch-marketing-dark"
            >Marketing emails</label
          >
          <p class="bootcn-switch__description" id="bootcn-switch-marketing-description-dark">
            Receive emails about new products and features.
          </p>
        </div>

        <div class="form-check form-switch bootcn-switch bootcn-switch--lg mt-3">
          <input
            class="form-check-input bootcn-switch__input"
            type="checkbox"
            role="switch"
            id="bootcn-switch-large-dark"
          />
          <label class="form-check-label bootcn-switch__label" for="bootcn-switch-large-dark"
            >Large switch</label
          >
        </div>

        <div class="form-check form-switch bootcn-switch mt-3">
          <input
            class="form-check-input bootcn-switch__input"
            type="checkbox"
            role="switch"
            id="bootcn-switch-disabled-dark"
            disabled
          />
          <label class="form-check-label bootcn-switch__label" for="bootcn-switch-disabled-dark"
            >Disabled</label
          >
        </div>
      </section>
    </main>
  </body>
</html>
