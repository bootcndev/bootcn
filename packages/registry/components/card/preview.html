<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootcn Card preview</title>
    <script>
      // Preview theme: ?theme=dark|light, else the docs page around the frame, else light.
      (function () {
        var theme = new URLSearchParams(location.search).get('theme');
        if (!theme) {
          try {
            theme =
              window.parent !== window &&
              window.parent.document.documentElement.classList.contains('dark')
                ? 'dark'
                : 'light';
          } catch (error) {
            theme = 'light';
          }
        }
        document.documentElement.setAttribute('data-bs-theme', theme === 'dark' ? 'dark' : 'light');
      })();
    </script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="../../themes/tokens/tokens.css" />
    <link rel="stylesheet" href="../button/button.css" />
    <link rel="stylesheet" href="card.css" />
  </head>
  <body>
    <main class="container py-4">
      <h1 class="h4 mb-3">Card</h1>

      <article class="card bootcn-card" style="max-width: 28rem">
        <header class="bootcn-card__header">
          <h2 class="bootcn-card__title">Project settings</h2>
          <p class="bootcn-card__description">Update your project name and visibility.</p>
        </header>
        <div class="bootcn-card__content">
          <p class="mb-0">Changes are saved automatically for members of this workspace.</p>
        </div>
        <footer class="bootcn-card__footer">
          <button type="button" class="btn bootcn-button bootcn-button--outline bootcn-button--sm">
            Cancel
          </button>
          <button type="button" class="btn bootcn-button bootcn-button--default bootcn-button--sm">
            Save
          </button>
        </footer>
      </article>
    </main>
  </body>
</html>
