<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootcn Dialog preview</title>
    <script>
      // Preview theme: ?theme=dark|light, else the docs page around the frame, else light.
      (function () {
        var theme = new URLSearchParams(location.search).get('theme');
        if (!theme) {
          try {
            theme =
              window.parent !== window &&
              window.parent.document.documentElement.classList.contains('dark')
                ? 'dark'
                : 'light';
          } catch (error) {
            theme = 'light';
          }
        }
        document.documentElement.setAttribute('data-bs-theme', theme === 'dark' ? 'dark' : 'light');
      })();
    </script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="../../themes/tokens/tokens.css" />
    <link rel="stylesheet" href="../button/button.css" />
    <link rel="stylesheet" href="dialog.css" />
  </head>
  <body>
    <main class="container py-4">
      <h1 class="h4 mb-3">Dialog</h1>
      <p class="text-muted mb-3">
        A confirm dialog built on Bootstrap's modal, with a confirm event.
      </p>

      <button
        type="button"
        class="btn bootcn-button bootcn-button--destructive"
        data-bootcn-dialog-confirm
        data-bs-toggle="modal"
        data-bs-target="#bootcn-example-dialog"
      >
        Delete project
      </button>

      <div
        class="modal fade bootcn-dialog"
        id="bootcn-example-dialog"
        tabindex="-1"
        role="dialog"
        aria-modal="true"
        aria-labelledby="bootcn-example-dialog-title"
        aria-describedby="bootcn-example-dialog-description"
      >
        <div class="modal-dialog modal-dialog-centered">
          <div class="modal-content">
            <div class="modal-header">
              <h2 class="modal-title bootcn-dialog__title" id="bootcn-example-dialog-title">
                Delete this project?
              </h2>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
                aria-label="Close dialog"
              ></button>
            </div>
            <div class="modal-body">
              <p class="bootcn-dialog__description" id="bootcn-example-dialog-description">
                This permanently removes the project and all of its data. This action cannot be
                undone.
              </p>
            </div>
            <div class="modal-footer bootcn-dialog__footer">
              <button
                type="button"
                class="btn bootcn-button bootcn-button--outline bootcn-button--sm"
                data-bs-dismiss="modal"
              >
                Cancel
              </button>
              <button
                type="button"
                class="btn bootcn-button bootcn-button--destructive bootcn-button--sm"
                data-bootcn-dialog-confirm-button
                data-bs-dismiss="modal"
              >
                Delete project
              </button>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"></script>
    <script src="dialog.js"></script>
  </body>
</html>
