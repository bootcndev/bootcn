<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootcn Carousel preview</title>
    <script>
      // Preview theme: ?theme=dark|light, else the docs page around the frame, else light.
      (function () {
        var theme = new URLSearchParams(location.search).get('theme');
        if (!theme) {
          try {
            theme =
              window.parent !== window &&
              window.parent.document.documentElement.classList.contains('dark')
                ? 'dark'
                : 'light';
          } catch (error) {
            theme = 'light';
          }
        }
        document.documentElement.setAttribute('data-bs-theme', theme === 'dark' ? 'dark' : 'light');
      })();
    </script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="../../themes/tokens/tokens.css" />
    <link rel="stylesheet" href="carousel.css" />
  </head>
  <body>
    <main class="container py-4">
      <h1 class="h4 mb-4">Carousel</h1>
      <section
        id="bootcn-carousel"
        class="carousel slide bootcn-carousel"
        aria-roledescription="carousel"
        aria-label="Featured numbers"
      >
        <div class="carousel-inner" aria-live="polite">
          <div
            class="carousel-item active"
            role="group"
            aria-roledescription="slide"
            aria-label="1 of 5"
          >
            <div class="bootcn-carousel__slide">1</div>
          </div>
          <div class="carousel-item" role="group" aria-roledescription="slide" aria-label="2 of 5">
            <div class="bootcn-carousel__slide">2</div>
          </div>
          <div class="carousel-item" role="group" aria-roledescription="slide" aria-label="3 of 5">
            <div class="bootcn-carousel__slide">3</div>
          </div>
          <div class="carousel-item" role="group" aria-roledescription="slide" aria-label="4 of 5">
            <div class="bootcn-carousel__slide">4</div>
          </div>
          <div class="carousel-item" role="group" aria-roledescription="slide" aria-label="5 of 5">
            <div class="bootcn-carousel__slide">5</div>
          </div>
        </div>
        <button
          class="bootcn-carousel__control bootcn-carousel__control--prev"
          type="button"
          data-bs-target="#bootcn-carousel"
          data-bs-slide="prev"
        >
          <svg
            class="bootcn-icon"
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
            focusable="false"
          >
            <path d="m15 18-6-6 6-6" />
          </svg>
          <span class="visually-hidden">Previous slide</span>
        </button>
        <button
          class="bootcn-carousel__control bootcn-carousel__control--next"
          type="button"
          data-bs-target="#bootcn-carousel"
          data-bs-slide="next"
        >
          <svg
            class="bootcn-icon"
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
            focusable="false"
          >
            <path d="m9 18 6-6-6-6" />
          </svg>
          <span class="visually-hidden">Next slide</span>
        </button>
      </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
