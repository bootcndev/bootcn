<section
  id="bootcn-carousel"
  class="carousel slide bootcn-carousel"
  aria-roledescription="carousel"
  aria-label="Featured numbers"
>
  <div class="carousel-inner" aria-live="polite">
    <div class="carousel-item active" role="group" aria-roledescription="slide" aria-label="1 of 5">
      <div class="bootcn-carousel__slide">1</div>
    </div>
    <div class="carousel-item" role="group" aria-roledescription="slide" aria-label="2 of 5">
      <div class="bootcn-carousel__slide">2</div>
    </div>
    <div class="carousel-item" role="group" aria-roledescription="slide" aria-label="3 of 5">
      <div class="bootcn-carousel__slide">3</div>
    </div>
    <div class="carousel-item" role="group" aria-roledescription="slide" aria-label="4 of 5">
      <div class="bootcn-carousel__slide">4</div>
    </div>
    <div class="carousel-item" role="group" aria-roledescription="slide" aria-label="5 of 5">
      <div class="bootcn-carousel__slide">5</div>
    </div>
  </div>
  <button
    class="bootcn-carousel__control bootcn-carousel__control--prev"
    type="button"
    data-bs-target="#bootcn-carousel"
    data-bs-slide="prev"
  >
    <svg
      class="bootcn-icon bootcn-rtl-flip"
      width="16"
      height="16"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
      focusable="false"
    >
      <path d="m15 18-6-6 6-6" />
    </svg>
    <span class="visually-hidden">Previous slide</span>
  </button>
  <button
    class="bootcn-carousel__control bootcn-carousel__control--next"
    type="button"
    data-bs-target="#bootcn-carousel"
    data-bs-slide="next"
  >
    <svg
      class="bootcn-icon bootcn-rtl-flip"
      width="16"
      height="16"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
      focusable="false"
    >
      <path d="m9 18 6-6-6-6" />
    </svg>
    <span class="visually-hidden">Next slide</span>
  </button>
</section>
