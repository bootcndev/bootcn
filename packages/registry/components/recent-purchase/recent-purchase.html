<div class="bootcn-purchase" data-bootcn-purchase data-duration="6000" aria-live="polite">
  <template data-purchase-template>
    <div class="bootcn-purchase__notice">
      <span class="bootcn-purchase__image" aria-hidden="true"
        ><svg
          class="bootcn-icon"
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
          focusable="false"
        >
          <path d="M6 7h12l1 14H5z" />
          <path d="M9 7a3 3 0 0 1 6 0" /></svg
      ></span>
      <p class="bootcn-purchase__text">
        <span data-purchase-who></span> bought
        <a class="bootcn-purchase__product" href="#" data-purchase-product>Product</a>
        <time class="bootcn-purchase__time" data-purchase-time></time>
      </p>
      <button
        type="button"
        class="bootcn-purchase__close"
        data-purchase-close
        aria-label="Hide purchase notifications"
      >
        <svg
          class="bootcn-icon"
          width="14"
          height="14"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
          focusable="false"
        >
          <path d="M18 6 6 18M6 6l12 12" />
        </svg>
      </button>
    </div>
  </template>
</div>
