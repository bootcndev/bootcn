<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootcn Map embed preview</title>
    <script>
      // Preview theme: ?theme=dark|light, else the docs page around the frame, else light.
      (function () {
        var theme = new URLSearchParams(location.search).get('theme');
        if (!theme) {
          try {
            theme =
              window.parent !== window &&
              window.parent.document.documentElement.classList.contains('dark')
                ? 'dark'
                : 'light';
          } catch (error) {
            theme = 'light';
          }
        }
        document.documentElement.setAttribute('data-bs-theme', theme === 'dark' ? 'dark' : 'light');
        // ?dir=rtl: right to left, with Bootstrap's RTL stylesheet.
        if (new URLSearchParams(location.search).get('dir') === 'rtl') {
          document.documentElement.setAttribute('dir', 'rtl');
          new MutationObserver(function (records, observer) {
            var link = document.querySelector('link[href*="bootstrap.min.css"]');
            if (!link) return;
            link.href = link.href.replace('bootstrap.min.css', 'bootstrap.rtl.min.css');
            observer.disconnect();
          }).observe(document.documentElement, { childList: true, subtree: true });
        }
      })();
    </script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="../../themes/tokens/tokens.css" />
    <link rel="stylesheet" href="../button/button.css" />
    <link rel="stylesheet" href="map-embed.css" />
  </head>
  <body>
    <main class="container py-4">
      <h1 class="h4 mb-4">Map embed</h1>
      <figure
        class="bootcn-map"
        data-bootcn-map
        data-lat="37.788"
        data-lon="-122.4075"
        data-zoom="16"
        data-title="Map of Union Square, San Francisco"
      >
        <div class="bootcn-map__frame">
          <div class="bootcn-map__placeholder">
            <span class="bootcn-map__pin" aria-hidden="true"
              ><svg
                class="bootcn-icon"
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
                focusable="false"
              >
                <path d="M12 21s-7-6.3-7-12a7 7 0 0 1 14 0c0 5.7-7 12-7 12z" />
                <circle cx="12" cy="9" r="2.5" /></svg
            ></span>
            <p class="bootcn-map__notice">
              The map is loaded from OpenStreetMap when you ask for it.
            </p>
            <button
              type="button"
              class="btn bootcn-button bootcn-button--secondary bootcn-button--sm"
              data-bootcn-map-load
            >
              Show map
            </button>
          </div>
        </div>
        <figcaption class="bootcn-map__caption">
          Union Square, San Francisco ·
          <a
            href="https://www.openstreetmap.org/?mlat=37.788&amp;mlon=-122.4075#map=17/37.788/-122.4075"
            target="_blank"
            rel="noreferrer"
            >Open in OpenStreetMap</a
          >
        </figcaption>
      </figure>
    </main>
    <script src="map-embed.js"></script>
  </body>
</html>
