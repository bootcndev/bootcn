<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootcn Table preview</title>
    <script>
      // Preview theme: ?theme=dark|light, else the docs page around the frame, else light.
      (function () {
        var theme = new URLSearchParams(location.search).get('theme');
        if (!theme) {
          try {
            theme =
              window.parent !== window &&
              window.parent.document.documentElement.classList.contains('dark')
                ? 'dark'
                : 'light';
          } catch (error) {
            theme = 'light';
          }
        }
        document.documentElement.setAttribute('data-bs-theme', theme === 'dark' ? 'dark' : 'light');
      })();
    </script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="../../themes/tokens/tokens.css" />
    <link rel="stylesheet" href="table.css" />
  </head>
  <body>
    <main class="container py-4">
      <h1 class="h4 mb-4">Table</h1>
      <div class="table-responsive">
        <table class="table bootcn-table">
          <caption>
            Your recent invoices.
          </caption>
          <thead>
            <tr>
              <th scope="col">Invoice</th>
              <th scope="col">Status</th>
              <th scope="col">Method</th>
              <th scope="col" class="text-end">Amount</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <th scope="row">INV-001</th>
              <td>Paid</td>
              <td>Card</td>
              <td class="text-end">€250.00</td>
            </tr>
            <tr>
              <th scope="row">INV-002</th>
              <td>Pending</td>
              <td>Bank transfer</td>
              <td class="text-end">€150.00</td>
            </tr>
            <tr>
              <th scope="row">INV-003</th>
              <td>Unpaid</td>
              <td>Bank transfer</td>
              <td class="text-end">€350.00</td>
            </tr>
            <tr>
              <th scope="row">INV-004</th>
              <td>Paid</td>
              <td>Card</td>
              <td class="text-end">€450.00</td>
            </tr>
            <tr>
              <th scope="row">INV-005</th>
              <td>Paid</td>
              <td>PayPal</td>
              <td class="text-end">€550.00</td>
            </tr>
          </tbody>
          <tfoot>
            <tr>
              <th scope="row" colspan="3">Total</th>
              <td class="text-end">€1,750.00</td>
            </tr>
          </tfoot>
        </table>
      </div>
    </main>
  </body>
</html>
