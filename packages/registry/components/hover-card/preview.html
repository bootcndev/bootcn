<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootcn Hover card preview</title>
    <script>
      // Preview theme: ?theme=dark|light, else the docs page around the frame, else light.
      (function () {
        var theme = new URLSearchParams(location.search).get('theme');
        if (!theme) {
          try {
            theme =
              window.parent !== window &&
              window.parent.document.documentElement.classList.contains('dark')
                ? 'dark'
                : 'light';
          } catch (error) {
            theme = 'light';
          }
        }
        document.documentElement.setAttribute('data-bs-theme', theme === 'dark' ? 'dark' : 'light');
      })();
    </script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="../../themes/tokens/tokens.css" />
    <link rel="stylesheet" href="../avatar/avatar.css" />
    <link rel="stylesheet" href="hover-card.css" />
  </head>
  <body>
    <main class="container py-4">
      <h1 class="h4 mb-4">Hover card</h1>
      <p>
        Maintained by
        <a
          href="#profile"
          class="bootcn-hover-card__trigger"
          data-bootcn-hover-card="bootcn-hover-card-profile"
          >@acme</a
        >
        and contributors.
      </p>

      <template id="bootcn-hover-card-profile">
        <div class="bootcn-hover-card__body">
          <span class="bootcn-avatar" aria-hidden="true"
            ><span class="bootcn-avatar__fallback">AC</span></span
          >
          <div>
            <p class="bootcn-hover-card__name">Acme</p>
            <p class="bootcn-hover-card__text">
              Open-source tools for teams who build for the web.
            </p>
            <p class="bootcn-hover-card__meta">Joined March 2021</p>
          </div>
        </div>
      </template>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"></script>
    <script src="hover-card.js"></script>
  </body>
</html>
