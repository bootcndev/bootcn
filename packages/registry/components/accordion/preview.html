<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootcn Accordion preview</title>
    <script>
      // Preview theme: ?theme=dark|light, else the docs page around the frame, else light.
      (function () {
        var theme = new URLSearchParams(location.search).get('theme');
        if (!theme) {
          try {
            theme =
              window.parent !== window &&
              window.parent.document.documentElement.classList.contains('dark')
                ? 'dark'
                : 'light';
          } catch (error) {
            theme = 'light';
          }
        }
        document.documentElement.setAttribute('data-bs-theme', theme === 'dark' ? 'dark' : 'light');
        // ?dir=rtl: right to left, with Bootstrap's RTL stylesheet.
        if (new URLSearchParams(location.search).get('dir') === 'rtl') {
          document.documentElement.setAttribute('dir', 'rtl');
          new MutationObserver(function (records, observer) {
            var link = document.querySelector('link[href*="bootstrap.min.css"]');
            if (!link) return;
            link.href = link.href.replace('bootstrap.min.css', 'bootstrap.rtl.min.css');
            observer.disconnect();
          }).observe(document.documentElement, { childList: true, subtree: true });
        }
      })();
    </script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="../../themes/tokens/tokens.css" />
    <link rel="stylesheet" href="accordion.css" />
  </head>
  <body>
    <main class="container py-4">
      <h1 class="h4 mb-4">Accordion</h1>
      <div class="accordion bootcn-accordion" id="bootcn-accordion-faq">
        <div class="accordion-item">
          <h2 class="accordion-header">
            <button
              class="accordion-button"
              type="button"
              data-bs-toggle="collapse"
              data-bs-target="#bootcn-accordion-faq-one"
              aria-expanded="true"
              aria-controls="bootcn-accordion-faq-one"
            >
              Is it accessible?
            </button>
          </h2>
          <div
            id="bootcn-accordion-faq-one"
            class="accordion-collapse collapse show"
            data-bs-parent="#bootcn-accordion-faq"
          >
            <div class="accordion-body">
              Yes. It uses buttons with aria-expanded and Bootstrap's Collapse plugin.
            </div>
          </div>
        </div>
        <div class="accordion-item">
          <h2 class="accordion-header">
            <button
              class="accordion-button collapsed"
              type="button"
              data-bs-toggle="collapse"
              data-bs-target="#bootcn-accordion-faq-two"
              aria-expanded="false"
              aria-controls="bootcn-accordion-faq-two"
            >
              Does it need a framework?
            </button>
          </h2>
          <div
            id="bootcn-accordion-faq-two"
            class="accordion-collapse collapse"
            data-bs-parent="#bootcn-accordion-faq"
          >
            <div class="accordion-body">No. Bootstrap's JavaScript bundle is all it needs.</div>
          </div>
        </div>
        <div class="accordion-item">
          <h2 class="accordion-header">
            <button
              class="accordion-button collapsed"
              type="button"
              data-bs-toggle="collapse"
              data-bs-target="#bootcn-accordion-faq-three"
              aria-expanded="false"
              aria-controls="bootcn-accordion-faq-three"
            >
              Can I open several at once?
            </button>
          </h2>
          <div
            id="bootcn-accordion-faq-three"
            class="accordion-collapse collapse"
            data-bs-parent="#bootcn-accordion-faq"
          >
            <div class="accordion-body">
              Remove data-bs-parent from the panels to let them open independently.
            </div>
          </div>
        </div>
      </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
