<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootcn Image preview</title>
    <script>
      // Preview theme: ?theme=dark|light, else the docs page around the frame, else light.
      (function () {
        var theme = new URLSearchParams(location.search).get('theme');
        if (!theme) {
          try {
            theme =
              window.parent !== window &&
              window.parent.document.documentElement.classList.contains('dark')
                ? 'dark'
                : 'light';
          } catch (error) {
            theme = 'light';
          }
        }
        document.documentElement.setAttribute('data-bs-theme', theme === 'dark' ? 'dark' : 'light');
        // ?dir=rtl: right to left, with Bootstrap's RTL stylesheet.
        if (new URLSearchParams(location.search).get('dir') === 'rtl') {
          document.documentElement.setAttribute('dir', 'rtl');
          new MutationObserver(function (records, observer) {
            var link = document.querySelector('link[href*="bootstrap.min.css"]');
            if (!link) return;
            link.href = link.href.replace('bootstrap.min.css', 'bootstrap.rtl.min.css');
            observer.disconnect();
          }).observe(document.documentElement, { childList: true, subtree: true });
        }
      })();
    </script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="../../themes/tokens/tokens.css" />
    <link rel="stylesheet" href="image.css" />
  </head>
  <body>
    <main class="container py-4">
      <h1 class="h4 mb-4">Image</h1>
      <div class="bootcn-image-demo">
        <figure class="bootcn-image bootcn-image--zoom" data-bootcn-image>
          <img
            class="bootcn-image__img"
            src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 360'%3E%3Cdefs%3E%3ClinearGradient id='s' x1='0' y1='0' x2='0' y2='1'%3E%3Cstop offset='0' stop-color='%23fde68a'/%3E%3Cstop offset='1' stop-color='%23fb7185'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='640' height='360' fill='url(%23s)'/%3E%3Ccircle cx='470' cy='130' r='46' fill='%23fff7ed'/%3E%3Cpath d='M0 260 160 150 270 230 380 140 640 280V360H0z' fill='%239f1239'/%3E%3Cpath d='M0 300 200 220 330 290 460 230 640 310V360H0z' fill='%234c0519'/%3E%3C/svg%3E"
            alt="A sunset over red mountains"
            width="640"
            height="360"
            loading="lazy"
          />
        </figure>
        <figure class="bootcn-image" data-bootcn-image>
          <img
            class="bootcn-image__img"
            src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 360'%3E%3Cdefs%3E%3ClinearGradient id='s' x1='0' y1='0' x2='0' y2='1'%3E%3Cstop offset='0' stop-color='%23fde68a'/%3E%3Cstop offset='1' stop-color='%23fb7185'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='640' height='360' fill='url(%23s)'/%3E%3Ccircle cx='470' cy='130' r='46' fill='%23fff7ed'/%3E%3Cpath d='M0 260 160 150 270 230 380 140 640 280V360H0z' fill='%239f1239'/%3E%3Cpath d='M0 300 200 220 330 290 460 230 640 310V360H0z' fill='%234c0519'/%3E%3C/svg%3E"
            alt="The same sunset, without zoom"
            width="640"
            height="360"
            loading="lazy"
          />
          <figcaption class="bootcn-image__caption">Without zoom, with a caption.</figcaption>
        </figure>
      </div>
    </main>
    <script src="image.js"></script>
  </body>
</html>
