<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootcn Snippet preview</title>
    <script>
      // Preview theme: ?theme=dark|light, else the docs page around the frame, else light.
      (function () {
        var theme = new URLSearchParams(location.search).get('theme');
        if (!theme) {
          try {
            theme =
              window.parent !== window &&
              window.parent.document.documentElement.classList.contains('dark')
                ? 'dark'
                : 'light';
          } catch (error) {
            theme = 'light';
          }
        }
        document.documentElement.setAttribute('data-bs-theme', theme === 'dark' ? 'dark' : 'light');
        // ?dir=rtl: right to left, with Bootstrap's RTL stylesheet.
        if (new URLSearchParams(location.search).get('dir') === 'rtl') {
          document.documentElement.setAttribute('dir', 'rtl');
          new MutationObserver(function (records, observer) {
            var link = document.querySelector('link[href*="bootstrap.min.css"]');
            if (!link) return;
            link.href = link.href.replace('bootstrap.min.css', 'bootstrap.rtl.min.css');
            observer.disconnect();
          }).observe(document.documentElement, { childList: true, subtree: true });
        }
      })();
    </script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="../../themes/tokens/tokens.css" />
    <link rel="stylesheet" href="snippet.css" />
  </head>
  <body>
    <main class="container py-4">
      <h1 class="h4 mb-4">Snippet</h1>
      <div class="bootcn-snippet" data-bootcn-snippet>
        <pre
          class="bootcn-snippet__pre"
        ><code><span class="bootcn-snippet__line">npx bootcn@latest init</span></code></pre>
        <button
          type="button"
          class="bootcn-snippet__copy"
          aria-label="Copy command"
          data-bootcn-snippet-copy
        >
          <svg
            class="bootcn-icon bootcn-snippet__copy-icon"
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
            focusable="false"
          >
            <rect x="8" y="8" width="13" height="13" rx="2" />
            <path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3" />
          </svg>
          <svg
            class="bootcn-icon bootcn-snippet__done-icon"
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
            focusable="false"
          >
            <path d="M20 6 9 17l-5-5" />
          </svg>
        </button>
        <span class="visually-hidden" role="status" data-bootcn-snippet-status></span>
      </div>

      <div class="bootcn-snippet bootcn-snippet--secondary mt-3" data-bootcn-snippet>
        <pre
          class="bootcn-snippet__pre"
        ><code><span class="bootcn-snippet__line">npm install</span><span class="bootcn-snippet__line">npm run dev</span></code></pre>
        <button
          type="button"
          class="bootcn-snippet__copy"
          aria-label="Copy commands"
          data-bootcn-snippet-copy
        >
          <svg
            class="bootcn-icon bootcn-snippet__copy-icon"
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
            focusable="false"
          >
            <rect x="8" y="8" width="13" height="13" rx="2" />
            <path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3" />
          </svg>
          <svg
            class="bootcn-icon bootcn-snippet__done-icon"
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
            focusable="false"
          >
            <path d="M20 6 9 17l-5-5" />
          </svg>
        </button>
        <span class="visually-hidden" role="status" data-bootcn-snippet-status></span>
      </div>
    </main>
    <script src="snippet.js"></script>
  </body>
</html>
