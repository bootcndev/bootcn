<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootcn Skeleton preview</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="../../themes/tokens/tokens.css" />
    <link rel="stylesheet" href="skeleton.css" />
  </head>
  <body>
    <main class="container py-4">
      <h1 class="h4 mb-4">Skeleton</h1>
      <div class="bootcn-skeleton-group" aria-busy="true" aria-live="polite">
        <span class="visually-hidden">Loading profile…</span>
        <div class="d-flex align-items-center gap-3" aria-hidden="true">
          <span class="placeholder bootcn-skeleton bootcn-skeleton--circle"></span>
          <div class="flex-grow-1">
            <span class="placeholder bootcn-skeleton bootcn-skeleton--text col-6"></span>
            <span class="placeholder bootcn-skeleton bootcn-skeleton--text col-4"></span>
          </div>
        </div>
        <span
          class="placeholder bootcn-skeleton bootcn-skeleton--block mt-3"
          aria-hidden="true"
        ></span>
      </div>
      <section
        class="mt-5 p-3 rounded"
        data-bs-theme="dark"
        aria-label="Dark theme"
        style="background-color: var(--bs-body-bg); color: var(--bs-body-color)"
      >
        <h2 class="h6 mb-3">Dark theme</h2>
        <div class="bootcn-skeleton-group" aria-busy="true" aria-live="polite">
          <span class="visually-hidden">Loading profile…</span>
          <div class="d-flex align-items-center gap-3" aria-hidden="true">
            <span class="placeholder bootcn-skeleton bootcn-skeleton--circle"></span>
            <div class="flex-grow-1">
              <span class="placeholder bootcn-skeleton bootcn-skeleton--text col-6"></span>
              <span class="placeholder bootcn-skeleton bootcn-skeleton--text col-4"></span>
            </div>
          </div>
          <span
            class="placeholder bootcn-skeleton bootcn-skeleton--block mt-3"
            aria-hidden="true"
          ></span>
        </div>
      </section>
    </main>
  </body>
</html>
