<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootcn Toggle group preview</title>
    <script>
      // Preview theme: ?theme=dark|light, else the docs page around the frame, else light.
      (function () {
        var theme = new URLSearchParams(location.search).get('theme');
        if (!theme) {
          try {
            theme =
              window.parent !== window &&
              window.parent.document.documentElement.classList.contains('dark')
                ? 'dark'
                : 'light';
          } catch (error) {
            theme = 'light';
          }
        }
        document.documentElement.setAttribute('data-bs-theme', theme === 'dark' ? 'dark' : 'light');
        // ?dir=rtl: right to left, with Bootstrap's RTL stylesheet.
        if (new URLSearchParams(location.search).get('dir') === 'rtl') {
          document.documentElement.setAttribute('dir', 'rtl');
          new MutationObserver(function (records, observer) {
            var link = document.querySelector('link[href*="bootstrap.min.css"]');
            if (!link) return;
            link.href = link.href.replace('bootstrap.min.css', 'bootstrap.rtl.min.css');
            observer.disconnect();
          }).observe(document.documentElement, { childList: true, subtree: true });
        }
      })();
    </script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="../../themes/tokens/tokens.css" />
    <link rel="stylesheet" href="../toggle/toggle.css" />
    <link rel="stylesheet" href="toggle-group.css" />
  </head>
  <body>
    <main class="container py-4">
      <h1 class="h4 mb-4">Toggle group</h1>
      <div class="bootcn-toggle-group" role="group" aria-label="Text formatting">
        <input type="checkbox" class="btn-check" id="bootcn-toggle-group-bold" name="bold" />
        <label class="bootcn-toggle bootcn-toggle--outline" for="bootcn-toggle-group-bold">
          <svg
            class="bootcn-icon"
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
            focusable="false"
          >
            <path d="M7 5h6a3.5 3.5 0 0 1 0 7H7z" />
            <path d="M7 12h7a3.5 3.5 0 0 1 0 7H7z" />
          </svg>
          <span class="visually-hidden">Bold</span>
        </label>
        <input
          type="checkbox"
          class="btn-check"
          id="bootcn-toggle-group-italic"
          name="italic"
          checked
        />
        <label class="bootcn-toggle bootcn-toggle--outline" for="bootcn-toggle-group-italic">
          <svg
            class="bootcn-icon"
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
            focusable="false"
          >
            <path d="M19 4h-9" />
            <path d="M14 20H5" />
            <path d="M15 4 9 20" />
          </svg>
          <span class="visually-hidden">Italic</span>
        </label>
        <input
          type="checkbox"
          class="btn-check"
          id="bootcn-toggle-group-underline"
          name="underline"
        />
        <label class="bootcn-toggle bootcn-toggle--outline" for="bootcn-toggle-group-underline">
          <svg
            class="bootcn-icon"
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
            focusable="false"
          >
            <path d="M6 4v6a6 6 0 0 0 12 0V4" />
            <path d="M4 20h16" />
          </svg>
          <span class="visually-hidden">Underline</span>
        </label>
      </div>

      <fieldset class="bootcn-toggle-group mt-3">
        <legend class="visually-hidden">Text alignment</legend>
        <input
          type="radio"
          class="btn-check"
          id="bootcn-toggle-group-left"
          name="align"
          value="left"
          checked
        />
        <label class="bootcn-toggle bootcn-toggle--outline" for="bootcn-toggle-group-left">
          <svg
            class="bootcn-icon"
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
            focusable="false"
          >
            <path d="M21 6H3" />
            <path d="M15 12H3" />
            <path d="M17 18H3" />
          </svg>
          <span class="visually-hidden">Align left</span>
        </label>
        <input
          type="radio"
          class="btn-check"
          id="bootcn-toggle-group-center"
          name="align"
          value="center"
        />
        <label class="bootcn-toggle bootcn-toggle--outline" for="bootcn-toggle-group-center">
          <svg
            class="bootcn-icon"
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
            focusable="false"
          >
            <path d="M21 6H3" />
            <path d="M17 12H7" />
            <path d="M19 18H5" />
          </svg>
          <span class="visually-hidden">Align center</span>
        </label>
        <input
          type="radio"
          class="btn-check"
          id="bootcn-toggle-group-right"
          name="align"
          value="right"
        />
        <label class="bootcn-toggle bootcn-toggle--outline" for="bootcn-toggle-group-right">
          <svg
            class="bootcn-icon"
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
            focusable="false"
          >
            <path d="M21 6H3" />
            <path d="M21 12H9" />
            <path d="M21 18H7" />
          </svg>
          <span class="visually-hidden">Align right</span>
        </label>
      </fieldset>
    </main>
  </body>
</html>
