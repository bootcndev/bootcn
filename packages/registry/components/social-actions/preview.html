<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootcn Social actions preview</title>
    <script>
      // Preview theme: ?theme=dark|light, else the docs page around the frame, else light.
      (function () {
        var theme = new URLSearchParams(location.search).get('theme');
        if (!theme) {
          try {
            theme =
              window.parent !== window &&
              window.parent.document.documentElement.classList.contains('dark')
                ? 'dark'
                : 'light';
          } catch (error) {
            theme = 'light';
          }
        }
        document.documentElement.setAttribute('data-bs-theme', theme === 'dark' ? 'dark' : 'light');
        // ?dir=rtl: right to left, with Bootstrap's RTL stylesheet.
        if (new URLSearchParams(location.search).get('dir') === 'rtl') {
          document.documentElement.setAttribute('dir', 'rtl');
          new MutationObserver(function (records, observer) {
            var link = document.querySelector('link[href*="bootstrap.min.css"]');
            if (!link) return;
            link.href = link.href.replace('bootstrap.min.css', 'bootstrap.rtl.min.css');
            observer.disconnect();
          }).observe(document.documentElement, { childList: true, subtree: true });
        }
      })();
    </script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="../../themes/tokens/tokens.css" />
    <link rel="stylesheet" href="../avatar/avatar.css" />
    <link rel="stylesheet" href="../button/button.css" />
    <link rel="stylesheet" href="social-actions.css" />
  </head>
  <body>
    <main class="container py-4">
      <h1 class="h4 mb-4">Social actions</h1>
      <div class="bootcn-social-demo">
        <div class="bootcn-social-demo__row">
          <button
            type="button"
            class="bootcn-like"
            aria-pressed="false"
            data-bootcn-like
            data-count="1240"
          >
            <svg
              class="bootcn-icon bootcn-like__icon"
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <path d="M19.5 12.6 12 20l-7.5-7.4A5 5 0 0 1 12 6a5 5 0 0 1 7.5 6.6z" />
            </svg>
            <span class="visually-hidden">Like</span>
            <span class="bootcn-like__count" data-bootcn-count>1,240</span>
          </button>
          <div
            class="bootcn-vote"
            role="group"
            aria-label="Was this answer helpful?"
            data-bootcn-vote
          >
            <button
              type="button"
              class="bootcn-vote__button"
              aria-pressed="false"
              data-bootcn-vote-button="up"
              data-count="48"
            >
              <svg
                class="bootcn-icon"
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
                focusable="false"
              >
                <path
                  d="M7 10v11H4V10zM7 10l4-7a2 2 0 0 1 3 2l-1 5h6a2 2 0 0 1 2 2.3l-1.4 7A2 2 0 0 1 17.6 21H7"
                /></svg
              ><span class="visually-hidden">Like</span
              ><span class="bootcn-vote__count" data-bootcn-count>48</span>
            </button>
            <button
              type="button"
              class="bootcn-vote__button"
              aria-pressed="false"
              data-bootcn-vote-button="down"
              data-count="3"
            >
              <svg
                class="bootcn-icon"
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
                focusable="false"
              >
                <path
                  d="M17 14V3h3v11zM17 14l-4 7a2 2 0 0 1-3-2l1-5H5a2 2 0 0 1-2-2.3l1.4-7A2 2 0 0 1 6.4 3H17"
                /></svg
              ><span class="visually-hidden">Dislike</span
              ><span class="bootcn-vote__count" data-bootcn-count>3</span>
            </button>
          </div>
          <button
            type="button"
            class="btn bootcn-button bootcn-button--default bootcn-follow"
            aria-pressed="false"
            data-bootcn-follow
          >
            <span class="bootcn-follow__off"
              ><svg
                class="bootcn-icon"
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
                focusable="false"
              >
                <path d="M12 5v14M5 12h14" />
              </svg>
              Follow</span
            >
            <span class="bootcn-follow__on"
              ><svg
                class="bootcn-icon"
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
                focusable="false"
              >
                <path d="M20 6 9 17l-5-5" />
              </svg>
              Following</span
            >
          </button>
          <button
            type="button"
            class="btn bootcn-button bootcn-button--outline bootcn-follow"
            aria-pressed="true"
            data-bootcn-follow
          >
            <span class="bootcn-follow__off"
              ><svg
                class="bootcn-icon"
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
                focusable="false"
              >
                <path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9" />
                <path d="M10 21a2 2 0 0 0 4 0" />
              </svg>
              Subscribe</span
            >
            <span class="bootcn-follow__on"
              ><svg
                class="bootcn-icon"
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
                focusable="false"
              >
                <path d="M20 6 9 17l-5-5" />
              </svg>
              Subscribed</span
            >
          </button>
        </div>
        <p class="bootcn-social-stats">
          <span
            ><data class="bootcn-social-stats__value" value="12400" data-bootcn-compact
              >12,400</data
            >
            subscribers</span
          >
          <span
            ><data class="bootcn-social-stats__value" value="318" data-bootcn-compact>318</data>
            following</span
          >
          <span
            ><data class="bootcn-social-stats__value" value="2750000" data-bootcn-compact
              >2,750,000</data
            >
            views</span
          >
        </p>
        <p class="bootcn-followed-by">
          <span class="bootcn-avatar-group" aria-hidden="true">
            <span class="bootcn-avatar bootcn-avatar--sm"
              ><span class="bootcn-avatar__fallback">OM</span></span
            >
            <span class="bootcn-avatar bootcn-avatar--sm"
              ><span class="bootcn-avatar__fallback">JL</span></span
            >
            <span class="bootcn-avatar bootcn-avatar--sm"
              ><span class="bootcn-avatar__fallback">IN</span></span
            >
          </span>
          <span
            >Followed by <a href="#olivia">Olivia Martin</a>, <a href="#jackson">Jackson Lee</a> and
            24 others</span
          >
        </p>
      </div>
    </main>
    <script src="social-actions.js"></script>
  </body>
</html>
