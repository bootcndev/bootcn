<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootcn Date input preview</title>
    <script>
      // Preview theme: ?theme=dark|light, else the docs page around the frame, else light.
      (function () {
        var theme = new URLSearchParams(location.search).get('theme');
        if (!theme) {
          try {
            theme =
              window.parent !== window &&
              window.parent.document.documentElement.classList.contains('dark')
                ? 'dark'
                : 'light';
          } catch (error) {
            theme = 'light';
          }
        }
        document.documentElement.setAttribute('data-bs-theme', theme === 'dark' ? 'dark' : 'light');
        // ?dir=rtl: right to left, with Bootstrap's RTL stylesheet.
        if (new URLSearchParams(location.search).get('dir') === 'rtl') {
          document.documentElement.setAttribute('dir', 'rtl');
          new MutationObserver(function (records, observer) {
            var link = document.querySelector('link[href*="bootstrap.min.css"]');
            if (!link) return;
            link.href = link.href.replace('bootstrap.min.css', 'bootstrap.rtl.min.css');
            observer.disconnect();
          }).observe(document.documentElement, { childList: true, subtree: true });
        }
      })();
    </script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="../../themes/tokens/tokens.css" />
    <link rel="stylesheet" href="../input/input.css" />
    <link rel="stylesheet" href="../select/select.css" />
    <link rel="stylesheet" href="../switch/switch.css" />
    <link rel="stylesheet" href="../label/label.css" />
    <link rel="stylesheet" href="../field/field.css" />
    <link rel="stylesheet" href="date-input.css" />
  </head>
  <body>
    <main class="container py-4">
      <h1 class="h4 mb-4">Date input</h1>
      <div class="bootcn-field bootcn-date-input" data-bootcn-date-input data-locale="en-GB">
        <label class="bootcn-label" for="bootcn-date-input-date">Date of birth</label>
        <input
          class="form-control bootcn-input"
          type="date"
          id="bootcn-date-input-date"
          name="birthday"
          value="1990-05-17"
          aria-describedby="bootcn-date-input-date-help"
          min="1900-01-01"
          max="2026-12-31"
          data-bootcn-date-input-native
        />
        <p class="bootcn-field__help" id="bootcn-date-input-date-help">Day, month and year.</p>
      </div>

      <div class="bootcn-field bootcn-date-input mt-3" data-bootcn-date-input data-locale="en-GB">
        <label class="bootcn-label" for="bootcn-date-input-time">Opening time</label>
        <input
          class="form-control bootcn-input"
          type="time"
          id="bootcn-date-input-time"
          name="opens"
          value="09:30"
          step="900"
          data-bootcn-date-input-native
        />
      </div>

      <div class="bootcn-field bootcn-date-input mt-3" data-bootcn-date-input data-locale="en-US">
        <label class="bootcn-label" for="bootcn-date-input-when">Meeting</label>
        <input
          class="form-control bootcn-input"
          type="datetime-local"
          id="bootcn-date-input-when"
          name="meeting"
          value="2026-11-24T14:30"
          aria-describedby="bootcn-date-input-when-help"
          data-bootcn-date-input-native
        />
        <p class="bootcn-field__help" id="bootcn-date-input-when-help">Your local time.</p>
      </div>
    </main>
    <script src="date-input.js"></script>
  </body>
</html>
