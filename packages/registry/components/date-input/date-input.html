<div class="bootcn-field bootcn-date-input" data-bootcn-date-input data-locale="en-GB">
  <label class="bootcn-label" for="bootcn-date-input-date">Date of birth</label>
  <input
    class="form-control bootcn-input"
    type="date"
    id="bootcn-date-input-date"
    name="birthday"
    value="1990-05-17"
    aria-describedby="bootcn-date-input-date-help"
    min="1900-01-01"
    max="2026-12-31"
    data-bootcn-date-input-native
  />
  <p class="bootcn-field__help" id="bootcn-date-input-date-help">Day, month and year.</p>
</div>

<div class="bootcn-field bootcn-date-input mt-3" data-bootcn-date-input data-locale="en-GB">
  <label class="bootcn-label" for="bootcn-date-input-time">Opening time</label>
  <input
    class="form-control bootcn-input"
    type="time"
    id="bootcn-date-input-time"
    name="opens"
    value="09:30"
    step="900"
    data-bootcn-date-input-native
  />
</div>

<div class="bootcn-field bootcn-date-input mt-3" data-bootcn-date-input data-locale="en-US">
  <label class="bootcn-label" for="bootcn-date-input-when">Meeting</label>
  <input
    class="form-control bootcn-input"
    type="datetime-local"
    id="bootcn-date-input-when"
    name="meeting"
    value="2026-11-24T14:30"
    aria-describedby="bootcn-date-input-when-help"
    data-bootcn-date-input-native
  />
  <p class="bootcn-field__help" id="bootcn-date-input-when-help">Your local time.</p>
</div>
