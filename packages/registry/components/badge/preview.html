<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootcn Badge preview</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="../../themes/tokens/tokens.css" />
    <link rel="stylesheet" href="badge.css" />
  </head>
  <body>
    <main class="container py-4">
      <h1 class="h4 mb-3">Badge</h1>
      <p class="text-muted mb-2">Variants</p>
      <div class="d-flex flex-wrap gap-2 align-items-center">
        <span class="badge bootcn-badge bootcn-badge--default">Default</span>
        <span class="badge bootcn-badge bootcn-badge--secondary">Secondary</span>
        <span class="badge bootcn-badge bootcn-badge--outline">Outline</span>
        <span class="badge bootcn-badge bootcn-badge--destructive">Destructive</span>
      </div>

      <div
        class="mt-4 p-3 rounded"
        data-bs-theme="dark"
        style="background-color: var(--bs-body-bg); color: var(--bs-body-color)"
      >
        <p class="mb-2">Dark theme</p>
        <div class="d-flex flex-wrap gap-2 align-items-center">
          <span class="badge bootcn-badge bootcn-badge--default">Default</span>
          <span class="badge bootcn-badge bootcn-badge--secondary">Secondary</span>
          <span class="badge bootcn-badge bootcn-badge--outline">Outline</span>
          <span class="badge bootcn-badge bootcn-badge--destructive">Destructive</span>
        </div>
      </div>
    </main>
  </body>
</html>
