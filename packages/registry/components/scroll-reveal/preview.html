<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootcn Scroll reveal preview</title>
    <script>
      // Preview theme: ?theme=dark|light, else the docs page around the frame, else light.
      (function () {
        var theme = new URLSearchParams(location.search).get('theme');
        if (!theme) {
          try {
            theme =
              window.parent !== window &&
              window.parent.document.documentElement.classList.contains('dark')
                ? 'dark'
                : 'light';
          } catch (error) {
            theme = 'light';
          }
        }
        document.documentElement.setAttribute('data-bs-theme', theme === 'dark' ? 'dark' : 'light');
        // ?dir=rtl: right to left, with Bootstrap's RTL stylesheet.
        if (new URLSearchParams(location.search).get('dir') === 'rtl') {
          document.documentElement.setAttribute('dir', 'rtl');
          new MutationObserver(function (records, observer) {
            var link = document.querySelector('link[href*="bootstrap.min.css"]');
            if (!link) return;
            link.href = link.href.replace('bootstrap.min.css', 'bootstrap.rtl.min.css');
            observer.disconnect();
          }).observe(document.documentElement, { childList: true, subtree: true });
        }
      })();
    </script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="../../themes/tokens/tokens.css" />
    <link rel="stylesheet" href="scroll-reveal.css" />
    <style>
      .bootcn-reveal-demo {
        padding-top: 32rem;
        padding-bottom: 8rem;
      }
      .bootcn-reveal-demo__grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 12rem), 1fr));
        gap: 1rem;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .bootcn-reveal-demo__card {
        padding: 1.25rem;
        border: var(--bootcn-border-width) solid var(--bootcn-border-color);
        border-radius: var(--bootcn-radius-xl);
      }
      .bootcn-reveal-demo__icon {
        display: inline-flex;
        margin-bottom: 0.75rem;
        padding: 0.5rem;
        border-radius: var(--bootcn-radius-md);
        background-color: var(--bootcn-muted);
      }
    </style>
  </head>
  <body>
    <main class="container py-4" style="max-width: 56rem">
      <h1 class="h4 mb-4">Scroll reveal</h1>
      <section class="bootcn-reveal-demo" aria-labelledby="bootcn-reveal-title">
        <h2 class="h4" id="bootcn-reveal-title" data-bootcn-reveal="up">Why teams switch</h2>
        <p class="text-body-secondary" data-bootcn-reveal="fade">
          Scroll down: each part appears as it comes into view.
        </p>
        <ul class="bootcn-reveal-demo__grid" data-bootcn-reveal-stagger>
          <li class="bootcn-reveal-demo__card">
            <span class="bootcn-reveal-demo__icon" aria-hidden="true"
              ><svg
                class="bootcn-icon"
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
                focusable="false"
              >
                <path d="M13 2 3 14h9l-1 8 10-12h-9z" /></svg
            ></span>
            <h3 class="h6 mb-1">Fast</h3>
            <p class="text-body-secondary small mb-0">Under a second on any connection.</p>
          </li>
          <li class="bootcn-reveal-demo__card">
            <span class="bootcn-reveal-demo__icon" aria-hidden="true"
              ><svg
                class="bootcn-icon"
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
                focusable="false"
              >
                <rect x="5" y="11" width="14" height="10" rx="2" />
                <path d="M8 11V7a4 4 0 0 1 8 0v4" /></svg
            ></span>
            <h3 class="h6 mb-1">Secure</h3>
            <p class="text-body-secondary small mb-0">Encrypted at rest and in transit.</p>
          </li>
          <li class="bootcn-reveal-demo__card">
            <span class="bootcn-reveal-demo__icon" aria-hidden="true"
              ><svg
                class="bootcn-icon"
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
                focusable="false"
              >
                <path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18" />
                <circle cx="12" cy="12" r="9" /></svg
            ></span>
            <h3 class="h6 mb-1">Global</h3>
            <p class="text-body-secondary small mb-0">Served from 30 regions.</p>
          </li>
        </ul>
      </section>
    </main>
    <script src="scroll-reveal.js"></script>
  </body>
</html>
