<div class="bootcn-field">
  <label class="bootcn-label" for="bootcn-number-field-guests">Guests</label>
  <div class="bootcn-number-field" data-bootcn-number-field>
    <button
      type="button"
      class="bootcn-number-field__step"
      data-bootcn-step="down"
      aria-label="Decrease guests"
      aria-controls="bootcn-number-field-guests"
      tabindex="-1"
    >
      <svg
        class="bootcn-icon"
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
        focusable="false"
      >
        <path d="M5 12h14" />
      </svg>
    </button>
    <input
      class="bootcn-number-field__input"
      type="number"
      id="bootcn-number-field-guests"
      name="guests"
      value="2"
      min="1"
      max="12"
      step="1"
      inputmode="decimal"
    />
    <button
      type="button"
      class="bootcn-number-field__step"
      data-bootcn-step="up"
      aria-label="Increase guests"
      aria-controls="bootcn-number-field-guests"
      tabindex="-1"
    >
      <svg
        class="bootcn-icon"
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
        focusable="false"
      >
        <path d="M12 5v14M5 12h14" />
      </svg>
    </button>
  </div>
</div>
