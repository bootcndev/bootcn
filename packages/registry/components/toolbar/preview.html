<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootcn Toolbar preview</title>
    <script>
      // Preview theme: ?theme=dark|light, else the docs page around the frame, else light.
      (function () {
        var theme = new URLSearchParams(location.search).get('theme');
        if (!theme) {
          try {
            theme =
              window.parent !== window &&
              window.parent.document.documentElement.classList.contains('dark')
                ? 'dark'
                : 'light';
          } catch (error) {
            theme = 'light';
          }
        }
        document.documentElement.setAttribute('data-bs-theme', theme === 'dark' ? 'dark' : 'light');
      })();
    </script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="../../themes/tokens/tokens.css" />
    <link rel="stylesheet" href="toolbar.css" />
  </head>
  <body>
    <main class="container py-4">
      <h1 class="h4 mb-4">Toolbar</h1>
      <div class="bootcn-toolbar" role="toolbar" aria-label="Text formatting" data-bootcn-toolbar>
        <div class="bootcn-toolbar__group" role="group" aria-label="Style">
          <button type="button" class="bootcn-toolbar__button" aria-pressed="false" tabindex="0">
            <svg
              class="bootcn-icon"
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <path d="M7 5h6a3.5 3.5 0 0 1 0 7H7z" />
              <path d="M7 12h7a3.5 3.5 0 0 1 0 7H7z" />
            </svg>
            <span class="visually-hidden">Bold</span>
          </button>
          <button type="button" class="bootcn-toolbar__button" aria-pressed="true" tabindex="-1">
            <svg
              class="bootcn-icon"
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <path d="M19 4h-9" />
              <path d="M14 20H5" />
              <path d="M15 4 9 20" />
            </svg>
            <span class="visually-hidden">Italic</span>
          </button>
          <button type="button" class="bootcn-toolbar__button" aria-pressed="false" tabindex="-1">
            <svg
              class="bootcn-icon"
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <path d="M6 4v6a6 6 0 0 0 12 0V4" />
              <path d="M4 20h16" />
            </svg>
            <span class="visually-hidden">Underline</span>
          </button>
        </div>
        <div class="bootcn-toolbar__separator" role="separator" aria-orientation="vertical"></div>
        <div
          class="bootcn-toolbar__group"
          role="group"
          aria-label="Alignment"
          data-bootcn-toolbar-exclusive
        >
          <button type="button" class="bootcn-toolbar__button" aria-pressed="true" tabindex="-1">
            <svg
              class="bootcn-icon"
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <path d="M21 6H3" />
              <path d="M15 12H3" />
              <path d="M17 18H3" />
            </svg>
            <span class="visually-hidden">Align left</span>
          </button>
          <button type="button" class="bootcn-toolbar__button" aria-pressed="false" tabindex="-1">
            <svg
              class="bootcn-icon"
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <path d="M21 6H3" />
              <path d="M17 12H7" />
              <path d="M19 18H5" />
            </svg>
            <span class="visually-hidden">Align center</span>
          </button>
          <button type="button" class="bootcn-toolbar__button" aria-pressed="false" tabindex="-1">
            <svg
              class="bootcn-icon"
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <path d="M21 6H3" />
              <path d="M21 12H9" />
              <path d="M21 18H7" />
            </svg>
            <span class="visually-hidden">Align right</span>
          </button>
        </div>
        <div class="bootcn-toolbar__separator" role="separator" aria-orientation="vertical"></div>
        <button type="button" class="bootcn-toolbar__button" tabindex="-1">
          <svg
            class="bootcn-icon"
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
            focusable="false"
          >
            <rect x="8" y="8" width="13" height="13" rx="2" />
            <path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3" />
          </svg>
          <span class="visually-hidden">Copy</span>
        </button>
        <button type="button" class="bootcn-toolbar__button" tabindex="-1">
          <svg
            class="bootcn-icon"
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
            focusable="false"
          >
            <path d="M3 6h18" />
            <path d="M8 6V4h8v2" />
            <path d="M19 6l-1 14H6L5 6" />
          </svg>
          <span class="visually-hidden">Delete</span>
        </button>
      </div>
    </main>
    <script src="toolbar.js"></script>
  </body>
</html>
