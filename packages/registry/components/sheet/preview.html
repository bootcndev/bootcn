<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootcn Sheet preview</title>
    <script>
      // Preview theme: ?theme=dark|light, else the docs page around the frame, else light.
      (function () {
        var theme = new URLSearchParams(location.search).get('theme');
        if (!theme) {
          try {
            theme =
              window.parent !== window &&
              window.parent.document.documentElement.classList.contains('dark')
                ? 'dark'
                : 'light';
          } catch (error) {
            theme = 'light';
          }
        }
        document.documentElement.setAttribute('data-bs-theme', theme === 'dark' ? 'dark' : 'light');
        // ?dir=rtl: right to left, with Bootstrap's RTL stylesheet.
        if (new URLSearchParams(location.search).get('dir') === 'rtl') {
          document.documentElement.setAttribute('dir', 'rtl');
          new MutationObserver(function (records, observer) {
            var link = document.querySelector('link[href*="bootstrap.min.css"]');
            if (!link) return;
            link.href = link.href.replace('bootstrap.min.css', 'bootstrap.rtl.min.css');
            observer.disconnect();
          }).observe(document.documentElement, { childList: true, subtree: true });
        }
      })();
    </script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="../../themes/tokens/tokens.css" />
    <link rel="stylesheet" href="../button/button.css" />
    <link rel="stylesheet" href="../input/input.css" />
    <link rel="stylesheet" href="sheet.css" />
  </head>
  <body>
    <main class="container py-4">
      <h1 class="h4 mb-4">Sheet</h1>
      <button
        class="btn bootcn-button bootcn-button--outline"
        type="button"
        data-bs-toggle="offcanvas"
        data-bs-target="#bootcn-sheet"
        aria-controls="bootcn-sheet"
      >
        Edit profile
      </button>

      <div
        class="offcanvas offcanvas-end bootcn-sheet"
        tabindex="-1"
        id="bootcn-sheet"
        aria-labelledby="bootcn-sheet-title"
      >
        <div class="offcanvas-header bootcn-sheet__header">
          <div>
            <h2 class="offcanvas-title bootcn-sheet__title" id="bootcn-sheet-title">
              Edit profile
            </h2>
            <p class="bootcn-sheet__description">
              Change your public details. Save when you are done.
            </p>
          </div>
          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="offcanvas"
            aria-label="Close"
          ></button>
        </div>
        <div class="offcanvas-body bootcn-sheet__body">
          <div class="bootcn-field">
            <label class="form-label bootcn-field__label" for="bootcn-sheet-name">Name</label>
            <input
              class="form-control bootcn-input"
              type="text"
              id="bootcn-sheet-name"
              name="name"
              value="Maria Papadopoulou"
              autocomplete="name"
            />
          </div>
          <div class="bootcn-field">
            <label class="form-label bootcn-field__label" for="bootcn-sheet-username"
              >Username</label
            >
            <input
              class="form-control bootcn-input"
              type="text"
              id="bootcn-sheet-username"
              name="username"
              value="@maria"
              autocomplete="username"
            />
          </div>
        </div>
        <div class="bootcn-sheet__footer">
          <button type="button" class="btn bootcn-button bootcn-button--default">
            Save changes
          </button>
          <button
            type="button"
            class="btn bootcn-button bootcn-button--outline"
            data-bs-dismiss="offcanvas"
          >
            Cancel
          </button>
        </div>
      </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
