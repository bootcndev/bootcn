<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootcn Slider preview</title>
    <script>
      // Preview theme: ?theme=dark|light, else the docs page around the frame, else light.
      (function () {
        var theme = new URLSearchParams(location.search).get('theme');
        if (!theme) {
          try {
            theme =
              window.parent !== window &&
              window.parent.document.documentElement.classList.contains('dark')
                ? 'dark'
                : 'light';
          } catch (error) {
            theme = 'light';
          }
        }
        document.documentElement.setAttribute('data-bs-theme', theme === 'dark' ? 'dark' : 'light');
      })();
    </script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="../../themes/tokens/tokens.css" />
    <link rel="stylesheet" href="../input/input.css" />
    <link rel="stylesheet" href="../label/label.css" />
    <link rel="stylesheet" href="slider.css" />
  </head>
  <body>
    <main class="container py-4">
      <h1 class="h4 mb-4">Slider</h1>
      <div class="bootcn-slider">
        <div class="bootcn-slider__header">
          <label class="bootcn-label" for="bootcn-slider-volume">Volume</label>
          <output class="bootcn-slider__value" for="bootcn-slider-volume">50</output>
        </div>
        <input
          type="range"
          class="form-range bootcn-slider__input"
          id="bootcn-slider-volume"
          name="volume"
          min="0"
          max="100"
          step="1"
          value="50"
          style="--bootcn-slider-fill: 50%"
          data-bootcn-slider
        />
      </div>

      <div class="bootcn-slider mt-4">
        <div class="bootcn-slider__header">
          <label class="bootcn-label" for="bootcn-slider-price">Maximum price</label>
          <output class="bootcn-slider__value" for="bootcn-slider-price">€200</output>
        </div>
        <input
          type="range"
          class="form-range bootcn-slider__input"
          id="bootcn-slider-price"
          name="price"
          min="0"
          max="500"
          step="10"
          value="200"
          style="--bootcn-slider-fill: 40%"
          data-bootcn-slider
          data-bootcn-slider-prefix="€"
        />
      </div>
    </main>
    <script src="slider.js"></script>
  </body>
</html>
