<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootcn Spinner preview</title>
    <script>
      // Preview theme: ?theme=dark|light, else the docs page around the frame, else light.
      (function () {
        var theme = new URLSearchParams(location.search).get('theme');
        if (!theme) {
          try {
            theme =
              window.parent !== window &&
              window.parent.document.documentElement.classList.contains('dark')
                ? 'dark'
                : 'light';
          } catch (error) {
            theme = 'light';
          }
        }
        document.documentElement.setAttribute('data-bs-theme', theme === 'dark' ? 'dark' : 'light');
      })();
    </script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="../../themes/tokens/tokens.css" />
    <link rel="stylesheet" href="spinner.css" />
  </head>
  <body>
    <main class="container py-4">
      <h1 class="h4 mb-4">Spinner</h1>
      <div class="d-flex flex-wrap align-items-center gap-4">
        <div class="spinner-border bootcn-spinner bootcn-spinner--sm" role="status">
          <span class="visually-hidden">Loading…</span>
        </div>
        <div class="spinner-border bootcn-spinner" role="status">
          <span class="visually-hidden">Loading…</span>
        </div>
        <div class="spinner-border bootcn-spinner bootcn-spinner--lg" role="status">
          <span class="visually-hidden">Loading…</span>
        </div>
        <div class="spinner-border bootcn-spinner bootcn-spinner--muted" role="status">
          <span class="visually-hidden">Loading…</span>
        </div>
      </div>

      <div class="d-flex align-items-center gap-2 mt-4" role="status">
        <span class="spinner-border bootcn-spinner bootcn-spinner--sm" aria-hidden="true"></span>
        <span>Syncing your files…</span>
      </div>
    </main>
  </body>
</html>
