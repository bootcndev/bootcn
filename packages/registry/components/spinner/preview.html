<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootcn Spinner preview</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="../../themes/tokens/tokens.css" />
    <link rel="stylesheet" href="spinner.css" />
  </head>
  <body>
    <main class="container py-4">
      <h1 class="h4 mb-4">Spinner</h1>
      <div class="d-flex flex-wrap align-items-center gap-4">
        <div class="spinner-border bootcn-spinner bootcn-spinner--sm" role="status">
          <span class="visually-hidden">Loading…</span>
        </div>
        <div class="spinner-border bootcn-spinner" role="status">
          <span class="visually-hidden">Loading…</span>
        </div>
        <div class="spinner-border bootcn-spinner bootcn-spinner--lg" role="status">
          <span class="visually-hidden">Loading…</span>
        </div>
        <div class="spinner-border bootcn-spinner bootcn-spinner--muted" role="status">
          <span class="visually-hidden">Loading…</span>
        </div>
      </div>

      <div class="d-flex align-items-center gap-2 mt-4" role="status">
        <span class="spinner-border bootcn-spinner bootcn-spinner--sm" aria-hidden="true"></span>
        <span>Syncing your files…</span>
      </div>
      <section
        class="mt-5 p-3 rounded"
        data-bs-theme="dark"
        aria-label="Dark theme"
        style="background-color: var(--bs-body-bg); color: var(--bs-body-color)"
      >
        <h2 class="h6 mb-3">Dark theme</h2>
        <div class="d-flex flex-wrap align-items-center gap-4">
          <div class="spinner-border bootcn-spinner bootcn-spinner--sm" role="status">
            <span class="visually-hidden">Loading…</span>
          </div>
          <div class="spinner-border bootcn-spinner" role="status">
            <span class="visually-hidden">Loading…</span>
          </div>
          <div class="spinner-border bootcn-spinner bootcn-spinner--lg" role="status">
            <span class="visually-hidden">Loading…</span>
          </div>
          <div class="spinner-border bootcn-spinner bootcn-spinner--muted" role="status">
            <span class="visually-hidden">Loading…</span>
          </div>
        </div>

        <div class="d-flex align-items-center gap-2 mt-4" role="status">
          <span class="spinner-border bootcn-spinner bootcn-spinner--sm" aria-hidden="true"></span>
          <span>Syncing your files…</span>
        </div>
      </section>
    </main>
  </body>
</html>
