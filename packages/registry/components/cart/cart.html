<button
  type="button"
  class="btn bootcn-button bootcn-button--ghost bootcn-button--icon bootcn-cart-toggle"
  data-bs-toggle="offcanvas"
  data-bs-target="#bootcn-cart"
  aria-controls="bootcn-cart"
  aria-label="Cart, 0 items"
  data-bootcn-cart-toggle
>
  <svg
    class="bootcn-icon"
    width="20"
    height="20"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    aria-hidden="true"
    focusable="false"
  >
    <path d="M6 7h12l1 14H5z" />
    <path d="M9 10V6a3 3 0 0 1 6 0v4" />
  </svg>
  <span class="bootcn-cart-toggle__count" data-bootcn-cart-count hidden>0</span>
</button>

<div
  class="offcanvas offcanvas-end bootcn-sheet bootcn-cart"
  tabindex="-1"
  id="bootcn-cart"
  aria-labelledby="bootcn-cart-title"
  data-bootcn-cart
  data-currency="USD"
  data-locale="en-US"
  data-free-shipping="100"
>
  <div class="offcanvas-header">
    <h2 class="bootcn-cart__title" id="bootcn-cart-title">
      Your cart <span data-bootcn-cart-title-count></span>
    </h2>
    <button
      type="button"
      class="btn-close"
      data-bs-dismiss="offcanvas"
      aria-label="Close cart"
    ></button>
  </div>
  <div class="offcanvas-body">
    <div class="bootcn-cart__shipping" data-bootcn-cart-shipping>
      <span data-bootcn-cart-shipping-text>Add $100 more for free shipping</span>
      <progress max="100" value="0" aria-label="Progress to free shipping">0%</progress>
    </div>
    <ul class="bootcn-cart__list" aria-label="Items in your cart" data-bootcn-cart-list></ul>
    <div class="bootcn-cart__empty" data-bootcn-cart-empty>
      <svg
        class="bootcn-icon"
        width="32"
        height="32"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
        focusable="false"
      >
        <path d="M6 7h12l1 14H5z" />
        <path d="M9 10V6a3 3 0 0 1 6 0v4" />
      </svg>
      <p>Your cart is empty.</p>
      <button
        type="button"
        class="btn bootcn-button bootcn-button--outline bootcn-button--sm"
        data-bs-dismiss="offcanvas"
        data-bootcn-cart-continue
      >
        Continue shopping
      </button>
    </div>
    <div class="bootcn-cart__footer" data-bootcn-cart-footer hidden>
      <div class="bootcn-cart__row">
        <span>Subtotal</span><span data-bootcn-cart-subtotal>$0.00</span>
      </div>
      <p class="bootcn-cart__note">Shipping and taxes are worked out at checkout.</p>
      <a class="btn bootcn-button bootcn-button--default" href="#checkout" data-bootcn-cart-checkout
        >Checkout</a
      >
      <button
        type="button"
        class="btn bootcn-button bootcn-button--ghost"
        data-bs-dismiss="offcanvas"
      >
        Continue shopping
      </button>
    </div>
  </div>
  <p class="visually-hidden" aria-live="polite" data-bootcn-cart-live></p>
</div>
