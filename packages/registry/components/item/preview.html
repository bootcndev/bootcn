<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootcn Item preview</title>
    <script>
      // Preview theme: ?theme=dark|light, else the docs page around the frame, else light.
      (function () {
        var theme = new URLSearchParams(location.search).get('theme');
        if (!theme) {
          try {
            theme =
              window.parent !== window &&
              window.parent.document.documentElement.classList.contains('dark')
                ? 'dark'
                : 'light';
          } catch (error) {
            theme = 'light';
          }
        }
        document.documentElement.setAttribute('data-bs-theme', theme === 'dark' ? 'dark' : 'light');
        // ?dir=rtl: right to left, with Bootstrap's RTL stylesheet.
        if (new URLSearchParams(location.search).get('dir') === 'rtl') {
          document.documentElement.setAttribute('dir', 'rtl');
          new MutationObserver(function (records, observer) {
            var link = document.querySelector('link[href*="bootstrap.min.css"]');
            if (!link) return;
            link.href = link.href.replace('bootstrap.min.css', 'bootstrap.rtl.min.css');
            observer.disconnect();
          }).observe(document.documentElement, { childList: true, subtree: true });
        }
      })();
    </script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="../../themes/tokens/tokens.css" />
    <link rel="stylesheet" href="../button/button.css" />
    <link rel="stylesheet" href="../avatar/avatar.css" />
    <link rel="stylesheet" href="item.css" />
  </head>
  <body>
    <main class="container py-4">
      <h1 class="h4 mb-4">Item</h1>
      <ul class="bootcn-item-group">
        <li class="bootcn-item bootcn-item--outline">
          <span class="bootcn-item__media bootcn-item__media--icon"
            ><svg
              class="bootcn-icon"
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z" /></svg
          ></span>
          <div class="bootcn-item__content">
            <p class="bootcn-item__title">Two-factor authentication</p>
            <p class="bootcn-item__description">Verify sign-ins with a code from your phone.</p>
          </div>
          <div class="bootcn-item__actions">
            <button
              type="button"
              class="btn bootcn-button bootcn-button--outline bootcn-button--sm"
            >
              Enable
            </button>
          </div>
        </li>
        <li class="bootcn-item bootcn-item--outline">
          <span class="bootcn-item__media"
            ><span class="bootcn-avatar bootcn-avatar--sm" aria-hidden="true"
              ><span class="bootcn-avatar__fallback">EK</span></span
            ></span
          >
          <div class="bootcn-item__content">
            <p class="bootcn-item__title">Eleni Kosta</p>
            <p class="bootcn-item__description">eleni@example.com · Owner</p>
          </div>
          <div class="bootcn-item__actions">
            <button type="button" class="btn bootcn-button bootcn-button--ghost bootcn-button--sm">
              Manage
            </button>
          </div>
        </li>
        <li>
          <a class="bootcn-item bootcn-item--muted" href="#billing">
            <div class="bootcn-item__content">
              <p class="bootcn-item__title">Billing</p>
              <p class="bootcn-item__description">Invoices, payment methods and plan.</p>
            </div>
            <svg
              class="bootcn-icon bootcn-item__chevron"
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <path d="m9 18 6-6-6-6" />
            </svg>
          </a>
        </li>
      </ul>
    </main>
  </body>
</html>
