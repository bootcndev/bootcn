<p class="bootcn-label" id="bootcn-listbox-sound-label">Notification sound</p>
<ul
  class="bootcn-listbox mt-2"
  role="listbox"
  tabindex="0"
  aria-labelledby="bootcn-listbox-sound-label"
  data-bootcn-listbox
  data-bootcn-listbox-name="sound"
>
  <li
    class="bootcn-listbox__option"
    role="option"
    id="bootcn-listbox-none"
    data-value="none"
    aria-selected="false"
  >
    <span class="bootcn-listbox__text">
      <span>None</span>
    </span>
    <svg
      class="bootcn-icon bootcn-listbox__check"
      width="16"
      height="16"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
      focusable="false"
    >
      <path d="M20 6 9 17l-5-5" />
    </svg>
  </li>
  <li
    class="bootcn-listbox__option"
    role="option"
    id="bootcn-listbox-chime"
    data-value="chime"
    aria-selected="true"
  >
    <span class="bootcn-listbox__text">
      <span>Chime</span>
      <span class="bootcn-listbox__description">Two soft notes</span>
    </span>
    <svg
      class="bootcn-icon bootcn-listbox__check"
      width="16"
      height="16"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
      focusable="false"
    >
      <path d="M20 6 9 17l-5-5" />
    </svg>
  </li>
  <li
    class="bootcn-listbox__option"
    role="option"
    id="bootcn-listbox-bell"
    data-value="bell"
    aria-selected="false"
  >
    <span class="bootcn-listbox__text">
      <span>Bell</span>
      <span class="bootcn-listbox__description">A single ring</span>
    </span>
    <svg
      class="bootcn-icon bootcn-listbox__check"
      width="16"
      height="16"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
      focusable="false"
    >
      <path d="M20 6 9 17l-5-5" />
    </svg>
  </li>
  <li
    class="bootcn-listbox__option"
    role="option"
    id="bootcn-listbox-pulse"
    data-value="pulse"
    aria-selected="false"
  >
    <span class="bootcn-listbox__text">
      <span>Pulse</span>
      <span class="bootcn-listbox__description">Three short beeps</span>
    </span>
    <svg
      class="bootcn-icon bootcn-listbox__check"
      width="16"
      height="16"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
      focusable="false"
    >
      <path d="M20 6 9 17l-5-5" />
    </svg>
  </li>
  <li
    class="bootcn-listbox__option"
    role="option"
    id="bootcn-listbox-wave"
    data-value="wave"
    aria-selected="false"
  >
    <span class="bootcn-listbox__text">
      <span>Wave</span>
      <span class="bootcn-listbox__description">A rising tone</span>
    </span>
    <svg
      class="bootcn-icon bootcn-listbox__check"
      width="16"

      fill="none"

      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
      focusable="false"
    >
      <path d="M20 6 9 17l-5-5" />
    </svg>
  </li>
</ul>
