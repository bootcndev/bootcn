<section
  class="bootcn-share"
  data-bootcn-share
  data-url="https://acme.example/blog/launch-week"
  data-title="Launch week: five new features"
  data-text="Everything we shipped this week, in one post."
  aria-labelledby="bootcn-share-title"
>
  <h2 class="bootcn-share__title" id="bootcn-share-title">Share this post</h2>
  <div class="bootcn-share__preview">
    <span class="bootcn-share__image" aria-hidden="true"></span>
    <div>
      <p class="bootcn-share__site">acme.example</p>
      <p class="bootcn-share__headline">Launch week: five new features</p>
    </div>
  </div>
  <div class="bootcn-share__copy">
    <label class="form-label bootcn-label" for="bootcn-share-link">Link</label>
    <div class="input-group">
      <input
        type="text"
        class="form-control bootcn-input"
        id="bootcn-share-link"
        value="https://acme.example/blog/launch-week"
        readonly
        data-bootcn-share-link
      />
      <button type="button" class="btn bootcn-button bootcn-button--outline" data-bootcn-share-copy>
        <svg
          class="bootcn-icon"
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
          focusable="false"
        >
          <rect x="9" y="9" width="12" height="12" rx="2" />
          <path d="M5 15V5a2 2 0 0 1 2-2h10" />
        </svg>
        <span data-bootcn-share-copy-label>Copy</span>
      </button>
    </div>
  </div>
  <ul class="bootcn-share__targets" aria-label="Share to">
    <li>
      <a
        class="bootcn-share__target"
        data-bootcn-share-to="x"
        data-service="x"
        href="#"
        target="_blank"
        rel="noopener noreferrer"
        ><span class="bootcn-share__logo" aria-hidden="true"
          ><svg
            class="bootcn-icon"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
            focusable="false"
          >
            <path d="M4 4l16 16M20 4 4 20" /></svg></span
        ><span>X</span><span class="visually-hidden"> (opens in a new tab)</span></a
      >
    </li>
    <li>
      <a
        class="bootcn-share__target"
        data-bootcn-share-to="linkedin"
        data-service="linkedin"
        href="#"
        target="_blank"
        rel="noopener noreferrer"
        ><span class="bootcn-share__logo" aria-hidden="true"
          ><svg
            class="bootcn-icon"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
            focusable="false"
          >
            <rect x="3" y="3" width="18" height="18" rx="3" />
            <path d="M8 10v7M8 7v.01M12 17v-4a2 2 0 0 1 4 0v4M12 10v7" /></svg></span
        ><span>LinkedIn</span><span class="visually-hidden"> (opens in a new tab)</span></a

    </li>
    <li>
      <a
        class="bootcn-share__target"
        data-bootcn-share-to="facebook"
        data-service="facebook"
        href="#"
        target="_blank"
        rel="noopener noreferrer"

            class="bootcn-icon"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
            focusable="false"
          >

    <li>

        data-service="whatsapp"
        href="#"
        target="_blank"
        rel="noopener noreferrer"

            width="18"
            height="18"

            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
            focusable="false"
          >
            <circle cx="12" cy="13.5" r="7" />
            <circle cx="9.5" cy="13" r=".8" />
