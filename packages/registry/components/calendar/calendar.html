<div
  class="bootcn-calendar"
  data-bootcn-calendar
  data-value="2026-11-24"
  data-min="2026-01-01"
  data-max="2027-12-31"
>
  <div class="bootcn-calendar__header">
    <button
      type="button"
      class="bootcn-calendar__nav"
      data-bootcn-calendar-prev
      aria-label="Previous month"
    >
      <svg
        class="bootcn-icon bootcn-rtl-flip"
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
        focusable="false"
      >
        <path d="m15 18-6-6 6-6" />
      </svg>
    </button>
    <h2 class="bootcn-calendar__title" id="bootcn-calendar-demo-title" aria-live="polite">
      November 2026
    </h2>
    <button
      type="button"
      class="bootcn-calendar__nav"
      data-bootcn-calendar-next
      aria-label="Next month"
    >
      <svg
        class="bootcn-icon bootcn-rtl-flip"
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
        focusable="false"
      >
        <path d="m9 18 6-6-6-6" />
      </svg>
    </button>
  </div>
  <table class="bootcn-calendar__grid" role="grid" aria-labelledby="bootcn-calendar-demo-title">
    <thead>
      <tr></tr>
    </thead>
    <tbody></tbody>
  </table>
  <input type="hidden" name="date" data-bootcn-calendar-input />
</div>
