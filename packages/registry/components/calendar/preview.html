<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootcn Calendar preview</title>
    <script>
      // Preview theme: ?theme=dark|light, else the docs page around the frame, else light.
      (function () {
        var theme = new URLSearchParams(location.search).get('theme');
        if (!theme) {
          try {
            theme =
              window.parent !== window &&
              window.parent.document.documentElement.classList.contains('dark')
                ? 'dark'
                : 'light';
          } catch (error) {
            theme = 'light';
          }
        }
        document.documentElement.setAttribute('data-bs-theme', theme === 'dark' ? 'dark' : 'light');
      })();
    </script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="../../themes/tokens/tokens.css" />
    <link rel="stylesheet" href="calendar.css" />
  </head>
  <body>
    <main class="container py-4">
      <h1 class="h4 mb-4">Calendar</h1>
      <div
        class="bootcn-calendar"
        data-bootcn-calendar
        data-value="2026-11-24"
        data-min="2026-01-01"
        data-max="2027-12-31"
      >
        <div class="bootcn-calendar__header">
          <button
            type="button"
            class="bootcn-calendar__nav"
            data-bootcn-calendar-prev
            aria-label="Previous month"
          >
            <svg
              class="bootcn-icon"
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <path d="m15 18-6-6 6-6" />
            </svg>
          </button>
          <h2 class="bootcn-calendar__title" id="bootcn-calendar-demo-title" aria-live="polite">
            November 2026
          </h2>
          <button
            type="button"
            class="bootcn-calendar__nav"
            data-bootcn-calendar-next
            aria-label="Next month"
          >
            <svg
              class="bootcn-icon"
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <path d="m9 18 6-6-6-6" />
            </svg>
          </button>
        </div>
        <table
          class="bootcn-calendar__grid"
          role="grid"
          aria-labelledby="bootcn-calendar-demo-title"
        >
          <thead>
            <tr></tr>
          </thead>
          <tbody></tbody>
        </table>
        <input type="hidden" name="date" data-bootcn-calendar-input />
      </div>
    </main>
    <script src="calendar.js"></script>
  </body>
</html>
