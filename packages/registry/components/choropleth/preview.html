  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootcn Choropleth map preview</title>
    <script>
      // Preview theme: ?theme=dark|light, else the docs page around the frame, else light.
      (function () {
        var theme = new URLSearchParams(location.search).get('theme');
        if (!theme) {
          try {
            theme =
              window.parent !== window &&
              window.parent.document.documentElement.classList.contains('dark')
                ? 'dark'
                : 'light';
          } catch (error) {
            theme = 'light';
          }
        }
        document.documentElement.setAttribute('data-bs-theme', theme === 'dark' ? 'dark' : 'light');
        // ?dir=rtl: right to left, with Bootstrap's RTL stylesheet.
        if (new URLSearchParams(location.search).get('dir') === 'rtl') {
          document.documentElement.setAttribute('dir', 'rtl');
          new MutationObserver(function (records, observer) {
            var link = document.querySelector('link[href*="bootstrap.min.css"]');
            if (!link) return;
            link.href = link.href.replace('bootstrap.min.css', 'bootstrap.rtl.min.css');
            observer.disconnect();
          }).observe(document.documentElement, { childList: true, subtree: true });
        }
      })();
    </script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="../../themes/tokens/tokens.css" />
    <link rel="stylesheet" href="../input/input.css" />
    <link rel="stylesheet" href="../label/label.css" />
    <link rel="stylesheet" href="../select/select.css" />
    <link rel="stylesheet" href="choropleth.css" />
  </head>
  <body>
    <main class="container py-4">
      <h1 class="h4 mb-4">Choropleth map</h1>
      <figure
        class="bootcn-choropleth"
        data-bootcn-choropleth
        data-geo-name="romania-counties"
        data-locale="en-IE"
        aria-labelledby="bootcn-choropleth-title"
      >
        <figcaption class="bootcn-choropleth__title" id="bootcn-choropleth-title">
          Sales by county
        </figcaption>
        <div class="bootcn-choropleth__metric">
          <label class="bootcn-label" for="bootcn-choropleth-metric">Colour by</label>
          <select
            class="form-select bootcn-select"
            id="bootcn-choropleth-metric"
            data-bootcn-choropleth-metric
          >
            <option value="revenue">Estimated revenue / year</option>
            <option value="resellers">Resellers</option>
            <option value="businesses">Businesses</option>
          </select>
        </div>
        <div class="bootcn-choropleth__map" data-bootcn-choropleth-map>
          <div class="bootcn-choropleth__zoom" role="group" aria-label="Zoom">
            <button
              type="button"
              class="bootcn-choropleth__zoom-button"
              data-bootcn-choropleth-zoom="in"
              aria-label="Zoom in"
            >
              <svg
                class="bootcn-icon"
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
                focusable="false"
              >
                <path d="M12 5v14M5 12h14" />
              </svg>
            </button>
            <button
              type="button"
              class="bootcn-choropleth__zoom-button"
              data-bootcn-choropleth-zoom="out"
              aria-label="Zoom out"
            >
              <svg
                class="bootcn-icon"
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
                focusable="false"
              >
                <path d="M5 12h14" />
              </svg>
            </button>
            <button
              type="button"
              class="bootcn-choropleth__zoom-button"
              data-bootcn-choropleth-zoom="reset"
              aria-label="Reset zoom"
            >
              <svg
                class="bootcn-icon"
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
                focusable="false"
              >
                <path d="M3 12a9 9 0 1 0 3-6.7L3 8" />
                <path d="M3 3v5h5" />
              </svg>
            </button>
          </div>
          <p class="bootcn-choropleth__loading">Loading the map…</p>
          <div class="bootcn-choropleth__tooltip" aria-hidden="true" hidden></div>
        </div>
        <div class="bootcn-choropleth__legend" data-bootcn-choropleth-legend></div>
        <details class="bootcn-choropleth__data">
          <summary>Show data</summary>
          <div class="bootcn-choropleth__table" data-bootcn-choropleth-table></div>
        </details>
        <p class="bootcn-choropleth__source">
          Boundaries:
          <a href="https://www.geoboundaries.org/" target="_blank" rel="noreferrer"
            >geoBoundaries</a
          >
          (World Bank, CC BY 4.0), simplified. Sample figures.
        </p>
