<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootcn Checkbox preview</title>
    <script>
      // Preview theme: ?theme=dark|light, else the docs page around the frame, else light.
      (function () {
        var theme = new URLSearchParams(location.search).get('theme');
        if (!theme) {
          try {
            theme =
              window.parent !== window &&
              window.parent.document.documentElement.classList.contains('dark')
                ? 'dark'
                : 'light';
          } catch (error) {
            theme = 'light';
          }
        }
        document.documentElement.setAttribute('data-bs-theme', theme === 'dark' ? 'dark' : 'light');
      })();
    </script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="../../themes/tokens/tokens.css" />
    <link rel="stylesheet" href="checkbox.css" />
  </head>
  <body>
    <main class="container py-4">
      <h1 class="h4 mb-4">Checkbox</h1>
      <div class="form-check bootcn-checkbox">
        <input
          class="form-check-input bootcn-checkbox__input"
          type="checkbox"
          id="bootcn-checkbox-terms"
          name="terms"
        />
        <label class="form-check-label bootcn-checkbox__label" for="bootcn-checkbox-terms"
          >Accept terms and conditions</label
        >
      </div>

      <div class="form-check bootcn-checkbox mt-3">
        <input
          class="form-check-input bootcn-checkbox__input"
          type="checkbox"
          id="bootcn-checkbox-news"
          name="newsletter"
          checked
          aria-describedby="bootcn-checkbox-news-description"
        />
        <label class="form-check-label bootcn-checkbox__label" for="bootcn-checkbox-news"
          >Product updates</label
        >
        <p class="bootcn-checkbox__description" id="bootcn-checkbox-news-description">
          One email a month. Unsubscribe at any time.
        </p>
      </div>

      <div class="form-check bootcn-checkbox mt-3">
        <input
          class="form-check-input bootcn-checkbox__input"
          type="checkbox"
          id="bootcn-checkbox-required"
          name="consent"
          required
          aria-invalid="true"
          aria-describedby="bootcn-checkbox-required-error"
        />
        <label class="form-check-label bootcn-checkbox__label" for="bootcn-checkbox-required"
          >I agree to the data policy</label
        >
        <p class="bootcn-checkbox__error" id="bootcn-checkbox-required-error">
          You must agree to continue.
        </p>
      </div>

      <div class="form-check bootcn-checkbox mt-3">
        <input
          class="form-check-input bootcn-checkbox__input"
          type="checkbox"
          id="bootcn-checkbox-disabled"
          disabled
        />
        <label class="form-check-label bootcn-checkbox__label" for="bootcn-checkbox-disabled"
          >Disabled option</label
        >
      </div>
    </main>
  </body>
</html>
