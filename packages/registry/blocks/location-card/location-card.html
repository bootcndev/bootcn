<section class="card bootcn-card bootcn-location" aria-labelledby="bootcn-location-title">
  <div class="bootcn-location__grid">
    <div class="bootcn-location__info">
      <h2 class="bootcn-card__title" id="bootcn-location-title">Visit our studio</h2>
      <address class="bootcn-location__address">
        <svg
          class="bootcn-icon"
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
          focusable="false"
        >
          <path d="M12 21s-7-6.3-7-12a7 7 0 0 1 14 0c0 5.7-7 12-7 12z" />
          <circle cx="12" cy="9" r="2.5" />
        </svg>
        <span>Acme Studio<br />Ermou 10, 105 63 Athens<br />Greece</span>
      </address>
      <dl class="bootcn-location__hours">
        <div>
          <dt>Monday – Friday</dt>
          <dd>09:00 – 18:00</dd>
        </div>
        <div>
          <dt>Saturday</dt>
          <dd>10:00 – 14:00</dd>
        </div>
        <div>
          <dt>Sunday</dt>
          <dd>Closed</dd>
        </div>
      </dl>
      <ul class="bootcn-location__contact">
        <li>
          <svg
            class="bootcn-icon"
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
            focusable="false"
          >
            <path
              d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"
            /></svg
          ><a href="tel:+302101234567">+30&nbsp;210&nbsp;123&nbsp;4567</a>
        </li>
        <li>
          <svg
            class="bootcn-icon"
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
            focusable="false"
          >
            <rect x="3" y="5" width="18" height="14" rx="2" />
            <path d="m3 7 9 6 9-6" /></svg
          ><a href="mailto:hello@example.com">hello@example.com</a>
        </li>
      </ul>
      <a
        class="btn bootcn-button bootcn-button--default"
        href="https://www.openstreetmap.org/directions?to=37.9755%2C23.7348"
        target="_blank"
        rel="noreferrer"
      >
        <svg
          class="bootcn-icon"
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
          focusable="false"
        >
          <circle cx="6" cy="19" r="3" />
          <path d="M9 19h8.5a3.5 3.5 0 0 0 0-7h-11a3.5 3.5 0 0 1 0-7H15" />
          <circle cx="18" cy="5" r="3" />
        </svg>
        Get directions
      </a>
    </div>
    <figure
      class="bootcn-map"
      data-bootcn-map
      data-lat="37.9755"
      data-lon="23.7348"
      data-zoom="16"
      data-title="Map of Acme Studio, Ermou 10, Athens"
    >
      <div class="bootcn-map__frame">
        <div class="bootcn-map__placeholder">
          <span class="bootcn-map__pin" aria-hidden="true"
            ><svg
              class="bootcn-icon"
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <path d="M12 21s-7-6.3-7-12a7 7 0 0 1 14 0c0 5.7-7 12-7 12z" />
              <circle cx="12" cy="9" r="2.5" /></svg
          ></span>
          <p class="bootcn-map__notice">
            The map is loaded from OpenStreetMap when you ask for it.
          </p>
          <button
            type="button"
            class="btn bootcn-button bootcn-button--secondary bootcn-button--sm"
            data-bootcn-map-load
          >
            Show map
          </button>
        </div>
      </div>
      <figcaption class="bootcn-map__caption">
        Ermou 10, Athens ·
        <a
          href="https://www.openstreetmap.org/?mlat=37.9755&amp;mlon=23.7348#map=17/37.9755/23.7348"
          target="_blank"
          rel="noreferrer"
          >Open in OpenStreetMap</a
        >
      </figcaption>
    </figure>
  </div>
</section>
