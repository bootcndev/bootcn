<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootcn Forgot password card preview</title>
    <script>
      // Preview theme: ?theme=dark|light, else the docs page around the frame, else light.
      (function () {
        var theme = new URLSearchParams(location.search).get('theme');
        if (!theme) {
          try {
            theme =
              window.parent !== window &&
              window.parent.document.documentElement.classList.contains('dark')
                ? 'dark'
                : 'light';
          } catch (error) {
            theme = 'light';
          }
        }
        document.documentElement.setAttribute('data-bs-theme', theme === 'dark' ? 'dark' : 'light');
      })();
    </script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="../../themes/tokens/tokens.css" />
    <link rel="stylesheet" href="../../components/button/button.css" />
    <link rel="stylesheet" href="../../components/card/card.css" />
    <link rel="stylesheet" href="../../components/input/input.css" />
    <link rel="stylesheet" href="forgot-password-card.css" />
  </head>
  <body>
    <main class="container py-4">
      <h1 class="h4 mb-4">Forgot password card</h1>
      <section
        class="bootcn-forgot-password-card"
        aria-labelledby="bootcn-forgot-password-card-title"
      >
        <div class="card bootcn-card">
          <header class="bootcn-card__header">
            <h2 class="bootcn-card__title" id="bootcn-forgot-password-card-title">
              Reset your password
            </h2>
            <p class="bootcn-card__description">
              Enter the email you signed up with and we will send you a reset link.
            </p>
          </header>
          <form
            class="bootcn-card__content bootcn-forgot-password-card__form"
            action="#"
            method="post"
          >
            <div class="bootcn-field">
              <label for="bootcn-forgot-password-card-email" class="form-label bootcn-field__label"
                >Email</label
              >
              <input
                type="email"
                class="form-control bootcn-input"
                id="bootcn-forgot-password-card-email"
                name="email"
                autocomplete="email"
                placeholder="you@example.com"
                required
              />
            </div>
            <button type="submit" class="btn bootcn-button bootcn-button--default w-100">
              Send reset link
            </button>
            <p class="bootcn-forgot-password-card__status" role="status">
              <!-- After submitting, put the result here, e.g. "Check your inbox." -->
            </p>
          </form>
          <footer class="bootcn-card__footer bootcn-forgot-password-card__footer">
            <a class="bootcn-forgot-password-card__back" href="#sign-in">
              <svg
                class="bootcn-icon"
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
                focusable="false"
              >
                <path d="M19 12H5" />
                <path d="m11 18-6-6 6-6" />
              </svg>
              Back to sign in
            </a>
          </footer>
        </div>
      </section>
    </main>
  </body>
</html>
