<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootcn Site header preview</title>
    <script>
      // Preview theme: ?theme=dark|light, else the docs page around the frame, else light.
      (function () {
        var theme = new URLSearchParams(location.search).get('theme');
        if (!theme) {
          try {
            theme =
              window.parent !== window &&
              window.parent.document.documentElement.classList.contains('dark')
                ? 'dark'
                : 'light';
          } catch (error) {
            theme = 'light';
          }
        }
        document.documentElement.setAttribute('data-bs-theme', theme === 'dark' ? 'dark' : 'light');
        // ?dir=rtl: right to left, with Bootstrap's RTL stylesheet.
        if (new URLSearchParams(location.search).get('dir') === 'rtl') {
          document.documentElement.setAttribute('dir', 'rtl');
          new MutationObserver(function (records, observer) {
            var link = document.querySelector('link[href*="bootstrap.min.css"]');
            if (!link) return;
            link.href = link.href.replace('bootstrap.min.css', 'bootstrap.rtl.min.css');
            observer.disconnect();
          }).observe(document.documentElement, { childList: true, subtree: true });
        }
      })();
    </script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="../../themes/tokens/tokens.css" />
    <link rel="stylesheet" href="../../components/button/button.css" />
    <link rel="stylesheet" href="site-header.css" />
  </head>
  <body>
    <main class="container py-4">
      <h1 class="h4 mb-4">Site header</h1>
      <header class="bootcn-site-header">
        <nav class="navbar navbar-expand-md bootcn-site-header__nav" aria-label="Main">
          <div class="container bootcn-site-header__inner">
            <a class="navbar-brand bootcn-site-header__brand" href="#">
              <svg
                class="bootcn-icon"
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
                focusable="false"
              >
                <rect x="3" y="3" width="8" height="8" rx="2" />
                <rect x="13" y="13" width="8" height="8" rx="2" />
                <path d="M13 7h8M17 3v8M3 17h8" />
              </svg>
              Acme
            </a>
            <button
              class="navbar-toggler bootcn-site-header__toggler"
              type="button"
              data-bs-toggle="collapse"
              data-bs-target="#bootcn-site-header-menu"
              aria-controls="bootcn-site-header-menu"
              aria-expanded="false"
            >
              <svg
                class="bootcn-icon"
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
                focusable="false"
              >
                <path d="M4 6h16M4 12h16M4 18h16" />
              </svg>
              <span class="visually-hidden">Menu</span>
            </button>
            <div
              class="collapse navbar-collapse bootcn-site-header__menu"
              id="bootcn-site-header-menu"
            >
              <ul class="navbar-nav bootcn-site-header__links">
                <li class="nav-item">
                  <a class="nav-link bootcn-site-header__link" href="#features">Features</a>
                </li>
                <li class="nav-item">
                  <a class="nav-link bootcn-site-header__link" href="#customers">Customers</a>
                </li>
                <li class="nav-item">
                  <a class="nav-link bootcn-site-header__link" href="#pricing">Pricing</a>
                </li>
                <li class="nav-item">
                  <a class="nav-link bootcn-site-header__link" href="#faq">FAQ</a>
                </li>
              </ul>
              <div class="bootcn-site-header__actions">
                <a class="btn bootcn-button bootcn-button--ghost" href="#sign-in">Sign in</a>
                <a class="btn bootcn-button bootcn-button--default" href="#sign-up">Get started</a>
              </div>
            </div>
          </div>
        </nav>
      </header>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
