<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootcn Login with SSO preview</title>
    <script>
      // Preview theme: ?theme=dark|light, else the docs page around the frame, else light.
      (function () {
        var theme = new URLSearchParams(location.search).get('theme');
        if (!theme) {
          try {
            theme =
              window.parent !== window &&
              window.parent.document.documentElement.classList.contains('dark')
                ? 'dark'
                : 'light';
          } catch (error) {
            theme = 'light';
          }
        }
        document.documentElement.setAttribute('data-bs-theme', theme === 'dark' ? 'dark' : 'light');
        // ?dir=rtl: right to left, with Bootstrap's RTL stylesheet.
        if (new URLSearchParams(location.search).get('dir') === 'rtl') {
          document.documentElement.setAttribute('dir', 'rtl');
          new MutationObserver(function (records, observer) {
            var link = document.querySelector('link[href*="bootstrap.min.css"]');
            if (!link) return;
            link.href = link.href.replace('bootstrap.min.css', 'bootstrap.rtl.min.css');
            observer.disconnect();
          }).observe(document.documentElement, { childList: true, subtree: true });
        }
      })();
    </script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="../../themes/tokens/tokens.css" />
    <link rel="stylesheet" href="../../components/button/button.css" />
    <link rel="stylesheet" href="../../components/card/card.css" />
    <link rel="stylesheet" href="../../components/input/input.css" />
    <link rel="stylesheet" href="../../components/separator/separator.css" />
    <link rel="stylesheet" href="login-sso.css" />
  </head>
  <body>
    <main class="container py-4">
      <h1 class="h4 mb-4">Login with SSO</h1>
      <section class="bootcn-login-sso" aria-labelledby="bootcn-login-sso-title">
        <div class="card bootcn-card">
          <header class="bootcn-card__header bootcn-login-sso__header">
            <h2 class="bootcn-card__title" id="bootcn-login-sso-title">Welcome back</h2>
            <p class="bootcn-card__description">Sign in with your company account or your email.</p>
          </header>
          <div class="bootcn-card__content bootcn-login-sso__body">
            <button type="button" class="btn bootcn-button bootcn-button--outline w-100">
              <svg
                class="bootcn-icon"
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
                focusable="false"
              >
                <circle cx="7.5" cy="15.5" r="4.5" />
                <path d="m10.7 12.3 9.3-9.3" />
                <path d="m17 6 3 3" />
                <path d="m14 9 2 2" />
              </svg>
              Continue with SSO
            </button>
            <button type="button" class="btn bootcn-button bootcn-button--outline w-100">
              <svg
                class="bootcn-icon"
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
                focusable="false"
              >
                <rect x="3" y="5" width="18" height="14" rx="2" />
                <path d="m3 7 9 6 9-6" />
              </svg>
              Email me a sign-in link
            </button>
            <div
              class="bootcn-separator-label"
              role="separator"
              aria-label="Or sign in with a password"
            >
              <span class="bootcn-separator-label__text" aria-hidden="true"
                >Or with a password</span
              >
            </div>
            <form class="bootcn-login-sso__form" action="#" method="post">
              <div class="bootcn-field">
                <label for="bootcn-login-sso-email" class="form-label bootcn-field__label"
                  >Email</label
                >
                <input
                  type="email"
                  class="form-control bootcn-input"
                  id="bootcn-login-sso-email"
                  name="email"
                  autocomplete="email"
                  placeholder="you@example.com"
                  required
                />
              </div>
              <div class="bootcn-field">
                <div class="bootcn-login-sso__label-row">
                  <label for="bootcn-login-sso-password" class="form-label bootcn-field__label"
                    >Password</label
                  >
                  <a class="bootcn-login-sso__link" href="#forgot-password">Forgot password?</a>
                </div>
                <input
                  type="password"
                  class="form-control bootcn-input"
                  id="bootcn-login-sso-password"
                  name="password"
                  autocomplete="current-password"
                  required
                />
              </div>
              <button type="submit" class="btn bootcn-button bootcn-button--default w-100">
                Sign in
              </button>
            </form>
          </div>
          <footer class="bootcn-card__footer bootcn-login-sso__footer">
            <p class="mb-0">
              No account yet? <a class="bootcn-login-sso__link" href="#sign-up">Create one</a>
            </p>
          </footer>
        </div>
        <p class="bootcn-login-sso__legal">
          By continuing you agree to our <a href="#terms">Terms of Service</a> and
          <a href="#privacy">Privacy Policy</a>.
        </p>
      </section>
    </main>
  </body>
</html>
