<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootcn Sign-up split screen preview</title>
    <script>
      // Preview theme: ?theme=dark|light, else the docs page around the frame, else light.
      (function () {
        var theme = new URLSearchParams(location.search).get('theme');
        if (!theme) {
          try {
            theme =
              window.parent !== window &&
              window.parent.document.documentElement.classList.contains('dark')
                ? 'dark'
                : 'light';
          } catch (error) {
            theme = 'light';
          }
        }
        document.documentElement.setAttribute('data-bs-theme', theme === 'dark' ? 'dark' : 'light');
      })();
    </script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="../../themes/tokens/tokens.css" />
    <link rel="stylesheet" href="../../components/input/input.css" />
    <link rel="stylesheet" href="../../components/checkbox/checkbox.css" />
    <link rel="stylesheet" href="../../components/button/button.css" />
    <link rel="stylesheet" href="signup-split.css" />
  </head>
  <body>
    <main>
      <section class="bootcn-signup-split" aria-labelledby="bootcn-signup-split-title">
        <div class="bootcn-signup-split__aside">
          <a class="bootcn-signup-split__brand" href="#">
            <svg
              class="bootcn-icon"
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <rect x="3" y="3" width="8" height="8" rx="2" />
              <rect x="13" y="13" width="8" height="8" rx="2" />
              <path d="M13 7h8M17 3v8M3 17h8" />
            </svg>
            Acme
          </a>
          <div>
            <p class="bootcn-signup-split__pitch">Start building in minutes.</p>
            <ul class="bootcn-signup-split__features">
              <li>
                <svg
                  class="bootcn-icon"
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                  focusable="false"
                >
                  <path d="M20 6 9 17l-5-5" />
                </svg>
                Unlimited projects and pages
              </li>
              <li>
                <svg
                  class="bootcn-icon"
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                  focusable="false"
                >
                  <path d="M20 6 9 17l-5-5" />
                </svg>
                Every component, block and template
              </li>
              <li>
                <svg
                  class="bootcn-icon"
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                  focusable="false"
                >
                  <path d="M20 6 9 17l-5-5" />
                </svg>
                Light and dark mode out of the box
              </li>
            </ul>
          </div>
        </div>
        <div class="bootcn-signup-split__main">
          <div class="bootcn-signup-split__panel">
            <h1 class="bootcn-signup-split__title" id="bootcn-signup-split-title">
              Create your account
            </h1>
            <p class="bootcn-signup-split__description">
              Free for your first project. No card needed.
            </p>
            <form class="bootcn-signup-split__form" action="#" method="post">
              <div class="bootcn-field">
                <label for="bootcn-signup-split-name" class="form-label bootcn-field__label"
                  >Full name</label
                >
                <input
                  type="text"
                  class="form-control bootcn-input"
                  id="bootcn-signup-split-name"
                  name="name"
                  autocomplete="name"
                  required
                />
              </div>
              <div class="bootcn-field">
                <label for="bootcn-signup-split-email" class="form-label bootcn-field__label"
                  >Work email</label
                >
                <input
                  type="email"
                  class="form-control bootcn-input"
                  id="bootcn-signup-split-email"
                  name="email"
                  autocomplete="email"
                  placeholder="you@company.com"
                  required
                />
              </div>
              <div class="bootcn-field">
                <label for="bootcn-signup-split-password" class="form-label bootcn-field__label"
                  >Password</label
                >
                <input
                  type="password"
                  class="form-control bootcn-input"
                  id="bootcn-signup-split-password"
                  name="password"
                  autocomplete="new-password"
                  required
                  minlength="8"
                  aria-describedby="bootcn-signup-split-password-help"
                />
                <p class="bootcn-field__help" id="bootcn-signup-split-password-help">
                  At least 8 characters.
                </p>
              </div>
              <div class="form-check bootcn-checkbox">
                <input
                  class="form-check-input bootcn-checkbox__input"
                  type="checkbox"
                  id="bootcn-signup-split-terms"
                  name="terms"
                  required
                />
                <label
                  class="form-check-label bootcn-checkbox__label"
                  for="bootcn-signup-split-terms"
                >
                  I agree to the <a class="bootcn-signup-split__link" href="#terms">terms</a>
                </label>
              </div>
              <button type="submit" class="btn bootcn-button bootcn-button--default w-100">
                Create account
              </button>
            </form>
            <p class="bootcn-signup-split__footer">
              Already registered? <a class="bootcn-signup-split__link" href="#sign-in">Sign in</a>
            </p>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
