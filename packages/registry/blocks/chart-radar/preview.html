<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootcn Radar chart preview</title>
    <script>
      // Preview theme: ?theme=dark|light, else the docs page around the frame, else light.
      (function () {
        var theme = new URLSearchParams(location.search).get('theme');
        if (!theme) {
          try {
            theme =
              window.parent !== window &&
              window.parent.document.documentElement.classList.contains('dark')
                ? 'dark'
                : 'light';
          } catch (error) {
            theme = 'light';
          }
        }
        document.documentElement.setAttribute('data-bs-theme', theme === 'dark' ? 'dark' : 'light');
      })();
    </script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="../../themes/tokens/tokens.css" />
    <link rel="stylesheet" href="../../components/button/button.css" />
    <link rel="stylesheet" href="../../components/card/card.css" />
    <link rel="stylesheet" href="../../components/chart/chart.css" />
    <link rel="stylesheet" href="chart-radar.css" />
  </head>
  <body>
    <main class="container py-4">
      <h1 class="h4 mb-4">Radar chart</h1>
      <div style="max-width: 32rem">
        <section class="card bootcn-card bootcn-chart-card" aria-labelledby="chart-radar-title">
          <header class="bootcn-card__header">
            <h2 class="bootcn-card__title" id="chart-radar-title">Radar chart</h2>
            <p class="bootcn-card__description">Desktop and mobile visitors across the months.</p>
          </header>
          <div class="bootcn-card__content">
            <figure class="bootcn-chart" data-bootcn-chart>
              <figcaption class="visually-hidden">
                Desktop and mobile visitors per month, January to June 2026, on a radar.
              </figcaption>
              <script type="application/json">
                {
                  "type": "radar",
                  "categoryLabel": "Month",
                  "categories": ["Jan", "Feb", "Mar", "Apr", "May", "Jun"],
                  "series": [
                    {
                      "name": "Desktop",
                      "data": [214, 312, 248, 96, 231, 276]
                    },
                    {
                      "name": "Mobile",
                      "data": [98, 186, 142, 171, 128, 165]
                    }
                  ]
                }
              </script>
            </figure>
          </div>
          <footer class="bootcn-card__footer bootcn-chart-card__footer">
            <p class="bootcn-chart-card__trend">Desktop peaks in February</p>
            <p class="bootcn-chart-card__note">January – June 2026</p>
          </footer>
        </section>
      </div>
    </main>
    <script src="../../components/chart/chart.js"></script>
  </body>
</html>
