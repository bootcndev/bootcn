<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootcn Floating sidebar preview</title>
    <script>
      // Preview theme: ?theme=dark|light, else the docs page around the frame, else light.
      (function () {
        var theme = new URLSearchParams(location.search).get('theme');
        if (!theme) {
          try {
            theme =
              window.parent !== window &&
              window.parent.document.documentElement.classList.contains('dark')
                ? 'dark'
                : 'light';
          } catch (error) {
            theme = 'light';
          }
        }
        document.documentElement.setAttribute('data-bs-theme', theme === 'dark' ? 'dark' : 'light');
        // ?dir=rtl: right to left, with Bootstrap's RTL stylesheet.
        if (new URLSearchParams(location.search).get('dir') === 'rtl') {
          document.documentElement.setAttribute('dir', 'rtl');
          new MutationObserver(function (records, observer) {
            var link = document.querySelector('link[href*="bootstrap.min.css"]');
            if (!link) return;
            link.href = link.href.replace('bootstrap.min.css', 'bootstrap.rtl.min.css');
            observer.disconnect();
          }).observe(document.documentElement, { childList: true, subtree: true });
        }
      })();
    </script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="../../themes/tokens/tokens.css" />
    <link rel="stylesheet" href="sidebar-floating.css" />
  </head>
  <body>
    <main>
      <div class="bootcn-floating-layout">
        <nav class="bootcn-floating" aria-label="Main">
          <a class="bootcn-floating__brand" href="#">
            <svg
              class="bootcn-icon"
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <rect x="3" y="3" width="8" height="8" rx="2" />
              <rect x="13" y="13" width="8" height="8" rx="2" />
              <path d="M13 7h8M17 3v8M3 17h8" />
            </svg>
            Acme
          </a>
          <div class="bootcn-floating__group">
            <p class="bootcn-floating__heading" id="bootcn-floating-workspace">Workspace</p>
            <ul class="bootcn-floating__list" aria-labelledby="bootcn-floating-workspace">
              <li>
                <a class="bootcn-floating__link" href="#" aria-current="page"
                  ><svg
                    class="bootcn-icon"
                    width="16"
                    height="16"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                    focusable="false"
                  >
                    <path d="M3 11l9-8 9 8" />
                    <path d="M5 10v10h14V10" /></svg
                  >Dashboard</a
                >
              </li>
              <li>
                <a class="bootcn-floating__link" href="#"
                  ><svg
                    class="bootcn-icon"
                    width="16"
                    height="16"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                    focusable="false"
                  >
                    <path d="M3 13h5l2 3h4l2-3h5" />
                    <path d="M5 5h14l2 8v6H3v-6z" /></svg
                  >Inbox</a
                >
              </li>
              <li>
                <a class="bootcn-floating__link" href="#"
                  ><svg
                    class="bootcn-icon"
                    width="16"
                    height="16"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                    focusable="false"
                  >
                    <path d="M3 6h6l2 2h10v11H3z" /></svg
                  >Projects</a
                >
              </li>
            </ul>
          </div>
          <div class="bootcn-floating__group">
            <p class="bootcn-floating__heading" id="bootcn-floating-team">Team</p>
            <ul class="bootcn-floating__list" aria-labelledby="bootcn-floating-team">
              <li>
                <a class="bootcn-floating__link" href="#"
                  ><svg
                    class="bootcn-icon"
                    width="16"
                    height="16"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                    focusable="false"
                  >
                    <path d="M2 21c0-4 3-7 7-7s7 3 7 7" />
                    <circle cx="9" cy="7" r="4" />
                    <path d="M17 4a4 4 0 0 1 0 8" />
                    <path d="M22 21c0-3-2-6-5-7" /></svg
                  >Members</a
                >
              </li>
              <li>
                <a class="bootcn-floating__link" href="#"
                  ><svg
                    class="bootcn-icon"
                    width="16"
                    height="16"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                    focusable="false"
                  >
                    <circle cx="12" cy="12" r="3" />
                    <path
                      d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"
                    /></svg
                  >Settings</a
                >
              </li>
            </ul>
          </div>
        </nav>
        <div class="bootcn-floating-layout__main">
          <h1 class="bootcn-floating-layout__title">Dashboard</h1>
          <p class="bootcn-floating-layout__text">Page content goes here.</p>
        </div>
      </div>
    </main>
  </body>
</html>
