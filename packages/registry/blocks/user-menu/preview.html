<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootcn User menu preview</title>
    <script>
      // Preview theme: ?theme=dark|light, else the docs page around the frame, else light.
      (function () {
        var theme = new URLSearchParams(location.search).get('theme');
        if (!theme) {
          try {
            theme =
              window.parent !== window &&
              window.parent.document.documentElement.classList.contains('dark')
                ? 'dark'
                : 'light';
          } catch (error) {
            theme = 'light';
          }
        }
        document.documentElement.setAttribute('data-bs-theme', theme === 'dark' ? 'dark' : 'light');
        // ?dir=rtl: right to left, with Bootstrap's RTL stylesheet.
        if (new URLSearchParams(location.search).get('dir') === 'rtl') {
          document.documentElement.setAttribute('dir', 'rtl');
          new MutationObserver(function (records, observer) {
            var link = document.querySelector('link[href*="bootstrap.min.css"]');
            if (!link) return;
            link.href = link.href.replace('bootstrap.min.css', 'bootstrap.rtl.min.css');
            observer.disconnect();
          }).observe(document.documentElement, { childList: true, subtree: true });
        }
      })();
    </script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="../../themes/tokens/tokens.css" />
    <link rel="stylesheet" href="../../components/button/button.css" />
    <link rel="stylesheet" href="../../components/dropdown/dropdown.css" />
    <link rel="stylesheet" href="../../components/avatar/avatar.css" />
    <link rel="stylesheet" href="user-menu.css" />
  </head>
  <body>
    <main class="container py-4">
      <h1 class="h4 mb-4">User menu</h1>
      <div class="d-flex justify-content-end">
        <div class="dropdown bootcn-dropdown bootcn-user-menu">
          <button
            class="btn bootcn-user-menu__trigger"
            type="button"
            id="bootcn-user-menu-trigger"
            data-bs-toggle="dropdown"
            aria-expanded="false"
          >
            <span class="bootcn-avatar bootcn-avatar--sm" aria-hidden="true"
              ><span class="bootcn-avatar__fallback">OM</span></span
            >
            <span class="bootcn-user-menu__name">Olivia Martin</span>
            <svg
              class="bootcn-user-menu__chevron"
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <path d="M6 9l6 6 6-6" />
            </svg>
          </button>
          <ul
            class="dropdown-menu dropdown-menu-end bootcn-dropdown__menu"
            aria-labelledby="bootcn-user-menu-trigger"
          >
            <li>
              <p class="dropdown-header bootcn-user-menu__header">
                <span class="bootcn-user-menu__header-name">Olivia Martin</span>
                <span class="bootcn-user-menu__email">olivia@example.com</span>
              </p>
            </li>
            <li><hr class="dropdown-divider bootcn-dropdown__divider" /></li>
            <li><a class="dropdown-item bootcn-dropdown__item" href="#profile">Profile</a></li>
            <li><a class="dropdown-item bootcn-dropdown__item" href="#billing">Billing</a></li>
            <li><a class="dropdown-item bootcn-dropdown__item" href="#settings">Settings</a></li>
            <li><hr class="dropdown-divider bootcn-dropdown__divider" /></li>
            <li>
              <button
                class="dropdown-item bootcn-dropdown__item bootcn-dropdown__item--destructive"
                type="button"
              >
                Sign out
              </button>
            </li>
          </ul>
        </div>
      </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
