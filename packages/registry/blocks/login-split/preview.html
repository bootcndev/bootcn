<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootcn Login split screen preview</title>
    <script>
      // Preview theme: ?theme=dark|light, else the docs page around the frame, else light.
      (function () {
        var theme = new URLSearchParams(location.search).get('theme');
        if (!theme) {
          try {
            theme =
              window.parent !== window &&
              window.parent.document.documentElement.classList.contains('dark')
                ? 'dark'
                : 'light';
          } catch (error) {
            theme = 'light';
          }
        }
        document.documentElement.setAttribute('data-bs-theme', theme === 'dark' ? 'dark' : 'light');
        // ?dir=rtl: right to left, with Bootstrap's RTL stylesheet.
        if (new URLSearchParams(location.search).get('dir') === 'rtl') {
          document.documentElement.setAttribute('dir', 'rtl');
          new MutationObserver(function (records, observer) {
            var link = document.querySelector('link[href*="bootstrap.min.css"]');
            if (!link) return;
            link.href = link.href.replace('bootstrap.min.css', 'bootstrap.rtl.min.css');
            observer.disconnect();
          }).observe(document.documentElement, { childList: true, subtree: true });
        }
      })();
    </script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="../../themes/tokens/tokens.css" />
    <link rel="stylesheet" href="../../components/input/input.css" />
    <link rel="stylesheet" href="../../components/checkbox/checkbox.css" />
    <link rel="stylesheet" href="../../components/button/button.css" />
    <link rel="stylesheet" href="login-split.css" />
  </head>
  <body>
    <main>
      <section class="bootcn-login-split" aria-labelledby="bootcn-login-split-title">
        <div class="bootcn-login-split__aside">
          <a class="bootcn-login-split__brand" href="#">
            <svg
              class="bootcn-icon"
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <rect x="3" y="3" width="8" height="8" rx="2" />
              <rect x="13" y="13" width="8" height="8" rx="2" />
              <path d="M13 7h8M17 3v8M3 17h8" />
            </svg>
            Acme
          </a>
          <figure class="bootcn-login-split__quote">
            <blockquote>
              <p>“We moved our admin area to plain PHP and shipped it in a week.”</p>
            </blockquote>
            <figcaption>Isabella Nguyen, CTO at Acme</figcaption>
          </figure>
        </div>
        <div class="bootcn-login-split__main">
          <div class="bootcn-login-split__panel">
            <h1 class="bootcn-login-split__title" id="bootcn-login-split-title">Welcome back</h1>
            <p class="bootcn-login-split__description">Sign in to continue to your workspace.</p>
            <form class="bootcn-login-split__form" action="#" method="post">
              <div class="bootcn-field">
                <label for="bootcn-login-split-email" class="form-label bootcn-field__label"
                  >Email</label
                >
                <input
                  type="email"
                  class="form-control bootcn-input"
                  id="bootcn-login-split-email"
                  name="email"
                  autocomplete="email"
                  placeholder="you@example.com"
                  required
                />
              </div>
              <div class="bootcn-field">
                <div class="bootcn-login-split__label-row">
                  <label for="bootcn-login-split-password" class="form-label bootcn-field__label"
                    >Password</label
                  >
                  <a class="bootcn-login-split__link" href="#forgot-password">Forgot password?</a>
                </div>
                <input
                  type="password"
                  class="form-control bootcn-input"
                  id="bootcn-login-split-password"
                  name="password"
                  autocomplete="current-password"
                  required
                />
              </div>
              <div class="form-check bootcn-checkbox">
                <input
                  class="form-check-input bootcn-checkbox__input"
                  type="checkbox"
                  id="bootcn-login-split-remember"
                  name="remember"
                />
                <label
                  class="form-check-label bootcn-checkbox__label"
                  for="bootcn-login-split-remember"
                  >Keep me signed in</label
                >
              </div>
              <button type="submit" class="btn bootcn-button bootcn-button--default w-100">
                Sign in
              </button>
            </form>
            <p class="bootcn-login-split__footer">
              No account yet? <a class="bootcn-login-split__link" href="#sign-up">Create one</a>
            </p>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
