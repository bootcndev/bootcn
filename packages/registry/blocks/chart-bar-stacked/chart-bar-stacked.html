<section class="card bootcn-card bootcn-chart-card" aria-labelledby="chart-bar-stacked-title">
  <header class="bootcn-card__header">
    <h2 class="bootcn-card__title" id="chart-bar-stacked-title">Stacked bar chart</h2>
    <p class="bootcn-card__description">Visitors by device, stacked to show the monthly total.</p>
  </header>
  <div class="bootcn-card__content">
    <figure class="bootcn-chart" data-bootcn-chart>
      <figcaption class="visually-hidden">
        Desktop, mobile and tablet visitors per month, stacked, January to June 2026.
      </figcaption>
      <script type="application/json">
        {
          "type": "bar",
          "stacked": true,
          "categoryLabel": "Month",
          "categories": ["Jan", "Feb", "Mar", "Apr", "May", "Jun"],
          "series": [
            { "name": "Desktop", "data": [214, 312, 248, 96, 231, 276] },
            { "name": "Mobile", "data": [98, 186, 142, 171, 128, 165] },
            { "name": "Tablet", "data": [42, 51, 38, 47, 55, 61] }
          ]
        }
      </script>
    </figure>
  </div>
  <footer class="bootcn-card__footer bootcn-chart-card__footer">
    <p class="bootcn-chart-card__trend">Total up 7.8% this month</p>
    <p class="bootcn-chart-card__note">January – June 2026</p>
  </footer>
</section>
