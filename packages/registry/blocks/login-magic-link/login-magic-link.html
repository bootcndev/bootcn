<section class="bootcn-login-magic" aria-labelledby="bootcn-login-magic-title">
  <div class="card bootcn-card">
    <header class="bootcn-card__header bootcn-login-magic__header">
      <span class="bootcn-login-magic__icon" aria-hidden="true"
        ><svg
          class="bootcn-icon"
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
          focusable="false"
        >
          <rect x="3" y="5" width="18" height="14" rx="2" />
          <path d="m3 7 9 6 9-6" /></svg
      ></span>
      <h2 class="bootcn-card__title" id="bootcn-login-magic-title">Sign in with email</h2>
      <p class="bootcn-card__description">
        We'll email you a link that signs you in. No password needed.
      </p>
    </header>
    <form class="bootcn-card__content bootcn-login-magic__form" action="#" method="post">
      <div class="bootcn-field">
        <label class="bootcn-label" for="bootcn-login-magic-email">Email</label>
        <input
          class="form-control bootcn-input"
          type="email"
          id="bootcn-login-magic-email"
          name="email"
          autocomplete="email"
          placeholder="you@example.com"
          required
          aria-describedby="bootcn-login-magic-help"
        />
        <p class="bootcn-field__help" id="bootcn-login-magic-help">
          The link works once and expires in 15 minutes.
        </p>
      </div>
      <button type="submit" class="btn bootcn-button bootcn-button--default w-100">
        Email me a sign-in link
      </button>
    </form>
    <footer class="bootcn-card__footer bootcn-login-magic__footer">
      <a href="#password">Use a password instead</a>
    </footer>
  </div>
</section>
