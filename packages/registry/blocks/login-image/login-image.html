<section class="bootcn-login-image" aria-labelledby="bootcn-login-image-title">
  <div class="card bootcn-card bootcn-login-image__card">
    <div class="bootcn-login-image__body">
      <div class="bootcn-login-image__intro">
        <h2 class="bootcn-login-image__title" id="bootcn-login-image-title">Welcome back</h2>
        <p class="bootcn-login-image__text">Sign in to your Acme account.</p>
      </div>
      <form class="bootcn-login-image__form" action="#" method="post">
        <div class="bootcn-field">
          <label for="bootcn-login-image-email" class="form-label bootcn-field__label">Email</label>
          <input
            type="email"
            class="form-control bootcn-input"
            id="bootcn-login-image-email"
            name="email"
            autocomplete="email"
            placeholder="you@example.com"
            required
          />
        </div>
        <div class="bootcn-field">
          <div class="bootcn-login-image__label-row">
            <label for="bootcn-login-image-password" class="form-label bootcn-field__label"
              >Password</label
            >
            <a class="bootcn-login-image__link" href="#forgot-password">Forgot password?</a>
          </div>
          <input
            type="password"
            class="form-control bootcn-input"
            id="bootcn-login-image-password"
            name="password"
            autocomplete="current-password"
            required
          />
        </div>
        <button type="submit" class="btn bootcn-button bootcn-button--default w-100">
          Sign in
        </button>
      </form>
      <p class="bootcn-login-image__footer">
        No account yet? <a class="bootcn-login-image__link" href="#sign-up">Create one</a>
      </p>
    </div>
    <div class="bootcn-login-image__media">
      <img
        src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 500' preserveAspectRatio='xMidYMid slice'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%233f3f46'/%3E%3Cstop offset='1' stop-color='%2309090b'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='400' height='500' fill='url(%23g)'/%3E%3Ccircle cx='300' cy='120' r='90' fill='%2360a5fa' fill-opacity='.35'/%3E%3Ccircle cx='110' cy='360' r='130' fill='%232dd4bf' fill-opacity='.25'/%3E%3Ccircle cx='250' cy='330' r='60' fill='%23a78bfa' fill-opacity='.35'/%3E%3C/svg%3E"
        alt=""
      />
    </div>
  </div>
</section>
