<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootcn Vite example</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
      integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <main class="container py-5">
      <h1 class="h3 mb-3">Bootcn with Vite</h1>
      <p class="text-body-secondary">
        The markup below was copied from <code>components/ui/button.html</code> and
        <code>components/ui/dialog.html</code>, installed by the CLI.
      </p>

      <h2 class="h5 mt-4">Button</h2>
      <div class="d-flex flex-wrap gap-2">
        <button type="button" class="btn bootcn-button bootcn-button--default">Default</button>
        <button type="button" class="btn bootcn-button bootcn-button--outline">Outline</button>
        <button type="button" class="btn bootcn-button bootcn-button--ghost">Ghost</button>
      </div>

      <h2 class="h5 mt-5">Dialog</h2>
      <button
        type="button"
        class="btn bootcn-button bootcn-button--destructive"
        data-bootcn-dialog-confirm
        data-bs-toggle="modal"
        data-bs-target="#bootcn-example-dialog"
      >
        Delete project
      </button>

      <div
        class="modal fade bootcn-dialog"
        id="bootcn-example-dialog"
        tabindex="-1"
        role="dialog"
        aria-modal="true"
        aria-labelledby="bootcn-example-dialog-title"
        aria-describedby="bootcn-example-dialog-description"
      >
        <div class="modal-dialog modal-dialog-centered">
          <div class="modal-content">
            <div class="modal-header">
              <h2 class="modal-title bootcn-dialog__title" id="bootcn-example-dialog-title">
                Delete this project?
              </h2>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
                aria-label="Close dialog"
              ></button>
            </div>
            <div class="modal-body">
              <p class="bootcn-dialog__description" id="bootcn-example-dialog-description">
                This permanently removes the project and all of its data. This action cannot be
                undone.
              </p>
            </div>
            <div class="modal-footer bootcn-dialog__footer">
              <button
                type="button"
                class="btn bootcn-button bootcn-button--outline bootcn-button--sm"
                data-bs-dismiss="modal"
              >
                Cancel
              </button>
              <button
                type="button"
                class="btn bootcn-button bootcn-button--destructive bootcn-button--sm"
                data-bootcn-dialog-confirm-button
                data-bs-dismiss="modal"
              >
                Delete project
              </button>
            </div>
          </div>
        </div>
      </div>

      <p class="mt-3 mb-0" id="confirm-status" role="status"></p>
    </main>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu"
      crossorigin="anonymous"
    ></script>
    <script type="module" src="/main.js"></script>
  </body>
</html>
