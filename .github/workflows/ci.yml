name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm registry:validate
      - run: pnpm build
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: php --version
      - name: Composer package
        run: |
          set -euo pipefail
          composer validate --strict packages/composer/composer.json
          test "$(cat packages/composer/VERSION)" = "$(node -p "require('./packages/cli/package.json').version")"
          php packages/composer/tests/run.php
      - run: pnpm test:e2e
      - name: React and Vue apps, set up with the CLI
        run: pnpm exec playwright test --config tests/frameworks/playwright.config.ts
      - run: pnpm site:build
      - run: pnpm exec playwright test --config tests/docs/playwright.config.ts

  # Screenshots of every preview in light, dark and right to left, compared
  # with tests/visual/__screenshots__ (made on Linux by visual-baselines.yml).
  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: baselines
        name: Baselines exist
        run: |
          if ls tests/visual/__screenshots__/*.png >/dev/null 2>&1; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No visual baselines yet: run the Update visual baselines workflow."
          fi
      - uses: pnpm/action-setup@v4
        if: steps.baselines.outputs.ready == 'true'
        with:
          version: 11.10.0
      - uses: actions/setup-node@v4
        if: steps.baselines.outputs.ready == 'true'
        with:
          node-version: 24
          cache: pnpm
      - if: steps.baselines.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.baselines.outputs.ready == 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.baselines.outputs.ready == 'true'
        run: pnpm exec playwright test --config tests/visual/playwright.config.ts
      - name: Upload the differences
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-differences
          path: |
            playwright-report
            test-results
          retention-days: 14

  # Packs the CLI as npm would publish it and runs it on every supported Node.
  package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: npm pack --pack-destination "$RUNNER_TEMP"
        working-directory: packages/cli
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install the tarball and run it
        run: |
          set -euo pipefail
          registry="$GITHUB_WORKSPACE/packages/registry/dist"
          project="$(mktemp -d)"
          cp -R examples/plain-html/. "$project/"
          cd "$project"
          npm init -y >/dev/null
          npm install --no-audit --no-fund "$RUNNER_TEMP"/bootcn-*.tgz
          npx bootcn --version
          npx bootcn init --yes --registry "$registry"
          npx bootcn add dialog --yes
          test -s assets/js/dialog.js

  # The standalone executable (Bun-compiled, no Node.js needed): built for
  # Linux and run through the same init and add as the npm package.
  binary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: scripts/build-binaries.sh "$RUNNER_TEMP/bin" linux-x64
      - name: Run the executable without Node.js on the PATH
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/bin/bootcn-linux-x64"
          registry="$GITHUB_WORKSPACE/packages/registry/dist"
          expected="$(node -p "require('./packages/cli/package.json').version")"
          project="$(mktemp -d)"
          cp -R examples/plain-html/. "$project/"
          cd "$project"
          # A PATH without node proves the binary needs nothing else.
          env -i HOME="$HOME" PATH="/usr/bin:/bin" "$bin" --version | grep -qx "$expected"
          env -i HOME="$HOME" PATH="/usr/bin:/bin" "$bin" init --yes --registry "$registry"
          env -i HOME="$HOME" PATH="/usr/bin:/bin" "$bin" add dialog --yes
          test -s assets/js/dialog.js
          ( cd "$RUNNER_TEMP/bin" && sha256sum -c SHA256SUMS )
      - name: The install script installs it (from a local copy of the release)
        run: |
          set -euo pipefail
          version="$(node -p "require('./packages/cli/package.json').version")"
          mkdir -p "$RUNNER_TEMP/srv/cli-v$version"
          cp "$RUNNER_TEMP/bin/"* "$RUNNER_TEMP/srv/cli-v$version/"
          (cd "$RUNNER_TEMP/srv" && python3 -m http.server 8765 >/dev/null 2>&1 &)
          for i in $(seq 1 20); do curl -fs -o /dev/null http://127.0.0.1:8765/ && break; sleep 0.5; done
          BOOTCN_VERSION="$version" BOOTCN_BASE_URL=http://127.0.0.1:8765 BOOTCN_INSTALL="$RUNNER_TEMP/installed" \
            sh apps/docs/public/install.sh
          test "$("$RUNNER_TEMP/installed/bootcn" --version)" = "$version"
          # A changed download is refused.
          echo x >> "$RUNNER_TEMP/srv/cli-v$version/bootcn-linux-x64"
          if BOOTCN_VERSION="$version" BOOTCN_BASE_URL=http://127.0.0.1:8765 BOOTCN_INSTALL="$RUNNER_TEMP/bad" \
            sh apps/docs/public/install.sh; then exit 1; fi
          test ! -e "$RUNNER_TEMP/bad/bootcn"
