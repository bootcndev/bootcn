name: Deploy registry

# Publishes the docs and the registry:
#   latest:   https://bootcn.dev/
#   frozen:   https://bootcn.dev/v/<version>/  (one per registry-v<version> tag)
# to the server (rsync over SSH, restricted to the site folder by rrsync), and
# a mirror at https://bootcndev.github.io/bootcn/ (GitHub Pages) for
# projects whose bootcn.json still points there.
on:
  push:
    branches: [main]
    tags: ['registry-v*']
    paths:
      - 'packages/registry/**'
      - 'apps/docs/**'
      - 'scripts/build-site.ts'
      - '.github/workflows/deploy-registry.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # The github-pages environment only accepts deploys from main. A new tag
  # therefore starts a deploy of main, which rebuilds every tagged version.
  redeploy-from-main:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh workflow run deploy-registry.yml --repo "$GITHUB_REPOSITORY" --ref main
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tagged versions are rebuilt from their tags
      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm registry:validate
      - run: pnpm --filter @bootcn/registry test
      - run: pnpm build # registry, CLI and docs site (base /)
      - run: pnpm site:build
      - name: Upload to bootcn.dev
        env:
          DEPLOY_KEY: ${{ secrets.BOOTCN_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ vars.BOOTCN_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          rsync -rlz --delete --checksum \
            -e 'ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes' \
            _site/ bootcn-deploy@159.173.131.208:/
          rm -f ~/.ssh/deploy_key
      # The GitHub Pages mirror is served under /bootcn/.
      - run: pnpm --filter @bootcn/docs build
        env:
          DOCS_BASE: /bootcn/
      - run: pnpm site:build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Installs from bootcn.dev with the CLI built from this commit, using its
  # default registry URL (no --registry), so the URL in the CLI is checked too.
  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter bootcn build
      - name: Install from the hosted registry
        run: |
          set -euo pipefail
          project="$(mktemp -d)"
          cp -R examples/plain-html/. "$project/"
          cd "$project"
          cli="$GITHUB_WORKSPACE/packages/cli/dist/index.js"
          node "$cli" init --yes
          node "$cli" add button dialog --yes
          node "$cli" diff
          test -s assets/js/dialog.js
          test -s components/ui/dialog.html
      - name: Docs site is up
        run: |
          set -euo pipefail
          for page in "" guide/installation components/dialog previews/components/dialog/preview.html; do
            curl -fsS -o /dev/null "https://bootcn.dev/$page"
            curl -fsS -o /dev/null "https://bootcndev.github.io/bootcn/$page"
          done
